<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Moresheth</title>
<link rel="manifest" href="/static/manifest.json"/>
<meta name="theme-color" content="#0e0e10"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Moresheth"/>
<link rel="icon" href="/static/favicon.ico" type="image/x-icon"/>
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"/>
<link rel="apple-touch-startup-image" href="/static/icons/splash-iphone-14-pro.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)"/>
<link rel="apple-touch-startup-image" href="/static/icons/splash-iphone-14-promax.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)"/>
<link rel="apple-touch-startup-image" href="/static/icons/splash-iphone-14.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)"/>
<link rel="apple-touch-startup-image" href="/static/icons/splash-iphone-se.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
:root{--sidebar-w:190px;--radius:14px}

[data-theme="dark"]{
  --bg:#0e0e10;--surface:#17171c;--surface-hover:#1d1d24;--elevated:#22222b;
  --border:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.16);
  --text-primary:#eeeef2;--text-secondary:#9090a4;--text-muted:#5e5e78;
  --gold:#6ba7f5;--gold-soft:rgba(107,167,245,0.12);--gold-glow:0 0 20px rgba(107,167,245,0.18);--on-gold:#0e0e10;
  --green:#34d399;--red:#f87171;--amber:#fbbf24;--violet:#a78bfa;--violet-soft:rgba(167,139,250,0.12);--violet-border:rgba(167,139,250,0.2);
  --sidebar-bg:#0b0b0e;--sidebar-text:#7878a0;--sidebar-hover-bg:rgba(255,255,255,0.05);
  --sidebar-active-bg:rgba(107,167,245,0.12);--sidebar-active-color:#6ba7f5;
  --shadow:0 1px 4px rgba(0,0,0,0.40);--shadow-md:0 8px 32px rgba(0,0,0,0.50);
  --card-bg:#17171c;--blue:#60a5fa;
}

[data-theme="light"]{
  --bg:#f4f4f7;--surface:#ffffff;--surface-hover:#f9f9fb;--elevated:#eeeef2;
  --border:rgba(0,0,0,0.08);--border-strong:rgba(0,0,0,0.13);
  --text-primary:#121218;--text-secondary:#505064;--text-muted:#888896;
  --gold:#2d55d6;--gold-soft:rgba(45,85,214,0.08);--gold-glow:0 0 16px rgba(45,85,214,0.12);--on-gold:#ffffff;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;--violet:#7c3aed;--violet-soft:rgba(124,58,237,0.08);--violet-border:rgba(124,58,237,0.15);
  --sidebar-bg:#ebebef;--sidebar-text:#606072;--sidebar-hover-bg:rgba(0,0,0,0.04);
  --sidebar-active-bg:rgba(45,85,214,0.08);--sidebar-active-color:#2d55d6;
  --shadow:0 1px 3px rgba(0,0,0,0.07);--shadow-md:0 8px 24px rgba(0,0,0,0.12);
  --card-bg:#ffffff;--blue:#3b82f6;
}
html,body,#root{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-primary)}
body{overflow:hidden}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--sidebar-bg);display:flex;flex-direction:column;z-index:100;border-right:1px solid var(--border);box-shadow:none;transition:width 0.22s ease;overflow:hidden}
.sidebar.collapsed{width:56px}
.sidebar-logo{padding:18px 14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;min-height:72px}
.sidebar.collapsed .sidebar-logo{justify-content:center;padding:18px 0 16px}
.sidebar-logo h1{font-family:'Playfair Display',serif;font-size:15px;font-weight:400;color:var(--gold);letter-spacing:1.5px}
.sidebar-logo p{font-size:10px;color:var(--text-muted);margin-top:2px;letter-spacing:0.5px;font-weight:300}
.sidebar-toggle{background:none;border:none;cursor:pointer;color:var(--sidebar-text);padding:4px;border-radius:6px;line-height:1;transition:all 0.15s;flex-shrink:0;margin-left:auto;display:flex;align-items:center;justify-content:center}
.sidebar.collapsed .sidebar-toggle{margin-left:0}
.sidebar-toggle:hover{background:var(--sidebar-hover-bg);color:var(--text-primary)}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.sidebar.collapsed .sidebar-nav{padding:12px 6px}
.nav-section-label{font-size:10px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;padding:12px 10px 4px;white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:400;color:var(--sidebar-text);transition:all 0.15s;border:none;background:none;width:100%;text-align:left;font-family:inherit;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .nav-item{justify-content:center;padding:9px 0;gap:0}
.nav-item:hover{background:var(--sidebar-hover-bg);color:var(--text-primary)}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-color);font-weight:500;box-shadow:inset 3px 0 0 var(--gold)}
.sidebar.collapsed .nav-item.active{box-shadow:none}
.nav-icon{width:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sidebar-footer{padding:16px 10px;border-top:1px solid var(--border);overflow:hidden}
.sidebar.collapsed .sidebar-footer{padding:12px 6px}
.sidebar-bank{padding:6px 10px;border-radius:8px;font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.bank-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.main{margin-left:var(--sidebar-w);height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:margin-left 0.22s ease;flex:1;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:500;color:var(--text-primary)}
.quick-nav{display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:36px;flex-shrink:0}
.quick-nav button{position:relative;border:none;cursor:pointer;background:transparent;font-family:inherit;font-size:13px;font-weight:400;color:var(--text-muted);padding:0 16px;letter-spacing:0.3px;transition:color 0.15s}
.quick-nav button[data-active="true"]{color:var(--gold);font-weight:500}
.quick-nav button::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--gold);transform:scaleX(0);transition:transform 0.2s ease}
.quick-nav button[data-active="true"]::after{transform:scaleX(1)}
.content{flex:1;overflow-y:auto;padding:24px 20px;background:var(--bg)}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);transition:box-shadow 0.2s ease,transform 0.2s ease}
.metric-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
/* Responsive grid utilities — override inline gridTemplateColumns on mobile */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-auto-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.metric-card{padding:18px;transition:all 0.2s ease;border-radius:14px}
.metric-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.metric-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:8px}
.metric-value{font-size:25px;font-weight:300;font-family:'DM Sans',sans-serif;letter-spacing:-0.8px;color:var(--text-primary);font-variant-numeric:tabular-nums}
.metric-sub{font-size:11px;color:var(--text-muted);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--gold);color:#ffffff}
.btn-primary:hover{filter:brightness(0.88)}
[data-theme="dark"] .btn-primary{color:#0e0e10}
.btn-secondary{background:var(--elevated);color:var(--text-primary);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface-hover)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-success{background:rgba(52,211,153,0.1);color:var(--green);border:1px solid rgba(52,211,153,0.2)}
.btn-success:hover{background:rgba(52,211,153,0.15)}
.btn-ghost{background:transparent;color:var(--text-secondary)}
.btn-ghost:hover{background:var(--surface-hover)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-outline-white{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
.btn-outline-white:hover{background:var(--sidebar-hover-bg);border-color:var(--border-strong)}
.filters{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.search-input{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:400;font-family:'DM Sans',sans-serif;outline:none;color:var(--text-primary);background:var(--elevated);width:200px;transition:border-color 0.2s,box-shadow 0.2s}
.search-input:focus{border-color:var(--gold);background:var(--elevated);box-shadow:0 0 0 2px var(--gold-soft)}
.search-input::placeholder{color:var(--text-muted)}
.filter-select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:400;font-family:'DM Sans',sans-serif;outline:none;color:var(--text-primary);background:var(--elevated);cursor:pointer;transition:border-color 0.2s,box-shadow 0.2s}
.filter-select:focus{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.filter-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:400;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.date-input{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:400;font-family:'DM Sans',sans-serif;outline:none;color:var(--text-primary);background:var(--elevated);transition:border-color 0.2s,box-shadow 0.2s}
.date-input:focus{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.filter-count{margin-left:auto;font-size:12px;color:var(--text-muted);white-space:nowrap}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.table-wrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:24px;pointer-events:none;background:linear-gradient(to right,transparent,var(--bg));opacity:0;transition:opacity 0.2s}
@media(max-width:768px){.table-wrap::after{opacity:1}}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 14px;text-align:left;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);border-bottom:1px solid var(--border-strong);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:2}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface-hover)}
tbody tr.row-locked{background:rgba(96,165,250,0.06)}
tbody tr.row-locked:hover{background:rgba(96,165,250,0.1)}
tbody tr.row-review{background:rgba(251,191,36,0.06)}
tbody tr.row-review:hover{background:rgba(251,191,36,0.1)}
tbody tr.row-transfer{opacity:0.7}
tbody tr.row-excluded{opacity:0.45;background:var(--surface-hover)}
tbody tr.row-excluded:hover{background:var(--elevated)}
tbody tr.row-excluded td{text-decoration:line-through;color:var(--text-muted)}
td{padding:11px 14px;font-size:13px;font-weight:400;color:var(--text-primary)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap;letter-spacing:0.1px}
.badge-transfer{background:var(--elevated);color:var(--text-muted)}
.badge-income{background:rgba(52,211,153,0.1);color:var(--green)}
.badge-expense{background:rgba(248,113,113,0.1);color:var(--red)}
.badge-category{background:var(--gold-soft);color:var(--gold)}
.badge-unclassified{background:rgba(248,113,113,0.1);color:var(--red)}
.edit-actions{display:flex;gap:6px;align-items:center}
.amount-neg{color:var(--red);font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500}
.amount-pos{color:var(--green);font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500}
.amount-neutral{color:var(--text-secondary);font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:400}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);color:var(--text-primary);padding:12px 18px;border-radius:10px;font-size:13px;border:1px solid var(--border);box-shadow:var(--shadow-md);animation:slideUp 0.2s ease;max-width:480px;word-break:break-word}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.review-overlay,.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center}
.review-panel,.modal-panel{background:var(--surface);border-radius:18px;padding:30px;width:480px;max-width:90vw;box-shadow:var(--shadow-md)}
/* Bottom sheet drag handle (mobile) */
.sheet-handle{display:none;width:36px;height:5px;border-radius:3px;background:var(--text-muted);margin:0 auto 12px;opacity:0.5}
.review-field{margin-bottom:16px}
.review-field label{font-size:12px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:6px}
.review-field select,.review-field input{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;background:var(--elevated);transition:border-color 0.15s,box-shadow 0.15s}
.review-field select:focus,.review-field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.review-actions{display:flex;gap:8px;margin-top:24px;justify-content:flex-end}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-muted);font-size:14px;gap:10px}
.spinner{width:20px;height:20px;border:2.5px solid #e5e7eb;border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Pull-to-refresh indicator ── */
.ptr-indicator{position:fixed;left:50%;transform:translateX(-50%);z-index:100;pointer-events:none;transition:opacity 0.2s}
.ptr-spinner{width:28px;height:28px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center}
.ptr-spinner svg{width:18px;height:18px;color:var(--gold);transition:transform 0.2s}
.ptr-spinner.releasing svg{animation:spin 0.7s linear infinite}
/* ── Skeleton shimmer ── */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skeleton{border-radius:8px;background:linear-gradient(90deg,var(--elevated) 25%,rgba(255,255,255,0.06) 50%,var(--elevated) 75%);background-size:800px 100%;animation:shimmer 1.5s ease-in-out infinite}
[data-theme="light"] .skeleton{background:linear-gradient(90deg,#e8e5df 25%,rgba(255,255,255,0.6) 50%,#e8e5df 75%);background-size:800px 100%}
.skeleton-text{height:14px;margin-bottom:8px;width:80%}
.skeleton-text.short{width:40%}
.skeleton-text.medium{width:60%}
.skeleton-card{height:90px;margin-bottom:12px}
.skeleton-row{height:44px;margin-bottom:6px;border-radius:6px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:var(--text-muted);gap:8px}
.empty-icon{font-size:36px;opacity:0.4}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.section-title{font-size:14px;font-weight:500}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:14px;font-weight:500}
.settings-desc{font-size:12px;color:var(--text-muted);margin-top:2px}
.bank-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);border-radius:20px;padding:3px 10px;font-size:11px;color:#059669}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:5px}
.content::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.25)}
.sel-pill{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;height:34px;box-sizing:border-box;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.sel-pill button{border:none;cursor:pointer;border-radius:7px;padding:3px 12px;font-size:12px;font-weight:500;height:26px;font-family:inherit;transition:background 0.15s,color 0.15s}
.sel-drop{font-size:12px;border:1px solid var(--border);border-radius:8px;padding:4px 8px;background:var(--surface);color:var(--text-primary);cursor:pointer;height:34px;box-sizing:border-box;font-family:inherit;outline:none;transition:border-color 0.15s}
.sel-drop:focus{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
/* ── Mobile bottom nav bar ────────────────────────────────────────────────── */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--surface);border-top:1px solid var(--border);z-index:200;
  justify-content:space-around;align-items:stretch;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.mobile-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;border:none;background:none;cursor:pointer;
  color:var(--text-muted);font-size:10px;font-weight:400;padding:6px 0;min-height:44px;
  border-top:2px solid transparent;transition:color 0.15s,border-color 0.15s,transform 0.1s;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;font-family:inherit;letter-spacing:0.2px}
.mobile-nav-btn:active{transform:scale(0.92)}
.mobile-nav-btn.active{color:var(--gold);border-top-color:var(--gold);background:var(--gold-soft)}
.mobile-nav-btn span.nav-icon{display:flex;align-items:center;justify-content:center;width:24px;height:24px;line-height:1}
/* Mobile budget scorecard */
.mobile-budget-row{display:flex;justify-content:space-between;align-items:center;
  padding:9px 14px;border-bottom:1px solid var(--border);}
.mobile-budget-bar{height:5px;border-radius:3px;background:#e5e7eb;flex:1;margin:0 10px;overflow:hidden;}
/* ── Responsive breakpoint ────────────────────────────────────────────────── */
@media(max-width:768px){
  .sidebar{display:none!important;}
  .main{margin-left:0!important;}
  .content{padding:14px 16px calc(72px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior-y:auto;}
  .topbar{padding:env(safe-area-inset-top,0px) 14px 0 14px;height:calc(48px + env(safe-area-inset-top,0px));position:relative}
  .topbar-title{font-size:16px;font-weight:500}
  .topbar>div:last-child{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
  .bank-badge{display:none!important}
  .mobile-nav{display:flex;}
  .toast-container{bottom:calc(68px + env(safe-area-inset-bottom,0px));right:12px;left:12px;}
  .toast{max-width:100%;}
  /* Filters: wrap aggressively */
  .filters{padding:10px 12px;gap:8px;}
  .search-input{width:100%;min-width:0;}
  /* Touch-friendly inputs */
  input,select,textarea{font-size:16px!important}
  .btn,.sel-pill button{min-height:44px;touch-action:manipulation}
  /* Responsive grids on mobile */

/* ── Pull-to-refresh hook (mobile only) ─────────────────────────────── */
function usePullToRefresh(contentRef,onRefresh){
  const[ptrState,setPtrState]=useState('idle'); // idle|pulling|releasing|done
  const[pullY,setPullY]=useState(0);
  const startY=useRef(0);const active=useRef(false);
  const THRESHOLD=70;
  useEffect(()=>{
    const el=contentRef.current;if(!el)return;
    const isMobile=()=>window.innerWidth<=768;
    const onStart=e=>{if(!isMobile()||el.scrollTop>5)return;startY.current=e.touches[0].clientY;active.current=true;};
    const onMove=e=>{
      if(!active.current)return;
      const dy=e.touches[0].clientY-startY.current;
      if(dy<0||el.scrollTop>5){active.current=false;setPullY(0);setPtrState('idle');return;}
      /* Dampen the pull distance */
      const dampened=Math.min(dy*0.45,120);
      setPullY(dampened);setPtrState(dampened>=THRESHOLD?'releasing':'pulling');
      if(dy>10)e.preventDefault();
    };
    const onEnd=()=>{
      if(!active.current)return;active.current=false;
      if(ptrState==='releasing'){setPtrState('done');onRefresh();setTimeout(()=>{setPtrState('idle');setPullY(0);},600);}
      else{setPtrState('idle');setPullY(0);}
    };
    el.addEventListener('touchstart',onStart,{passive:true});
    el.addEventListener('touchmove',onMove,{passive:false});
    el.addEventListener('touchend',onEnd,{passive:true});
    return()=>{el.removeEventListener('touchstart',onStart);el.removeEventListener('touchmove',onMove);el.removeEventListener('touchend',onEnd);};
  },[contentRef,onRefresh,ptrState]);
  return{ptrState,pullY};
}

/* ── Pull-to-refresh indicator component ───────────────────────────── */
function PullToRefreshIndicator({pullY,ptrState}){
  if(ptrState==='idle'&&pullY===0)return null;
  const ready=ptrState==='releasing'||ptrState==='done';
  const rotation=Math.min(pullY/70*180,180);
  return(
    <div className="ptr-indicator" style={{top:Math.max(pullY-20,12),opacity:pullY>10?1:0}}>
      <div className={`ptr-spinner ${ready?'releasing':''}`}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
          style={{transform:ready?undefined:`rotate(${rotation}deg)`}}>
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
      </div>
    </div>
  );
}

/* ── Reusable multi-select dropdown filter ───────────────────────────── */
/* selected: null = all (no filter), Set = specific checked items.
   All checkboxes appear checked when selected is null.
   "Select All" → null.  "Clear All" → empty Set. */
function MultiSelectFilter({options,selected,onChange,label,renderOption}){
  const[open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    if(!open)return;
    const handler=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',handler);
    return()=>document.removeEventListener('mousedown',handler);
  },[open]);
  const isAll=selected===null;
  const allVals=useMemo(()=>new Set(options.map(o=>o.value)),[options]);
  const isChecked=v=>isAll||selected.has(v);
  const checkedCount=isAll?options.length:(selected?selected.size:0);
  const isFiltered=!isAll;
  const toggle=v=>{
    if(isAll){/* uncheck one from "all" → Set with everything except v */
      const n=new Set(allVals);n.delete(v);onChange(n);
    }else if(selected.has(v)){
      const n=new Set(selected);n.delete(v);onChange(n);
    }else{
      const n=new Set(selected);n.add(v);
      /* if all are now checked, go back to null */
      if(n.size>=allVals.size)onChange(null);else onChange(n);
    }
  };
  const displayText=isAll?label:checkedCount===0?`${label} (none)`:`${label} (${checkedCount}/${options.length})`;
  return(
    <div ref={ref} style={{position:'relative',display:'inline-block'}}>
      <button onClick={()=>setOpen(o=>!o)} className="filter-select"
        style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',textAlign:'left',
          border:isFiltered?'1px solid var(--gold)':'1px solid var(--border)',
          background:isFiltered?'rgba(212,164,74,0.06)':'var(--surface)',
          color:isFiltered?'var(--gold)':'var(--text-primary)',
          minWidth:0,whiteSpace:'nowrap',paddingRight:24,position:'relative'}}>
        <span style={{overflow:'hidden',textOverflow:'ellipsis'}}>{displayText}</span>
        <span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',fontSize:10,opacity:.5}}>{open?'▲':'▼'}</span>
      </button>
      {open&&<div style={{position:'absolute',top:'calc(100% + 4px)',left:0,minWidth:220,maxHeight:320,overflowY:'auto',
        background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,boxShadow:'var(--shadow-lg)',
        zIndex:50,padding:'6px 0',fontSize:13,fontFamily:'inherit'}}>
        <div style={{display:'flex',justifyContent:'space-between',padding:'4px 12px 8px',borderBottom:'1px solid var(--border)',marginBottom:4}}>
          <button style={{border:'none',background:'none',color:'var(--gold)',cursor:'pointer',fontSize:12,padding:0,fontFamily:'inherit',fontWeight:isAll?600:400}}
            onClick={()=>onChange(null)}>Select All</button>
          <button style={{border:'none',background:'none',color:'var(--text-muted)',cursor:'pointer',fontSize:12,padding:0,fontFamily:'inherit'}}
            onClick={()=>onChange(new Set())}>Clear All</button>
        </div>
        {options.map(o=>{const chk=isChecked(o.value);return(
          <div key={o.value} onClick={()=>toggle(o.value)}
            style={{display:'flex',alignItems:'center',gap:8,padding:'6px 12px',cursor:'pointer',
              background:chk?'rgba(212,164,74,0.08)':'transparent',
              color:chk?'var(--text-primary)':'var(--text-muted)'}}
            onMouseEnter={e=>e.currentTarget.style.background=chk?'rgba(212,164,74,0.12)':'var(--elevated)'}
            onMouseLeave={e=>e.currentTarget.style.background=chk?'rgba(212,164,74,0.08)':'transparent'}>
            <span style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${chk?'var(--gold)':'var(--border)'}`,
              display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:11,
              background:chk?'var(--gold)':'transparent',color:chk?'#1a1a2e':'transparent'}}>✓</span>
            <span style={{fontSize:13,fontWeight:chk?400:300}}>{renderOption?renderOption(o):o.label}</span>
          </div>
        );})}
      </div>}
    </div>
  );
}

function ReviewModal({txn,categories,onSave,onDiscard,onIgnore,onClose}){
  const[category,setCategory]=useState(txn.category_final||'');
  const[action,setAction]=useState(txn.action||'Expense');
  const[saving,setSaving]=useState(false);
  const[createRule,setCreateRule]=useState(txn.enrichment_source==='llm'||txn.enrichment_source==='fallback');
  /* When type changes, clear category if new type hides it */
  const handleTypeChange=(newType)=>{setAction(newType);if(!showCategoryForType(newType))setCategory('');};
  const handleSave=async()=>{
    setSaving(true);
    await onSave(txn.id,{category,action,needs_review:false});
    /* If checkbox is ticked and it's an LLM/fallback-sourced txn, create a rule */
    if(createRule&&showCategoryForType(action)&&category&&category!=='Unclassified'){
      try{await apiFetch(`/llm/create-rule-from-transaction/${txn.id}`,{method:'POST'});}
      catch(e){/* Non-fatal — rule creation failure shouldn't block the save */}
    }
    setSaving(false);onClose();
  };
  const isLlmOrFallback=txn.enrichment_source==='llm'||txn.enrichment_source==='fallback';
  return(
    <div className="review-overlay">
      <div className="review-panel">
        <div style={{fontSize:16,fontWeight:500,marginBottom:4}}>Review Transaction</div>
        <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:20}}>{fmtDate(txn.date)} · {txn.amount<0?'–':'+'}{fmt(txn.amount)}</div>
        <div className="review-field"><label>Description</label><input value={txn.description_display||txn.description_raw} readOnly style={{background:'var(--elevated)',color:'var(--text-muted)'}}/>
          {txn.description_display&&txn.description_display!==txn.description_raw&&<div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>Raw: {txn.description_raw}</div>}
        </div>
        <div className="review-field"><label>Type</label>
          <select value={action} onChange={e=>handleTypeChange(e.target.value)}>
            {TXN_TYPES.map(a=><option key={a}>{a}</option>)}
          </select>
        </div>
        {showCategoryForType(action)&&<div className="review-field"><label>Category</label>
          <select value={category} onChange={e=>setCategory(e.target.value)}>
            <option value="">— Select category —</option>
            {sortedCats(categories).map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
        </div>}
        {isLlmOrFallback&&showCategoryForType(action)&&
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--text-secondary)',marginTop:4,cursor:'pointer'}}>
            <input type="checkbox" checked={createRule} onChange={e=>setCreateRule(e.target.checked)}/>
            Save as rule for future transactions
          </label>}
        <div className="review-actions">
          <button className="btn btn-sm btn-ghost" onClick={onDiscard} title="Close without saving">✕ Discard</button>
          <button className="btn btn-sm btn-ghost" onClick={()=>{onIgnore(txn.id);onClose();}} title="Remove from review queue without categorizing">○ Ignore</button>
          <button className="btn btn-sm btn-success" onClick={handleSave} disabled={saving}>{saving?'…':'✓ Save'}</button>
        </div>
      </div>
    </div>
  );
}

/* ── ConfirmModal — replaces all browser confirm()/prompt() ─────────────── */
function ConfirmModal({title,body,confirmLabel='Confirm',danger=false,requiredInput=null,onConfirm,onClose}){
  const[inputVal,setInputVal]=useState('');
  const[busy,setBusy]=useState(false);
  const canConfirm=!requiredInput||inputVal===requiredInput;
  const handleConfirm=async()=>{
    if(!canConfirm||busy)return;
    setBusy(true);
    try{await onConfirm();}
    finally{setBusy(false);onClose();}
  };
  return ReactDOM.createPortal(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',zIndex:2000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'var(--card-bg)',borderRadius:12,padding:'24px 28px',width:420,maxWidth:'92vw',boxShadow:'0 8px 40px rgba(0,0,0,0.22)'}}>
        <div style={{fontWeight:400,fontSize:15,marginBottom:body?10:16,color:danger?'var(--red)':'var(--text)'}}>{title}</div>
        {body&&<div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:16,lineHeight:1.55,whiteSpace:'pre-wrap'}}>{body}</div>}
        {requiredInput&&<div style={{marginBottom:16}}>
          <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:6}}>Type <strong>{requiredInput}</strong> to confirm:</div>
          <input className="form-input" value={inputVal} onChange={e=>setInputVal(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter')handleConfirm();}}
            placeholder={requiredInput} autoFocus style={{width:'100%',boxSizing:'border-box'}}/>
        </div>}
        <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:requiredInput?0:4}}>
          <button className="btn btn-ghost" onClick={onClose} disabled={busy} style={{fontSize:13}}>Cancel</button>
          <button className="btn" disabled={!canConfirm||busy} onClick={handleConfirm}
            style={{background:danger?'var(--red)':'var(--primary)',color:'#fff',border:'none',fontSize:13,opacity:canConfirm?1:0.4,cursor:canConfirm?'pointer':'default'}}>
            {busy?'…':confirmLabel}
          </button>
        </div>
      </div>
    </div>,
    document.body
  );
}

function TxnRow({txn,categories,onSave,onReview,onSplit,selected,onToggleSelect,onBatchEdit,toast}){
  const[locked,setLocked]=useState(txn.is_locked);
  const[gcb,setGcb]=useState(txn.is_gcb||false);
  const[excluded,setExcluded]=useState(txn.is_excluded||false);
  const[editing,setEditing]=useState(false);
  const[category,setCategory]=useState(txn.category_final);
  const[action,setAction]=useState(txn.action);
  const[descClean,setDescClean]=useState(txn.description_clean||txn.description_display||txn.description_raw||'');
  const[saving,setSaving]=useState(false);
  const[expanded,setExpanded]=useState(false);
  /* Transaction info modal */
  const[showTxnInfo,setShowTxnInfo]=useState(false);
  /* Quick Rule creation */
  const[showQuickRule,setShowQuickRule]=useState(false);
  const[rulePattern,setRulePattern]=useState(txn.description_clean||txn.description_raw||'');
  const[ruleDesc,setRuleDesc]=useState(txn.description_clean||txn.description_raw||'');
  const[ruleAction,setRuleAction]=useState(txn.action||'Expense');
  const[ruleCategory,setRuleCategory]=useState(txn.category_final||'');
  const[ruleSaving,setRuleSaving]=useState(false);
  /* rowClass: excluded rows get a distinct muted style */
  const rowClass=excluded?'row-excluded':locked?'row-locked':txn.needs_review?'row-review':txn.action==='Transfer'?'row-transfer':'';
  /* When type changes in edit mode, clear category if new type hides it */
  const handleTypeChange=(newType)=>{setAction(newType);if(!showCategoryForType(newType))setCategory('');};
  const[showRulePrompt,setShowRulePrompt]=useState(false);
  const[ruleCreating,setRuleCreating]=useState(false);
  const[cm,setCm]=useState(null);
  const isLlmSource=txn.enrichment_source==='llm'||txn.enrichment_source==='override';
  const save=async()=>{
    const updates={category,action,needs_review:false};
    if(descClean!==(txn.description_clean||txn.description_display||txn.description_raw||''))updates.description_clean=descClean;
    setSaving(true);await onSave(txn.id,updates);setLocked(true);setSaving(false);setEditing(false);
    /* Only offer rule creation when enrichment came from LLM (not already a rule) */
    if(isLlmSource&&category&&category!=='Unclassified')setShowRulePrompt(true);
  };
  const createRuleFromTxn=async()=>{
    setRuleCreating(true);
    try{
      /* Use new smart rule API — uses clean merchant name, deduplicates, priority 200 */
      await apiFetch(`/llm/create-rule-from-transaction/${txn.id}`,{method:'POST'});
      onSave(txn.id,{needs_review:false});/* Mark reviewed + reload */
    }catch(e){}
    finally{setRuleCreating(false);setShowRulePrompt(false);}
  };
  const saveQuickRule=async()=>{
    if(!rulePattern.trim())return;
    setRuleSaving(true);
    try{
      const res=await apiFetch('/rules',{method:'POST',body:JSON.stringify({
        pattern:rulePattern.trim(),match_type:'contains',
        set_action:ruleAction||null,set_category:ruleCategory||null,
        set_description:ruleDesc.trim()||null,priority:100
      })});
      toast&&toast(`Rule created — ${res.reapplied?.updated??0} transactions updated (${res.reapplied?.unlocked??0} unlocked)`);
      await onSave(txn.id,{needs_review:false});/* Mark reviewed + reload */
    }catch(e){toast&&toast('Failed to create rule: '+e.message,'error');}
    finally{setRuleSaving(false);setShowQuickRule(false);}
  };
  const cancel=()=>{setCategory(txn.category_final);setAction(txn.action);setDescClean(txn.description_clean||txn.description_display||txn.description_raw||'');setEditing(false);};
  const toggleLock=async()=>{const nl=!locked;await onSave(txn.id,{is_locked:nl});setLocked(nl);};
  const toggleExclude=async()=>{const ne=!excluded;await onSave(txn.id,{is_excluded:ne});setExcluded(ne);};
  const amtClass=txn.action==='Transfer'?'amount-neutral':txn.amount<0?'amount-neg':'amount-pos';
  const typeBadge=(a)=>{const l=(a||'').toLowerCase();return l==='income'?'income':l==='transfer'?'transfer':'expense';};
  const displayAction=txn.action_display||txn.action;
  return(
    <React.Fragment>
    <tr className={rowClass} style={selected?{background:'rgba(96,165,250,0.08)'}:{}}>
      <td style={{width:28,paddingLeft:12,paddingRight:4,verticalAlign:'middle'}}>
        <input type="checkbox" checked={!!selected} onChange={()=>onToggleSelect(txn.id)} onClick={e=>e.stopPropagation()} style={{cursor:'pointer'}}/>
      </td>
      <td style={{color:'var(--text-secondary)',whiteSpace:'nowrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:4}}>
          {txn.is_split&&<span onClick={()=>setExpanded(!expanded)} style={{cursor:'pointer',display:'inline-block',transition:'transform 0.15s',transform:expanded?'rotate(90deg)':'rotate(0deg)',fontSize:10,color:'var(--text-muted)',userSelect:'none'}}>&#9654;</span>}
          {fmtDate(txn.date)}
        </div>
      </td>
      <td>
        {editing
          ?<input value={descClean} onChange={e=>setDescClean(e.target.value)} className="form-input"
            style={{fontSize:13,padding:'4px 8px',width:'100%',boxSizing:'border-box'}}
            placeholder="Display name"/>
          :<div style={{fontWeight:500,fontSize:13.5}}>{txn.description_display||txn.description_raw}</div>
        }
        <div style={{display:'flex',gap:6,alignItems:'center',marginTop:2,flexWrap:'wrap'}}>
          {txn.category_confidence<0.8&&!locked&&<span style={{fontSize:11,color:'var(--amber)'}}>{Math.round((txn.category_confidence||0)*100)}% confidence</span>}
          {txn.enrichment_source&&txn.enrichment_source!=='rule'&&(()=>{
            const src=txn.enrichment_source;
            const cfg={llm:{bg:'var(--gold-soft)',color:'var(--gold)',label:'AI'},override:{bg:'rgba(52,211,153,0.12)',color:'var(--green)',label:'saved'},fallback:{bg:'var(--elevated)',color:'var(--text-muted)',label:'fallback'}};
            const c=cfg[src]||cfg.fallback;
            return<span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:c.bg,color:c.color,fontWeight:500,flexShrink:0}} title={`Enriched by: ${src}`}>{c.label}</span>;
          })()}
          {txn.import_source&&txn.import_source!=='plaid'&&(()=>{
            const cfg={csv:{bg:'rgba(251,191,36,0.12)',color:'var(--amber)',label:'CSV'},ofx:{bg:'rgba(251,191,36,0.12)',color:'var(--amber)',label:'OFX'},manual:{bg:'var(--elevated)',color:'var(--text-muted)',label:'manual'}};
            const c=cfg[txn.import_source]||{bg:'var(--elevated)',color:'var(--text-muted)',label:txn.import_source};
            return<span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:c.bg,color:c.color,fontWeight:500,flexShrink:0}} title={`Source: ${txn.import_source}`}>{c.label}</span>;
          })()}
        </div>
      </td>
      <td><span className={amtClass}>{txn.amount<0?'–':'+'}{fmt(txn.amount)}</span></td>
      <td>
        {editing
          ?<select value={action} onChange={e=>handleTypeChange(e.target.value)} className="filter-select" style={{fontSize:12,padding:'4px 8px'}}>
            {TXN_TYPES.map(a=><option key={a}>{a}</option>)}
          </select>
          :<span className={`badge badge-${typeBadge(displayAction)}`}>{displayAction||'Expense'}</span>
        }
      </td>
      <td>
        {!showCategoryForType(displayAction)
          ?<span style={{color:'var(--text-muted)',fontSize:13}}>—</span>
          :editing
            ?<select value={category} onChange={e=>setCategory(e.target.value)} className="filter-select" style={{fontSize:12,padding:'4px 8px',width:130}}>
              <option value="">Unclassified</option>
              {sortedCats(categories).map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
            </select>
            :<span className={`badge ${normalizeCat(txn.category_final)==='Other'?'badge-unclassified':'badge-category'}`}>
              {normalizeCat(txn.category_final)}
              {txn.category_manual&&<span style={{marginLeft:4,opacity:0.5}}>✎</span>}
            </span>
        }
      </td>
      <td style={{color:'var(--text-muted)',fontSize:12,maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={txn.account_name}>{txn.account_name}</td>
      <td>
        {editing
          ?<div className="edit-actions">
            <button className="btn btn-sm btn-success" onClick={save} disabled={saving}>{saving?'…':'Save'}</button>
            <button className="btn btn-sm btn-ghost" onClick={cancel}>Cancel</button>
          </div>
          :showRulePrompt
          ?<div className="edit-actions">
            <span style={{fontSize:11,color:'var(--text-muted)'}}>Create rule?</span>
            <button className="btn btn-sm btn-success" onClick={createRuleFromTxn} disabled={ruleCreating} style={{fontSize:11}}>{ruleCreating?'…':'Yes'}</button>
            <button className="btn btn-sm btn-ghost" onClick={()=>setShowRulePrompt(false)} style={{fontSize:11}}>No</button>
          </div>
          :<div className="edit-actions">
            {txn.needs_review&&!locked&&<button className="btn btn-sm" style={{background:'var(--amber)',color:'#fff',border:'none'}} onClick={()=>onReview(txn)}>Review</button>}
            <button className="btn btn-sm" style={{padding:'0',fontSize:13,background:'var(--bg)',color:'var(--text-muted)',border:'1px solid var(--border)',borderRadius:'50%',width:26,height:26,display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0}} onClick={()=>setShowTxnInfo(true)} title="Transaction details">ⓘ</button>

              onClick={async()=>{const ng=!gcb;await onSave(txn.id,{is_gcb:ng});setGcb(ng);}}

        <td>{s.category?<span className="badge badge-category" style={{fontSize:11}}>{s.category}</span>:<span style={{color:'var(--text-muted)'}}>—</span>}</td>
