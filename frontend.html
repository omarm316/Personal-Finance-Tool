function BudgetsPage({categories,toast}){
  const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const now=new Date();
  const curYear=now.getFullYear();
  const[year,setYear]=useState(curYear);
  const[editing,setEditing]=useState(false);
  const[targets,setTargets]=useState({});
  const[actuals,setActuals]=useState({});
  const[edits,setEdits]=useState({});
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState('');

  const expenseCats=categories.filter(c=>c.category_type==='expense').map(c=>c.name).sort();

  const load=useCallback(async()=>{
    setLoading(true);setError('');
    try{
      const[t,a]=await Promise.all([apiFetch(`/budget/targets?year=${year}`),apiFetch(`/budget/actuals?year=${year}`)]);
      setTargets(t.categories||{});setActuals(a.categories||{});
    }catch(e){setError('Failed to load budget data');toast('Failed to load','error');}
    finally{setLoading(false);}
  },[year]);
  useEffect(()=>{load();},[load]);

  /* Section 6B: Sort categories by annual total descending */
  const allCatsUnsorted=[...new Set([...expenseCats,...Object.keys(targets),...Object.keys(actuals)])];
  const allCats=allCatsUnsorted.sort((a,b)=>{
    const totalA=(()=>{let s=0;for(let m=1;m<=12;m++){s+=(actuals[a]?.[String(m)]||0)+(targets[a]?.[String(m)]?.amount||0);}return s;})();
    const totalB=(()=>{let s=0;for(let m=1;m<=12;m++){s+=(actuals[b]?.[String(m)]||0)+(targets[b]?.[String(m)]?.amount||0);}return s;})();
    return totalB-totalA;
  });

  const startEdit=()=>{
    const e={};allCats.forEach(cat=>{e[cat]={};for(let m=1;m<=12;m++)e[cat][String(m)]=targets[cat]?.[String(m)]?.amount?.toString()||'';});
    setEdits(e);setEditing(true);
  };

  const saveEdits=async()=>{
    setSaving(true);setError('');
    try{
      const bulk=[];
      Object.entries(edits).forEach(([cat,months])=>{
        Object.entries(months).forEach(([m,val])=>{
          const amt=parseFloat(val);
          if(!isNaN(amt)&&amt>0)bulk.push({year,month:parseInt(m),category:cat,amount:amt});
          else if((val===''||val==='0')&&targets[cat]?.[m])bulk.push({year,month:parseInt(m),category:cat,amount:0});
        });
      });
      if(bulk.length>0)await apiFetch('/budget/targets/bulk',{method:'POST',body:JSON.stringify({targets:bulk})});
      toast('Budget targets saved');setEditing(false);await load();
    }catch(e){setError('Failed to save');toast('Failed to save','error');}
    finally{setSaving(false);}
  };

  const copyFromPrior=async()=>{
    setSaving(true);
    try{
      const prior=await apiFetch(`/budget/targets?year=${year-1}`);const priorCats=prior.categories||{};const bulk=[];
      Object.entries(priorCats).forEach(([cat,months])=>{Object.entries(months).forEach(([m,v])=>{if(v.amount>0)bulk.push({year,month:parseInt(m),category:cat,amount:v.amount});});});
      if(bulk.length>0){await apiFetch('/budget/targets/bulk',{method:'POST',body:JSON.stringify({targets:bulk})});toast(`Copied ${bulk.length} targets from ${year-1}`);await load();}
      else toast('No prior year targets found','error');
    }catch(e){toast('Failed to copy','error');}finally{setSaving(false);}
  };

  /* Helper: get budget target value */
  const getBudget=(cat,m)=>targets[cat]?.[String(m)]?.amount||0;
  /* Helper: get actual value */
  const getActual=(cat,m)=>actuals[cat]?.[String(m)]||0;
  /* Row/col totals */
  const budgetRowTotal=(cat)=>{let s=0;for(let m=1;m<=12;m++)s+=getBudget(cat,m);return s;};
  const actualRowTotal=(cat)=>{let s=0;for(let m=1;m<=12;m++)s+=getActual(cat,m);return s;};
  const budgetColTotal=(m)=>{let s=0;allCats.forEach(cat=>s+=getBudget(cat,m));return s;};
  const actualColTotal=(m)=>{let s=0;allCats.forEach(cat=>s+=getActual(cat,m));return s;};
  const budgetGrand=(()=>{let s=0;for(let m=1;m<=12;m++)s+=budgetColTotal(m);return s;})();
  const actualGrand=(()=>{let s=0;for(let m=1;m<=12;m++)s+=actualColTotal(m);return s;})();

  /* KPI values */
  const totalBudgeted=budgetGrand;
  const totalActual=actualGrand;
  const totalRemaining=totalBudgeted-totalActual;

  /* Shared table renderer */
  const renderTable=(title,getVal,rowTotal,colTotal,grand,isBudget)=>(
    <div className="card" style={{marginBottom:20}}>
      <div className="section-header" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div className="section-title">{title} — {year}</div>
        <div style={{display:'flex',gap:8}}>
          {isBudget&&!editing&&<button className="btn btn-sm btn-secondary" onClick={copyFromPrior} disabled={saving}>Copy from {year-1}</button>}
          {isBudget&&!editing&&<button className="btn btn-sm btn-primary" onClick={startEdit}>Edit</button>}
          {isBudget&&editing&&<button className="btn btn-sm btn-ghost" onClick={()=>setEditing(false)}>Cancel</button>}
          {isBudget&&editing&&<button className="btn btn-sm btn-success" onClick={saveEdits} disabled={saving}>{saving?'Saving…':'Save All'}</button>}
        </div>
      </div>
      <div className="table-wrap" style={{overflowX:'auto'}}>
        <table style={{minWidth:900}}>
          <thead><tr>
            <th style={{position:'sticky',left:0,background:'#fafafa',zIndex:2,minWidth:140}}>Category</th>
            {MO.map((m,i)=><th key={i} style={{textAlign:'right',minWidth:70}}>{m}</th>)}
            <th style={{textAlign:'right',fontWeight:700,minWidth:80}}>Total</th>
          </tr></thead>
          <tbody>
            {allCats.map(cat=>{
              const total=rowTotal(cat);
              if(!isBudget&&total===0)return null;
              return(<tr key={cat}>
                <td style={{fontWeight:500,position:'sticky',left:0,background:'#fff',zIndex:1,fontSize:13}}>{cat}</td>
                {MO.map((m,i)=>{
                  const mo=i+1;const val=getVal(cat,mo);
                  if(isBudget&&editing){
                    return<td key={i} style={{padding:'4px 6px'}}>
                      <input type="number" step="1" min="0" value={edits[cat]?.[String(mo)]||''}
                        onChange={e=>{const v=e.target.value;setEdits(prev=>({...prev,[cat]:{...prev[cat],[String(mo)]:v}}));}}
                        style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12,textAlign:'right',fontFamily:'DM Mono'}} placeholder="0"/>
                    </td>;
                  }
                  const color=!isBudget?(val>0?'var(--red)':'var(--text-muted)'):(val>0?'var(--text-primary)':'var(--text-muted)');
                  return<td key={i} style={{textAlign:'right',fontFamily:'DM Mono',fontSize:12,color}}>{val>0?fmt(val):'—'}</td>;
                })}
                <td style={{textAlign:'right',fontFamily:'DM Mono',fontSize:12,fontWeight:600,color:total>0?(!isBudget?'var(--red)':'var(--text-primary)'):'var(--text-muted)'}}>{total>0?fmt(total):'—'}</td>
              </tr>);
            })}
            <tr style={{borderTop:'2px solid var(--border)',background:'#fafafa'}}>
              <td style={{fontWeight:700,position:'sticky',left:0,background:'#fafafa',zIndex:1}}>Total</td>
              {MO.map((m,i)=>{const val=colTotal(i+1);return<td key={i} style={{textAlign:'right',fontFamily:'DM Mono',fontSize:12,fontWeight:600}}>{val>0?fmt(val):'—'}</td>;})}
              <td style={{textAlign:'right',fontFamily:'DM Mono',fontSize:13,fontWeight:700}}>{fmt(grand)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );

  return(
    <div>
      {/* Year selector */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:4,background:'var(--card-bg)',border:'1px solid var(--border)',borderRadius:10,padding:4}}>
          {[curYear-1,curYear,curYear+1].map(y=>(
            <button key={y} className={`btn btn-sm ${year===y?'btn-primary':'btn-ghost'}`} onClick={()=>{setYear(y);setEditing(false);}} style={{borderRadius:7}}>{y}</button>
          ))}
        </div>
      </div>

      {error&&<div style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{error}</div>}

      {/* KPI cards */}
      <div className="metric-grid" style={{gridTemplateColumns:'repeat(4,1fr)',marginBottom:20}}>
        <div className="card metric-card"><div className="metric-label">Total Budgeted ({year})</div><div className="metric-value">{fmt(totalBudgeted)}</div></div>
        <div className="card metric-card"><div className="metric-label">Total Spent</div><div className="metric-value" style={{color:'var(--red)'}}>{fmt(totalActual)}</div></div>
        <div className="card metric-card"><div className="metric-label">Remaining</div><div className="metric-value" style={{color:totalRemaining>=0?'var(--green)':'var(--red)'}}>{totalRemaining>=0?'':'-'}{fmt(Math.abs(totalRemaining))}</div></div>
        <div className="card metric-card"><div className="metric-label">% Used</div><div className="metric-value" style={{color:totalBudgeted>0&&totalActual/totalBudgeted>1?'var(--red)':totalBudgeted>0&&totalActual/totalBudgeted>0.8?'var(--amber)':'var(--green)'}}>{totalBudgeted>0?Math.round(totalActual/totalBudgeted*100):0}%</div></div>
      </div>

      {loading?<div className="loading"><div className="spinner"/><span>Loading…</span></div>
        :allCats.length===0?<div className="card"><div className="empty"><div className="empty-icon">◉</div><span>No budget data for {year}</span></div></div>
        :<>
          {renderTable('Monthly Budget',getBudget,budgetRowTotal,budgetColTotal,budgetGrand,true)}
          {renderTable('Rolling Annual Budget',getActual,actualRowTotal,actualColTotal,actualGrand,false)}
        </>
      }
    </div>
  );
}

function BalancesPage({toast}){
  const[accounts,setAccounts]=useState([]);
  const[selectedId,setSelectedId]=useState(null);
  const[selectedAccount,setSelectedAccount]=useState(null);
  const[timeline,setTimeline]=useState(null);
  const[loading,setLoading]=useState(true);
  const[tlLoading,setTlLoading]=useState(false);
  const[error,setError]=useState('');
  /* Section 5C: 4 specific filter dropdowns */
  const[sideFilter,setSideFilter]=useState('');       // Asset/Liability
  const[typeFilter,setTypeFilter]=useState('');        // Account Type
  const[instFilter,setInstFilter]=useState('');        // Institution
  const[nameFilter,setNameFilter]=useState('');        // Account Name

  const loadAccounts=useCallback(async()=>{
    setLoading(true);
    try{setAccounts(await apiFetch('/accounts'));}catch(e){setError('Failed to load accounts');}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{loadAccounts();},[loadAccounts]);

  const loadTimeline=useCallback(async(id)=>{
    setTlLoading(true);setError('');
    try{setTimeline(await apiFetch(`/accounts/${id}/balance-timeline`));}
    catch(e){setError('Failed to load balance timeline');toast('Failed to load','error');}
    finally{setTlLoading(false);}
  },[]);

  useEffect(()=>{
    if(selectedId){
      const acct=accounts.find(a=>a.id===selectedId);
      setSelectedAccount(acct||null);
      loadTimeline(selectedId);
    }else{setTimeline(null);setSelectedAccount(null);}
  },[selectedId]);

  /* Section 5C: Compute filter dropdown options */
  const accountTypeLabels={'checking':'Checking','savings':'Savings','money market':'Money Market','cd':'CD','investment':'Investment','401k':'401(k)','ira':'IRA','brokerage':'Brokerage','real_estate':'Real Estate','vehicle':'Vehicle','credit card':'Credit Card','credit':'Credit Card','loan':'Loan','mortgage':'Mortgage','student':'Student Loan','auto':'Auto Loan','other':'Other','business_owned':'Business'};
  const accountTypes=[...new Set(accounts.map(a=>a.account_type))].sort();
  const institutions=[...new Set(accounts.map(a=>(a.plaid_item_id||'Manual')).filter(Boolean))].sort();

  /* Filter accounts — Section 5A: default to "All" */
  const filteredAccounts=accounts.filter(a=>{
    if(sideFilter==='asset'&&!a.is_asset)return false;
    if(sideFilter==='liability'&&!a.is_liability)return false;
    if(typeFilter&&a.account_type!==typeFilter)return false;
    if(instFilter){
      const inst=a.plaid_item_id||'Manual';
      if(inst!==instFilter)return false;
    }
    if(nameFilter&&a.id!==parseInt(nameFilter))return false;
    return true;
  });

  const data=timeline?.timeline||[];
  const startBal=timeline?.starting_balance||0;
  const currentBal=data.length?data[data.length-1].balance:startBal;
  const change=currentBal-startBal;

  /* Section 5B: Sign conventions — display as-is (assets positive, liabilities negative) */
  const fmtBal=(val)=>{
    if(val===0)return '$0.00';
    const sign=val<0?'-':'';
    return sign+fmt(Math.abs(val));
  };

  const minBal=data.length?Math.min(...data.map(d=>d.balance)):0;
  const maxBal=data.length?Math.max(...data.map(d=>d.balance)):0;
  const range=maxBal-minBal||1;
  const chartW=800;const chartH=200;const pad=40;
  const points=data.map((d,i)=>{
    const x=pad+(i/(data.length-1||1))*(chartW-2*pad);
    const y=pad+(1-(d.balance-minBal)/range)*(chartH-2*pad);
    return`${x},${y}`;
  }).join(' ');

  return(
    <div>
      {error&&<div style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{error}</div>}

      <div style={{display:'flex',gap:10,marginBottom:20,alignItems:'center',flexWrap:'wrap'}}>
        {/* Section 5C: 4 filter dropdowns */}
        <select className="filter-select" value={sideFilter} onChange={e=>setSideFilter(e.target.value)}>
          <option value="">Asset / Liability</option>
          <option value="asset">Assets</option>
          <option value="liability">Liabilities</option>
        </select>
        <select className="filter-select" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
          <option value="">Account Type</option>
          {accountTypes.map(t=><option key={t} value={t}>{accountTypeLabels[t]||t}</option>)}
        </select>
        <select className="filter-select" value={instFilter} onChange={e=>setInstFilter(e.target.value)}>
          <option value="">Institution</option>
          {institutions.map(i=><option key={i} value={i}>{i==='Manual'?'Manual':i}</option>)}
        </select>
        <select className="filter-select" value={selectedId||''} onChange={e=>{setSelectedId(parseInt(e.target.value)||null);setTimeline(null);}}>
          <option value="">Account Name</option>
          {filteredAccounts.map(a=><option key={a.id} value={a.id}>{a.account_name}{a.is_manual?' (Manual)':''}</option>)}
        </select>
        {selectedAccount&&<span style={{fontSize:12,color:'var(--text-muted)'}}>Starting: {fmtBal(selectedAccount.starting_balance||0)}{selectedAccount.start_date?` as of ${selectedAccount.start_date}`:''}</span>}
      </div>

      {!selectedId?<div className="card"><div className="empty"><div className="empty-icon">◇</div><span>Select an account to view balance timeline</span></div></div>
        :tlLoading?<div className="loading"><div className="spinner"/><span>Loading timeline…</span></div>
        :<div>
          <div className="metric-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:20}}>
            <div className="card metric-card"><div className="metric-label">Starting Balance</div><div className="metric-value">{fmtBal(startBal)}</div><div className="metric-sub">{timeline?.start_date?`as of ${timeline.start_date}`:''}</div></div>
            <div className="card metric-card"><div className="metric-label">Current Balance</div><div className="metric-value" style={{color:currentBal>=0?'var(--green)':'var(--red)'}}>{fmtBal(currentBal)}</div></div>
            <div className="card metric-card"><div className="metric-label">Change</div><div className="metric-value" style={{color:change>=0?'var(--green)':'var(--red)'}}>{change>=0?'+':''}{fmtBal(change)}</div></div>
          </div>

          {data.length>1&&<div className="card" style={{padding:20,marginBottom:20}}>
            <div className="section-title" style={{marginBottom:12}}>Balance Over Time</div>
            <svg viewBox={`0 0 ${chartW} ${chartH}`} style={{width:'100%',height:200}}>
              <polyline fill="none" stroke="var(--blue)" strokeWidth="2" points={points}/>
              <polyline fill="url(#balgrad)" stroke="none" points={`${pad},${chartH-pad} ${points} ${pad+(data.length-1)/(data.length-1||1)*(chartW-2*pad)},${chartH-pad}`}/>
              <defs><linearGradient id="balgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--blue)" stopOpacity="0.15"/><stop offset="100%" stopColor="var(--blue)" stopOpacity="0"/></linearGradient></defs>
              <text x={pad} y={chartH-pad+16} fontSize="10" fill="var(--text-muted)">{data[0]?.date}</text>
              <text x={chartW-pad} y={chartH-pad+16} fontSize="10" fill="var(--text-muted)" textAnchor="end">{data[data.length-1]?.date}</text>
              <text x={pad-4} y={pad+4} fontSize="10" fill="var(--text-muted)" textAnchor="end">{fmtBal(maxBal)}</text>
              <text x={pad-4} y={chartH-pad+4} fontSize="10" fill="var(--text-muted)" textAnchor="end">{fmtBal(minBal)}</text>
            </svg>
          </div>}

          <div className="card">
            <div className="section-header"><div className="section-title">Daily Balances</div><span style={{fontSize:12,color:'var(--text-muted)'}}>{data.length} days</span></div>
            {data.length===0?<div className="empty"><span>No transaction data in this range</span></div>
              :<div className="table-wrap" style={{maxHeight:400,overflowY:'auto'}}><table>
                <thead><tr><th>Date</th><th>Daily Change</th><th>Balance</th></tr></thead>
                <tbody>{[...data].reverse().map(d=>(
                  <tr key={d.date}>
                    <td style={{color:'var(--text-secondary)',fontSize:13}}>{d.date}</td>
                    <td><span className={d.change>0?'amount-pos':d.change<0?'amount-neg':'amount-neutral'}>{d.change>0?'+':d.change<0?'-':''}{d.change!==0?fmt(Math.abs(d.change)):'—'}</span></td>
                    <td><span style={{fontFamily:'DM Mono',fontSize:13,fontWeight:500,color:d.balance>=0?'var(--text-primary)':'var(--red)'}}>{fmtBal(d.balance)}</span></td>
                  </tr>
                ))}</tbody>
              </table></div>
            }
          </div>
        </div>
      }
    </div>
  );
}

function NetWorthPage({toast}){
  const[data,setData]=useState(null);
  const[timeline,setTimeline]=useState(null);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState('');
  const[expanded,setExpanded]=useState({});

  const load=useCallback(async()=>{
    setLoading(true);setError('');
    try{
      const[nw,tl]=await Promise.all([
        apiFetch('/net-worth'),
        apiFetch('/net-worth/timeline?months=12'),
      ]);
      setData(nw);setTimeline(tl.timeline||[]);
    }catch(e){setError('Failed to load net worth data');toast('Failed to load','error');}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[load]);

  const toggleBucket=(b)=>setExpanded(prev=>({...prev,[b]:!prev[b]}));

  if(loading)return<div className="loading"><div className="spinner"/><span>Loading…</span></div>;

  const buckets=data?.buckets||{};
  const assetBuckets=Object.entries(buckets).filter(([,v])=>v.is_asset);
  const liabBuckets=Object.entries(buckets).filter(([,v])=>!v.is_asset);

  /* Mini SVG chart for timeline */
  const tlData=timeline||[];
  const chartW=800;const chartH=180;const pad=40;
  const vals=tlData.map(d=>d.net_worth);
  const minV=vals.length?Math.min(...vals):0;
  const maxV=vals.length?Math.max(...vals):0;
  const range=maxV-minV||1;
  const points=tlData.map((d,i)=>{
    const x=pad+(i/(tlData.length-1||1))*(chartW-2*pad);
    const y=pad+(1-(d.net_worth-minV)/range)*(chartH-2*pad);
    return`${x},${y}`;
  }).join(' ');

  const BucketSection=({title,bucketList,color})=>(
    <div className="card" style={{marginBottom:16}}>
      <div className="section-header"><div className="section-title">{title}</div></div>
      {bucketList.length===0?<div className="empty" style={{padding:30}}><span>No {title.toLowerCase()}</span></div>
        :bucketList.map(([bucketName,bData])=>{
          const bucketTotal=bData.accounts.reduce((s,a)=>s+(bData.is_asset?a.balance:Math.abs(a.balance)),0);
          const isExpanded=expanded[bucketName]!==false;
          return(
            <div key={bucketName}>
              <div onClick={()=>toggleBucket(bucketName)} style={{padding:'12px 18px',borderBottom:'1px solid #f3f4f6',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer',background:'#fafafa'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:11,color:'var(--text-muted)',transition:'transform 0.2s',transform:isExpanded?'rotate(90deg)':'rotate(0deg)'}}>▶</span>
                  <span style={{fontSize:13,fontWeight:600}}>{bucketName}</span>
                  <span style={{fontSize:11,color:'var(--text-muted)'}}>({bData.accounts.length})</span>
                </div>
                <span style={{fontFamily:'DM Mono',fontSize:14,fontWeight:600,color}}>{fmt(bucketTotal)}</span>
              </div>
              {isExpanded&&bData.accounts.map(a=>(
                <div key={a.account_id} style={{padding:'10px 18px 10px 44px',borderBottom:'1px solid #f3f4f6',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:500}}>{a.account_name}</div>
                    <div style={{fontSize:11,color:'var(--text-muted)'}}>{a.account_type}{a.is_manual?' · Manual':''}</div>
                  </div>
                  <span style={{fontFamily:'DM Mono',fontSize:13,fontWeight:500,color}}>{fmt(bData.is_asset?a.balance:Math.abs(a.balance))}</span>
                </div>
              ))}
            </div>
          );
        })
      }
    </div>
  );

  return(
    <div>
      {error&&<div style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{error}</div>}

      {/* KPI cards */}
      <div className="metric-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:20}}>
        <div className="card metric-card"><div className="metric-label">Total Assets</div><div className="metric-value" style={{color:'var(--green)'}}>{fmt(data?.total_assets||0)}</div></div>
        <div className="card metric-card"><div className="metric-label">Total Liabilities</div><div className="metric-value" style={{color:'var(--red)'}}>{fmt(data?.total_liabilities||0)}</div></div>
        <div className="card metric-card"><div className="metric-label">Net Worth</div><div className="metric-value" style={{color:(data?.net_worth||0)>=0?'var(--green)':'var(--red)'}}>{(data?.net_worth||0)>=0?'':'-'}{fmt(Math.abs(data?.net_worth||0))}</div></div>
      </div>

      {/* Timeline chart */}
      {tlData.length>1&&<div className="card" style={{padding:20,marginBottom:20}}>
        <div className="section-title" style={{marginBottom:12}}>Net Worth Over Time</div>
        <svg viewBox={`0 0 ${chartW} ${chartH}`} style={{width:'100%',height:180}}>
          <polyline fill="none" stroke="var(--blue)" strokeWidth="2" points={points}/>
          <polyline fill="url(#nwgrad)" stroke="none" points={`${pad},${chartH-pad} ${points} ${pad+(tlData.length-1)/(tlData.length-1||1)*(chartW-2*pad)},${chartH-pad}`}/>
          <defs><linearGradient id="nwgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--blue)" stopOpacity="0.15"/><stop offset="100%" stopColor="var(--blue)" stopOpacity="0"/></linearGradient></defs>
          <text x={pad} y={chartH-pad+16} fontSize="10" fill="var(--text-muted)">{tlData[0]?.date}</text>
          <text x={chartW-pad} y={chartH-pad+16} fontSize="10" fill="var(--text-muted)" textAnchor="end">{tlData[tlData.length-1]?.date}</text>
          <text x={pad-4} y={pad+4} fontSize="10" fill="var(--text-muted)" textAnchor="end">{fmt(maxV)}</text>
          <text x={pad-4} y={chartH-pad+4} fontSize="10" fill="var(--text-muted)" textAnchor="end">{fmt(minV)}</text>
        </svg>
      </div>}

      {/* Asset and Liability sections */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
        <BucketSection title="Assets" bucketList={assetBuckets} color="var(--green)"/>
        <BucketSection title="Liabilities" bucketList={liabBuckets} color="var(--red)"/>
      </div>
    </div>
  );
}

/* ── Loans Page (Section 1) ──────────────────────────────────────────────── */
function LoansPage({toast}){
  const[loans,setLoans]=useState([]);
  const[accounts,setAccounts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[showAdd,setShowAdd]=useState(false);
  const[editing,setEditing]=useState(null);
  const[editVals,setEditVals]=useState({});
  const[detail,setDetail]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);
    try{const[l,a]=await Promise.all([apiFetch('/loans'),apiFetch('/accounts')]);setLoans(l);setAccounts(a);}
    catch(e){toast('Failed to load loans','error');}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[load]);

  const loanTypes=['mortgage','auto','student','personal','other'];
  const blankLoan={lender:'',loan_type:'mortgage',original_principal:'',current_balance:'',interest_rate:'',term_months:'',monthly_payment:'',start_date:'',maturity_date:'',account_id:'',notes:''};

  const saveLoan=async()=>{
    const body={...editVals,original_principal:parseFloat(editVals.original_principal)||0,current_balance:editVals.current_balance?parseFloat(editVals.current_balance):null,interest_rate:editVals.interest_rate?parseFloat(editVals.interest_rate):null,term_months:editVals.term_months?parseInt(editVals.term_months):null,monthly_payment:editVals.monthly_payment?parseFloat(editVals.monthly_payment):null,account_id:editVals.account_id?parseInt(editVals.account_id):null,start_date:editVals.start_date||null,maturity_date:editVals.maturity_date||null};
    try{
      if(editing==='new'){await apiFetch('/loans',{method:'POST',body:JSON.stringify(body)});toast('Loan created');}
      else{await apiFetch(`/loans/${editing}`,{method:'PATCH',body:JSON.stringify(body)});toast('Loan updated');}
      setEditing(null);setShowAdd(false);await load();
    }catch(e){toast('Failed to save','error');}
  };

  const deleteLoan=async(id)=>{
    if(!confirm('Deactivate this loan?'))return;
    try{await apiFetch(`/loans/${id}`,{method:'DELETE'});toast('Loan deactivated');await load();}
    catch(e){toast('Failed','error');}
  };

  const loadDetail=async(id)=>{
    try{setDetail(await apiFetch(`/loans/${id}`));}catch(e){toast('Failed to load detail','error');}
  };

  const totalPrincipal=loans.reduce((s,l)=>s+l.original_principal,0);
  const totalBalance=loans.reduce((s,l)=>s+(l.current_balance||0),0);
  const totalPayment=loans.reduce((s,l)=>s+(l.monthly_payment||0),0);

  const LoanForm=()=>(
    <div style={{padding:'16px 20px',background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:8,margin:'0 16px 16px'}}>
      <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>{editing==='new'?'New Loan':'Edit Loan'}</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,fontSize:12,marginBottom:8}}>
        <div><label style={{fontSize:11,color:'var(--text-muted)'}}>Lender *</label><input value={editVals.lender||''} onChange={e=>setEditVals(v=>({...v,lender:e.target.value}))} style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/></div>
        <div><label style={{fontSize:11,color:'var(--text-muted)'}}>Type</label><select value={editVals.loan_type||'mortgage'} onChange={e=>setEditVals(v=>({...v,loan_type:e.target.value}))} style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}>{loanTypes.map(t=><option key={t}>{t}</option>)}</select></div>
        <div><label style={{fontSize:11,color:'var(--text-muted)'}}>Linked Account</label><select value={editVals.account_id||''} onChange={e=>setEditVals(v=>({...v,account_id:e.target.value}))} style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}><option value="">— None —</option>{accounts.filter(a=>a.is_liability).map(a=><option key={a.id} value={a.id}>{a.account_name}</option>)}</select></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:8,fontSize:12,marginBottom:8}}>
        <div><label style={{fontSize:11,color:'var(--text-muted)'}}>Original Principal *</label><input type="number" step="0.01" value={editVals.original_principal||''} onChange={e=>setEditVals(v=>({...v,original_principal:e.target.value}))} style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/></div>
        <div><label style={{fontSize:11,color:'var(--text-muted)'}}>Current Balance</label><input type="number" step="0.01" value={editVals.current_balance||''} onChange={e=>setEditVals(v=>({...v,current_balance:e.target.value}))} style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/></div>
        <div><label style={{fontSize:11,color:'var(--text-muted)'}}>Interest Rate (%)</label><input type="number" step="0.01" value={editVals.interest_rate||''} onChange={e=>setEditVals(v=>({...v,interest_rate:e.target.value}))} style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/></div>
        <div><label style={{fontSize:11,color:'var(--text-muted)'}}>Monthly Payment</label><input type="number" step="0.01" value={editVals.monthly_payment||''} onChange={e=>setEditVals(v=>({...v,monthly_payment:e.target.value}))} style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,fontSize:12,marginBottom:8}}>
        <div><label style={{fontSize:11,color:'var(--text-muted)'}}>Term (months)</label><input type="number" value={editVals.term_months||''} onChange={e=>setEditVals(v=>({...v,term_months:e.target.value}))} style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/></div>
        <div><label style={{fontSize:11,color:'var(--text-muted)'}}>Start Date</label><input type="date" value={editVals.start_date||''} onChange={e=>setEditVals(v=>({...v,start_date:e.target.value}))} style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/></div>
        <div><label style={{fontSize:11,color:'var(--text-muted)'}}>Maturity Date</label><input type="date" value={editVals.maturity_date||''} onChange={e=>setEditVals(v=>({...v,maturity_date:e.target.value}))} style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/></div>
      </div>
      <div style={{marginBottom:8}}><label style={{fontSize:11,color:'var(--text-muted)'}}>Notes</label><input value={editVals.notes||''} onChange={e=>setEditVals(v=>({...v,notes:e.target.value}))} placeholder="Optional" style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/></div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-sm btn-success" onClick={saveLoan}>Save</button>
        <button className="btn btn-sm btn-ghost" onClick={()=>{setEditing(null);setShowAdd(false);}}>Cancel</button>
      </div>
    </div>
  );

  return(
    <div>
      {/* Detail panel */}
      {detail&&<div className="review-overlay" onClick={e=>e.target===e.currentTarget&&setDetail(null)}>
        <div className="review-panel" style={{width:500}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <div><div style={{fontSize:16,fontWeight:600}}>{detail.lender}</div><div style={{fontSize:12,color:'var(--text-muted)'}}>{detail.loan_type} loan</div></div>
            <button className="btn btn-sm btn-ghost" onClick={()=>setDetail(null)}>✕</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
            <div style={{background:'#f9fafb',borderRadius:8,padding:'10px 14px'}}><div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase'}}>Original</div><div style={{fontSize:16,fontWeight:600,fontFamily:'DM Mono'}}>{fmt(detail.original_principal)}</div></div>
            <div style={{background:'#f9fafb',borderRadius:8,padding:'10px 14px'}}><div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase'}}>Balance</div><div style={{fontSize:16,fontWeight:600,fontFamily:'DM Mono',color:'var(--red)'}}>{detail.current_balance!=null?fmt(detail.current_balance):'—'}</div></div>
            <div style={{background:'#f9fafb',borderRadius:8,padding:'10px 14px'}}><div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase'}}>Rate</div><div style={{fontSize:16,fontWeight:600,fontFamily:'DM Mono'}}>{detail.interest_rate!=null?`${detail.interest_rate}%`:'—'}</div></div>
            <div style={{background:'#f9fafb',borderRadius:8,padding:'10px 14px'}}><div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase'}}>Payment</div><div style={{fontSize:16,fontWeight:600,fontFamily:'DM Mono'}}>{detail.monthly_payment?fmt(detail.monthly_payment):'—'}</div></div>
          </div>
          {detail.term_months&&<div style={{fontSize:13,color:'var(--text-muted)',marginBottom:4}}>Term: {detail.term_months} months{detail.start_date?` · Started ${detail.start_date}`:''}{detail.maturity_date?` · Matures ${detail.maturity_date}`:''}</div>}
          {detail.account_name&&<div style={{fontSize:13,color:'var(--text-muted)',marginBottom:4}}>Linked: {detail.account_name}{detail.account_balance!=null?` · Balance: ${fmt(detail.account_balance)}`:''}</div>}
          {detail.notes&&<div style={{fontSize:12,color:'var(--text-muted)',marginTop:8}}>{detail.notes}</div>}
        </div>
      </div>}

      {/* KPIs */}
      <div className="metric-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:20}}>
        <div className="card metric-card"><div className="metric-label">Total Principal</div><div className="metric-value">{fmt(totalPrincipal)}</div></div>
        <div className="card metric-card"><div className="metric-label">Total Balance</div><div className="metric-value" style={{color:'var(--red)'}}>{fmt(totalBalance)}</div></div>
        <div className="card metric-card"><div className="metric-label">Monthly Payments</div><div className="metric-value">{fmt(totalPayment)}</div></div>
      </div>

      <div className="card">
        <div className="section-header">
          <div className="section-title">Loans ({loans.length})</div>
          <button className="btn btn-sm btn-primary" onClick={()=>{setShowAdd(true);setEditing('new');setEditVals({...blankLoan});}}>+ Add Loan</button>
        </div>
        {(showAdd||editing==='new')&&<LoanForm/>}
        {loading?<div className="loading"><div className="spinner"/></div>
          :loans.length===0&&!showAdd?<div className="empty"><div className="empty-icon">⌂</div><span>No loans yet</span></div>
          :<div className="table-wrap"><table>
            <thead><tr><th>Lender</th><th>Type</th><th>Original</th><th>Balance</th><th>Rate</th><th>Payment</th><th>Start</th><th>Actions</th></tr></thead>
            <tbody>{loans.map(l=>(
              editing===l.id?<tr key={l.id}><td colSpan={8}><LoanForm/></td></tr>
              :<tr key={l.id} style={{cursor:'pointer'}} onClick={()=>loadDetail(l.id)}>
                <td style={{fontWeight:500}}>{l.lender}</td>
                <td><span className="badge badge-category" style={{fontSize:11}}>{l.loan_type}</span></td>
                <td style={{fontFamily:'DM Mono',fontSize:13}}>{fmt(l.original_principal)}</td>
                <td style={{fontFamily:'DM Mono',fontSize:13,color:'var(--red)'}}>{l.current_balance!=null?fmt(l.current_balance):'—'}</td>
                <td style={{fontFamily:'DM Mono',fontSize:13}}>{l.interest_rate!=null?`${l.interest_rate}%`:'—'}</td>
                <td style={{fontFamily:'DM Mono',fontSize:13}}>{l.monthly_payment?fmt(l.monthly_payment):'—'}</td>
                <td style={{fontSize:12,color:'var(--text-muted)'}}>{l.start_date||'—'}</td>
                <td onClick={e=>e.stopPropagation()}><div className="edit-actions">
                  <button className="btn btn-sm btn-secondary" onClick={()=>{setEditing(l.id);setEditVals({lender:l.lender,loan_type:l.loan_type,original_principal:l.original_principal,current_balance:l.current_balance||'',interest_rate:l.interest_rate||'',term_months:l.term_months||'',monthly_payment:l.monthly_payment||'',start_date:l.start_date||'',maturity_date:l.maturity_date||'',account_id:l.account_id||'',notes:l.notes||''});}}>Edit</button>
                  <button className="btn btn-sm btn-ghost" style={{color:'var(--red)'}} onClick={()=>deleteLoan(l.id)}>×</button>
                </div></td>
              </tr>
            ))}</tbody>
          </table></div>
        }
      </div>
    </div>
  );
}

/* ── Cash Flow Page (Section 2) ─────────────────────────────────────────── */
function CashFlowPage({toast}){
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[period,setPeriod]=useState('month');

  const getDates=()=>{
    const now=new Date();
    if(period==='month')return{start:monthStart(),end:todayStr()};
    if(period==='ytd')return{start:`${now.getFullYear()}-01-01`,end:todayStr()};
    if(period==='last30'){const d=new Date();d.setDate(d.getDate()-30);return{start:d.toISOString().slice(0,10),end:todayStr()};}
    if(period==='last90'){const d=new Date();d.setDate(d.getDate()-90);return{start:d.toISOString().slice(0,10),end:todayStr()};}
    return{start:'',end:''};
  };

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const{start,end}=getDates();
      const r=await apiFetch(`/cash-flow?start_date=${start}&end_date=${end}`);
      setData(r);
    }catch(e){toast('Failed to load cash flow','error');}
    finally{setLoading(false);}
  },[period]);
  useEffect(()=>{load();},[load]);

  if(loading)return<div className="loading"><div className="spinner"/><span>Loading…</span></div>;

  const d=data||{inflows:0,outflows:0,net:0,cc_payments:0,loan_repayments:0,transaction_count:0};

  return(
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div><h2 style={{fontSize:18,fontWeight:600}}>Cash Flow</h2><p style={{fontSize:13,color:'var(--text-muted)',marginTop:2}}>Depository accounts only (checking & savings)</p></div>
        <div style={{display:'flex',gap:4,background:'var(--card-bg)',border:'1px solid var(--border)',borderRadius:10,padding:4}}>
          {[['month','This Month'],['last30','Last 30 Days'],['last90','Last 90 Days'],['ytd','Year to Date']].map(([v,l])=>(
            <button key={v} className={`btn btn-sm ${period===v?'btn-primary':'btn-ghost'}`} onClick={()=>setPeriod(v)} style={{borderRadius:7}}>{l}</button>
          ))}
        </div>
      </div>

      <div className="metric-grid" style={{gridTemplateColumns:'repeat(5,1fr)',marginBottom:20}}>
        <div className="card metric-card"><div className="metric-label">Inflows</div><div className="metric-value" style={{color:'var(--green)'}}>{fmt(d.inflows)}</div></div>
        <div className="card metric-card"><div className="metric-label">Outflows</div><div className="metric-value" style={{color:'var(--red)'}}>{fmt(Math.abs(d.outflows))}</div></div>
        <div className="card metric-card"><div className="metric-label">Net Cash Flow</div><div className="metric-value" style={{color:d.net>=0?'var(--green)':'var(--red)'}}>{d.net>=0?'+':''}{fmt(d.net)}</div></div>
        <div className="card metric-card"><div className="metric-label">CC Payments</div><div className="metric-value" style={{color:'var(--text-secondary)'}}>{fmt(d.cc_payments)}</div></div>
        <div className="card metric-card"><div className="metric-label">Loan Repayments</div><div className="metric-value" style={{color:'var(--text-secondary)'}}>{fmt(d.loan_repayments)}</div></div>
      </div>

      <div className="card">
        <div className="section-header">
          <div className="section-title">Summary</div>
          <span style={{fontSize:12,color:'var(--text-muted)'}}>{d.transaction_count} transactions · {d.start_date} → {d.end_date}</span>
        </div>
        <div style={{padding:20}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            <div>
              <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Money In</div>
              <div style={{background:'#f0fdf4',borderRadius:8,padding:'12px 16px',display:'flex',justifyContent:'space-between'}}>
                <span style={{fontSize:13}}>Total Inflows</span>
                <span style={{fontFamily:'DM Mono',fontWeight:600,color:'var(--green)'}}>{fmt(d.inflows)}</span>
              </div>
            </div>
            <div>
              <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Money Out</div>
              <div style={{background:'#fef2f2',borderRadius:8,padding:'12px 16px',marginBottom:8,display:'flex',justifyContent:'space-between'}}>
                <span style={{fontSize:13}}>Total Outflows</span>
                <span style={{fontFamily:'DM Mono',fontWeight:600,color:'var(--red)'}}>{fmt(Math.abs(d.outflows))}</span>
              </div>
              {d.cc_payments>0&&<div style={{background:'#f3f4f6',borderRadius:8,padding:'10px 16px',marginBottom:4,display:'flex',justifyContent:'space-between'}}>
                <span style={{fontSize:12,color:'var(--text-muted)'}}>↳ Credit Card Payments</span>
                <span style={{fontFamily:'DM Mono',fontSize:12}}>{fmt(d.cc_payments)}</span>
              </div>}
              {d.loan_repayments>0&&<div style={{background:'#f3f4f6',borderRadius:8,padding:'10px 16px',display:'flex',justifyContent:'space-between'}}>
                <span style={{fontSize:12,color:'var(--text-muted)'}}>↳ Loan Repayments</span>
                <span style={{fontFamily:'DM Mono',fontSize:12}}>{fmt(d.loan_repayments)}</span>
              </div>}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const[page,setPage]=useState('dashboard');
  const[categories,setCategories]=useState([]);
  const[banks,setBanks]=useState([]);
  const{toasts,toast}=useToast();

  const loadMeta=useCallback(async()=>{
    try{const[c,b]=await Promise.all([apiFetch('/categories'),apiFetch('/plaid/items')]);setCategories(c);setBanks(b);}catch(e){}
  },[]);

  useEffect(()=>{
    loadMeta();
    if(!document.getElementById('plaid-script')){const s=document.createElement('script');s.id='plaid-script';s.src='https://cdn.plaid.com/link/v2/stable/link-initialize.js';document.head.appendChild(s);}
  },[]);

  const sync=async()=>{
    try{const r=await apiFetch('/plaid/sync-transactions',{method:'POST'});toast(`Synced ${r.transactions_synced} new transactions`);loadMeta();}
    catch(e){toast('Sync failed','error');}
  };

  const openPlaid=usePlaidLink(toast,loadMeta);
  const titles={dashboard:'Dashboard',transactions:'Transactions',budgets:'Budgets',balances:'Balances',cashflow:'Cash Flow',networth:'Net Worth',loans:'Loans',gcb:'GCB',cards:'Cards',accounts:'Accounts',settings:'Settings'};

  return(
    <div style={{display:'flex',height:'100vh'}}>
      <Sidebar page={page} setPage={setPage} banks={banks} onConnectBank={openPlaid} onSync={sync}/>
      <div className="main">
        <div className="topbar">
          <div className="topbar-title">{titles[page]}</div>
          <div>{banks.length>0&&<span className="bank-badge">● {banks.length} account{banks.length!==1?'s':''} connected</span>}</div>
        </div>
        <div className="content">
          {page==='dashboard'&&<DashboardPage categories={categories} toast={toast}/>}
          {page==='transactions'&&<TransactionsPage categories={categories} toast={toast}/>}
          {page==='budgets'&&<BudgetsPage categories={categories} toast={toast}/>}
          {page==='balances'&&<BalancesPage toast={toast}/>}
          {page==='cashflow'&&<CashFlowPage toast={toast}/>}
          {page==='networth'&&<NetWorthPage toast={toast}/>}
          {page==='loans'&&<LoansPage toast={toast}/>}
          {page==='accounts'&&<AccountsPage banks={banks} onConnectBank={openPlaid} onSync={sync} toast={toast}/>}
          {page==='cards'&&<CardsPage toast={toast}/>}
          {page==='gcb'&&<GCBPage toast={toast}/>}
          {page==='settings'&&<SettingsPage banks={banks} onConnectBank={openPlaid} toast={toast}/>}
        </div>
      </div>
      <ToastContainer toasts={toasts}/>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
