// LoanForm is a top-level component so React never remounts it mid-edit
// (if defined inside LoansPage, every keystroke re-creates a new function
// reference, causing React to unmount+remount the form and lose focus).
function LoanForm({editVals,setEditVals,accounts,loanTypes,isNew,onSave,onCancel}){
  const inp=(field,type='text',step)=>(
    <input type={type} step={step} value={editVals[field]??''} onChange={e=>setEditVals(v=>({...v,[field]:e.target.value}))}
      style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/>
  );
  const sel=(field,opts)=>(
    <select value={editVals[field]??''} onChange={e=>setEditVals(v=>({...v,[field]:e.target.value}))}
      style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}>
      {opts}
    </select>
  );
  const lbl=(text,req)=><label style={{fontSize:11,color:'var(--text-muted)',display:'block',marginBottom:2}}>{text}{req&&<span style={{color:'var(--red)'}}> *</span>}</label>;
  const checkAccts=accounts.filter(a=>['Checking','Savings'].includes(a.account_type));
  const liabAccts=accounts.filter(a=>a.is_liability);
  const bal=parseFloat(editVals.current_balance)||0;
  const rate=parseFloat(editVals.interest_rate)||0;
  const pmt=parseFloat(editVals.monthly_payment)||0;
  const tax=parseFloat(editVals.property_tax_monthly)||0;
  const ins=parseFloat(editVals.insurance_monthly)||0;
  const prevInt=pmt>0?Math.round(bal*(rate/100/12)*100)/100:0;
  const prevEsc=tax+ins;
  const prevPrin=pmt>0?Math.round((pmt-prevInt-prevEsc)*100)/100:0;
  return(
    <div style={{padding:'16px 20px',background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:8,margin:'0 0 16px'}}>
      <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>{isNew?'New Loan':'Edit Loan'}</div>
      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr',gap:8,marginBottom:8}}>
        <div>{lbl('Lender',true)}{inp('lender')}</div>
        <div>{lbl('Type')}{sel('loan_type',loanTypes.map(t=><option key={t}>{t}</option>))}</div>
        <div>{lbl('Linked Account (Liability)')}{sel('account_id',[<option key="" value="">— None —</option>,...liabAccts.map(a=><option key={a.id} value={a.id}>{a.account_name}</option>)])}</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:8,marginBottom:8}}>
        <div>{lbl('Original Principal',true)}{inp('original_principal','number','0.01')}</div>
        <div>{lbl('Balance (as of below)')}{inp('current_balance','number','0.01')}</div>
        <div>{lbl('Balance Date')}{inp('balance_date','date')}</div>
        <div>{lbl('Remaining Months')}{inp('remaining_term_months','number','1')}</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:8,marginBottom:8}}>
        <div>{lbl('Interest Rate (%)')}{inp('interest_rate','number','0.001')}</div>
        <div>{lbl('Total Monthly Payment')}{inp('monthly_payment','number','0.01')}</div>
        <div>{lbl('Property Tax / mo')}{inp('property_tax_monthly','number','0.01')}</div>
        <div>{lbl('Insurance / mo')}{inp('insurance_monthly','number','0.01')}</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:8,marginBottom:8}}>
        <div>{lbl('Paid From (Checking)')}{sel('payment_account_id',[<option key="" value="">— None —</option>,...checkAccts.map(a=><option key={a.id} value={a.id}>{a.account_name}</option>)])}</div>
        <div>{lbl('Due Day of Month')}{inp('payment_due_day','number','1')}</div>
        <div>{lbl('Original Term (months)')}{inp('term_months','number','1')}</div>
        <div>{lbl('Maturity Date')}{inp('maturity_date','date')}</div>
      </div>
      {pmt>0&&<div style={{background:'#fff',border:'1px solid #bbf7d0',borderRadius:6,padding:'8px 12px',marginBottom:8,fontSize:12,display:'flex',gap:16,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontWeight:600,color:'var(--text-muted)'}}>Next payment preview:</span>
        <span>Principal <b style={{fontFamily:'DM Mono'}}>${prevPrin.toLocaleString()}</b></span>
        <span>Interest <b style={{fontFamily:'DM Mono',color:'var(--red)'}}>${prevInt.toLocaleString()}</b></span>
        {tax>0&&<span>Prop Tax <b style={{fontFamily:'DM Mono'}}>${tax.toLocaleString()}</b></span>}
        {ins>0&&<span>Insurance <b style={{fontFamily:'DM Mono'}}>${ins.toLocaleString()}</b></span>}
      </div>}
      <div style={{marginBottom:8}}>{lbl('Notes')}{inp('notes')}</div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-sm btn-success" onClick={onSave}>Save</button>
        <button className="btn btn-sm btn-ghost" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function LoansPage({toast}){
  const[loans,setLoans]=useState([]);
  const[accounts,setAccounts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[editing,setEditing]=useState(null);
  const[editVals,setEditVals]=useState({});
  const[linkModal,setLinkModal]=useState(null);
  const[candidates,setCandidates]=useState([]);
  const[linkPreview,setLinkPreview]=useState(null);
  const[linking,setLinking]=useState(false);
  const[linkedTxns,setLinkedTxns]=useState([]);

  const loanTypes=['Mortgage','Auto','Student','Personal','Other'];
  const blankLoan={lender:'',loan_type:'Mortgage',original_principal:'',current_balance:'',
    balance_date:'',remaining_term_months:'',interest_rate:'',term_months:'',monthly_payment:'',
    property_tax_monthly:'',insurance_monthly:'',payment_account_id:'',payment_due_day:'',
    start_date:'',maturity_date:'',account_id:'',notes:''};

  const load=useCallback(async()=>{
    setLoading(true);
    try{const[l,a]=await Promise.all([apiFetch('/loans'),apiFetch('/accounts')]);setLoans(l);setAccounts(a);}
    catch(e){toast('Failed to load loans','error');}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[load]);

  const saveLoan=async()=>{
    const body={...editVals,
      original_principal:parseFloat(editVals.original_principal)||0,
      current_balance:editVals.current_balance!==''?parseFloat(editVals.current_balance):null,
      interest_rate:editVals.interest_rate!==''?parseFloat(editVals.interest_rate):null,
      term_months:editVals.term_months!==''?parseInt(editVals.term_months):null,
      remaining_term_months:editVals.remaining_term_months!==''?parseInt(editVals.remaining_term_months):null,
      monthly_payment:editVals.monthly_payment!==''?parseFloat(editVals.monthly_payment):null,
      property_tax_monthly:editVals.property_tax_monthly!==''?parseFloat(editVals.property_tax_monthly):null,
      insurance_monthly:editVals.insurance_monthly!==''?parseFloat(editVals.insurance_monthly):null,
      payment_account_id:editVals.payment_account_id?parseInt(editVals.payment_account_id):null,
      payment_due_day:editVals.payment_due_day!==''?parseInt(editVals.payment_due_day):null,
      account_id:editVals.account_id?parseInt(editVals.account_id):null,
    };
    try{
      if(editing==='new'){await apiFetch('/loans',{method:'POST',body:JSON.stringify(body)});toast('Loan created');}
      else{await apiFetch(`/loans/${editing}`,{method:'PATCH',body:JSON.stringify(body)});toast('Loan updated');}
      setEditing(null);await load();
    }catch(e){toast('Failed to save: '+e.message,'error');}
  };

  const deleteLoan=async(id)=>{
    if(!confirm('Deactivate this loan?'))return;
    try{await apiFetch(`/loans/${id}`,{method:'DELETE'});toast('Loan deactivated');await load();}
    catch(e){toast('Failed','error');}
  };

  const openLinkModal=async(loan)=>{
    setLinkModal(loan);setLinkPreview(null);setCandidates([]);setLinkedTxns([]);
    try{
      const[cands,preview,linked]=await Promise.all([
        apiFetch(`/loans/${loan.id}/candidate-transactions`),
        apiFetch(`/loans/${loan.id}/compute-split`),
        apiFetch(`/loans/${loan.id}/linked-transactions`),
      ]);
      setCandidates(cands);setLinkPreview(preview);setLinkedTxns(linked);
    }catch(e){toast('Failed to load candidates: '+e.message,'error');}
  };

  const doLink=async(txnId)=>{
    if(!linkModal)return;
    setLinking(true);
    try{
      const r=await apiFetch(`/loans/${linkModal.id}/link-transaction`,{method:'POST',body:JSON.stringify({transaction_id:txnId})});
      toast(`Linked! Principal ${fmt(r.split.principal)}, Interest ${fmt(r.split.interest)}. New balance: ${fmt(r.new_balance)}`);
      setLinkModal(null);await load();
    }catch(e){toast('Link failed: '+e.message,'error');}
    finally{setLinking(false);}
  };

  const doUnlink=async(txnId)=>{
    if(!linkModal)return;
    if(!confirm('Unlink this payment? The loan balance will be restored.'))return;
    try{
      await apiFetch(`/loans/${linkModal.id}/unlink-transaction/${txnId}`,{method:'DELETE'});
      toast('Payment unlinked');
      const[cands,preview,linked]=await Promise.all([
        apiFetch(`/loans/${linkModal.id}/candidate-transactions`),
        apiFetch(`/loans/${linkModal.id}/compute-split`),
        apiFetch(`/loans/${linkModal.id}/linked-transactions`),
      ]);
      setCandidates(cands);setLinkPreview(preview);setLinkedTxns(linked);
      await load();
    }catch(e){toast('Unlink failed: '+e.message,'error');}
  };

  const totalPrincipal=loans.reduce((s,l)=>s+l.original_principal,0);
  const totalBalance=loans.reduce((s,l)=>s+(l.current_balance||0),0);
  const totalPayment=loans.reduce((s,l)=>s+(l.monthly_payment||0),0);

  return(
    <div>
      {linkModal&&<div className="review-overlay" onClick={e=>e.target===e.currentTarget&&setLinkModal(null)}>
        <div className="review-panel" style={{width:620,maxHeight:'80vh',overflowY:'auto'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <div>
              <div style={{fontSize:15,fontWeight:600}}>Link Payment — {linkModal.lender}</div>
              <div style={{fontSize:12,color:'var(--text-muted)'}}>Pick the checking transaction that represents this loan payment</div>
            </div>
            <button className="btn btn-sm btn-ghost" onClick={()=>setLinkModal(null)}>✕</button>
          </div>
          {linkedTxns.length>0&&<div style={{marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:6}}>Linked Payments</div>
            <div className="table-wrap"><table>
              <thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Principal</th><th></th></tr></thead>
              <tbody>{linkedTxns.map(t=>{
                const principal=t.splits.find(s=>s.description==='Principal');
                return(
                  <tr key={t.id}>
                    <td style={{fontFamily:'DM Mono',fontSize:12}}>{t.date}</td>
                    <td style={{fontSize:12}}>{t.description}</td>
                    <td style={{fontFamily:'DM Mono',fontSize:12,color:'var(--red)'}}>{fmt(t.amount)}</td>
                    <td style={{fontFamily:'DM Mono',fontSize:12}}>{principal?fmt(principal.amount):'—'}</td>
                    <td><button className="btn btn-sm btn-ghost" style={{color:'var(--red)'}} onClick={()=>doUnlink(t.id)}>Unlink</button></td>
                  </tr>
                );
              })}</tbody>
            </table></div>
          </div>}
          {linkPreview&&<div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:8,padding:'10px 14px',marginBottom:12,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
            {[['Principal',linkPreview.principal,'var(--text)'],['Interest',linkPreview.interest,'var(--red)'],['Prop Tax',linkPreview.property_tax,'var(--text-secondary)'],['Insurance',linkPreview.insurance,'var(--text-secondary)']].map(([lbl,val,color])=>(
              <div key={lbl} style={{textAlign:'center'}}>
                <div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase'}}>{lbl}</div>
                <div style={{fontSize:15,fontWeight:600,fontFamily:'DM Mono',color}}>{fmt(val)}</div>
              </div>
            ))}
          </div>}
          {candidates.length===0
            ?<div style={{padding:'20px 0',textAlign:'center',color:'var(--text-muted)',fontSize:13}}>
                No matching transactions found.<br/>
                <span style={{fontSize:12}}>Ensure the loan has "Paid From" account and "Total Monthly Payment" set, and that the transaction exists in the DB.</span>
              </div>
            :<div className="table-wrap"><table>
              <thead><tr><th>Date</th><th>Description</th><th>Amount</th><th></th></tr></thead>
              <tbody>{candidates.map(t=>(
                <tr key={t.id}>
                  <td style={{fontFamily:'DM Mono',fontSize:12}}>{t.date}</td>
                  <td style={{fontSize:12}}>{t.description_clean||t.description_raw}</td>
                  <td style={{fontFamily:'DM Mono',fontSize:12,color:'var(--red)'}}>{fmt(t.amount)}</td>
                  <td><button className="btn btn-sm btn-primary" onClick={()=>doLink(t.id)} disabled={linking}>Link</button></td>
                </tr>
              ))}</tbody>
            </table></div>}
        </div>
      </div>}

      {editing&&<div style={{marginBottom:16}}>
        <LoanForm editVals={editVals} setEditVals={setEditVals} accounts={accounts}
          loanTypes={loanTypes} isNew={editing==='new'}
          onSave={saveLoan} onCancel={()=>setEditing(null)}/>
      </div>}

      <div className="metric-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:20}}>
        <div className="card metric-card"><div className="metric-label">Total Principal</div><div className="metric-value">{fmt(totalPrincipal)}</div></div>
        <div className="card metric-card"><div className="metric-label">Total Balance</div><div className="metric-value" style={{color:'var(--red)'}}>{fmt(Math.abs(totalBalance))}</div></div>
        <div className="card metric-card"><div className="metric-label">Monthly Payments</div><div className="metric-value">{fmt(totalPayment)}</div></div>
      </div>

      <div className="card">
        <div className="section-header">
          <div className="section-title">Loans ({loans.length})</div>
          <button className="btn btn-sm btn-primary" onClick={()=>{setEditing('new');setEditVals({...blankLoan});}}>+ Add Loan</button>
        </div>
        {loading?<div className="loading"><div className="spinner"/></div>
          :loans.length===0&&!editing?<div className="empty"><div className="empty-icon">⌂</div><span>No loans yet</span></div>
          :<div className="table-wrap"><table>
            <thead><tr><th>Lender</th><th>Type</th><th>Balance</th><th>Rate</th><th>P&amp;I / Tax / Ins</th><th>Remaining</th><th>Due</th><th>Actions</th></tr></thead>
            <tbody>{loans.map(l=>(
              <tr key={l.id}>
                <td style={{fontWeight:500}}>{l.lender}</td>
                <td><span className="badge badge-category" style={{fontSize:11}}>{toTitleCase(l.loan_type||'')}</span></td>
                <td style={{fontFamily:'DM Mono',fontSize:13,color:'var(--red)'}}>{l.current_balance!=null?fmt(Math.abs(l.current_balance)):'—'}{l.balance_date&&<span style={{fontSize:10,color:'var(--text-muted)',display:'block'}}>as of {l.balance_date}</span>}</td>
                <td style={{fontFamily:'DM Mono',fontSize:13}}>{l.interest_rate!=null?`${l.interest_rate}%`:'—'}</td>
                <td style={{fontSize:12}}>
                  {l.next_split?<span style={{fontFamily:'DM Mono'}}>
                    {fmt(l.next_split.principal)} / {fmt(l.next_split.interest)}{l.next_split.property_tax>0?` / ${fmt(l.next_split.property_tax)}`:''}
                  </span>:<span style={{color:'var(--text-muted)'}}>—</span>}
                </td>
                <td style={{fontSize:12,color:'var(--text-muted)'}}>{l.remaining_term_months!=null?`${l.remaining_term_months} mo`:'—'}</td>
                <td style={{fontSize:12}}>{l.payment_due_day?`Day ${l.payment_due_day}`:<span style={{color:'var(--text-muted)'}}>—</span>}</td>
                <td><div className="edit-actions">
                  <button className="btn btn-sm btn-secondary" onClick={()=>{setEditing(l.id);setEditVals({lender:l.lender,loan_type:l.loan_type,original_principal:l.original_principal,current_balance:l.current_balance??'',balance_date:l.balance_date||'',remaining_term_months:l.remaining_term_months??'',interest_rate:l.interest_rate??'',term_months:l.term_months??'',monthly_payment:l.monthly_payment??'',property_tax_monthly:l.property_tax_monthly??'',insurance_monthly:l.insurance_monthly??'',payment_account_id:l.payment_account_id??'',payment_due_day:l.payment_due_day??'',start_date:l.start_date||'',maturity_date:l.maturity_date||'',account_id:l.account_id??'',notes:l.notes||''});}}>Edit</button>
                  <button className="btn btn-sm btn-ghost" title="Link a payment transaction" onClick={()=>openLinkModal(l)}>💰</button>
                  <button className="btn btn-sm btn-ghost" style={{color:'var(--red)'}} onClick={()=>deleteLoan(l.id)}>×</button>
                </div></td>
              </tr>
            ))}</tbody>
          </table></div>
        }
      </div>
    </div>
  );
}

/* ── Daily Balances Page ─────────────────────────────────────────────────── */
function DailyBalancesPage({toast}){
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[rangeMode,setRangeMode]=useState('month');
  const[customStart,setCustomStart]=useState('');
  const[customEnd,setCustomEnd]=useState('');
  // All groups expanded by default; collapse Others that are less common
  const[collapsed,setCollapsed]=useState({'Other Assets':true,'Other Liabilities':true});

  const getRange=()=>{
    const n=new Date();
    if(rangeMode==='month'){
      const y=n.getFullYear(),m=n.getMonth()+1;
      const s=`${y}-${String(m).padStart(2,'0')}-01`;
      const last=new Date(y,m,0).getDate();
      return{s,e:`${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}`};
    }
    if(rangeMode==='quarter'){
      const y=n.getFullYear(),m=n.getMonth()+1;
      const qs=Math.floor((m-1)/3)*3+1,qe=qs+2;
      const last=new Date(y,qe,0).getDate();
      return{s:`${y}-${String(qs).padStart(2,'0')}-01`,e:`${y}-${String(qe).padStart(2,'0')}-${String(last).padStart(2,'0')}`};
    }
    return{s:customStart,e:customEnd};
  };

  const load=useCallback(async()=>{
    const{s,e}=getRange();
    if(rangeMode==='custom'&&(!s||!e))return;
    setLoading(true);
    try{
      const ct=todayStr(); // client's local date — avoids UTC midnight drift
      const q=`?client_today=${ct}${s?`&start_date=${s}`:''}${e?`&end_date=${e}`:''}`;
      setData(await apiFetch(`/daily-balances${q}`));
    }catch(err){toast('Failed to load daily balances','error');}
    finally{setLoading(false);}
  },[rangeMode,customStart,customEnd]);

  useEffect(()=>{load();},[load]);

  const toggle=g=>setCollapsed(p=>({...p,[g]:!p[g]}));

  const fmtBal=v=>{
    if(v==null)return'—';
    const abs=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    return v<0?`(${abs})`:abs;
  };

  const GRP_COLORS={'Checking & Savings':'#f0fdf4','Investments':'#eff6ff','Other Assets':'#f5f3ff','Credit Cards':'#fff7ed','Loans':'#fef2f2','Other Liabilities':'#fef2f2'};

  if(loading)return<div className="loading"><div className="spinner"/><span>Loading…</span></div>;
  if(!data||!data.dates)return<div style={{padding:20,color:'var(--text-muted)'}}>No data</div>;

  const{dates,groups,today}=data;
  const numDays=dates.length;

  return(
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div><h2 style={{fontSize:18,fontWeight:600}}>Daily Balances</h2>
          <p style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{numDays} days · end-of-day · italic = projected CC payment</p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:4,background:'var(--card-bg)',border:'1px solid var(--border)',borderRadius:10,padding:4}}>
            {[['month','This Month'],['quarter','This Quarter'],['custom','Custom']].map(([v,l])=>(
              <button key={v} className={`btn btn-sm ${rangeMode===v?'btn-primary':'btn-ghost'}`} onClick={()=>setRangeMode(v)} style={{borderRadius:7}}>{l}</button>
            ))}
          </div>
          {rangeMode==='custom'&&<>
            <input type="date" value={customStart} onChange={e=>setCustomStart(e.target.value)} style={{fontSize:12,border:'1px solid var(--border)',borderRadius:6,padding:'4px 8px'}}/>
            <span style={{fontSize:12}}>–</span>
            <input type="date" value={customEnd} onChange={e=>setCustomEnd(e.target.value)} style={{fontSize:12,border:'1px solid var(--border)',borderRadius:6,padding:'4px 8px'}}/>
            <button className="btn btn-sm btn-primary" onClick={load}>Go</button>
          </>}
        </div>
      </div>

      <div style={{overflowX:'auto',borderRadius:10,border:'1px solid var(--border)',background:'var(--card-bg)',maxHeight:'75vh',overflowY:'auto'}}>
        <table style={{borderCollapse:'collapse',fontSize:12,width:'100%'}}>
          <thead style={{position:'sticky',top:0,zIndex:10}}>
            {/* Row 1: Group headers */}
            <tr>
              <th rowSpan={2} style={{position:'sticky',left:0,zIndex:12,background:'#f8fafc',padding:'8px 12px',textAlign:'left',fontSize:11,fontWeight:700,borderBottom:'2px solid var(--border)',borderRight:'2px solid var(--border)',whiteSpace:'nowrap',minWidth:70}}>Date</th>
              {groups.map(grp=>{
                const span=collapsed[grp.group]?1:1+grp.accounts.length;
                return(
                  <th key={grp.group} colSpan={span} style={{padding:'6px 10px',textAlign:'center',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',borderBottom:'1px solid var(--border)',borderLeft:'2px solid var(--border)',background:GRP_COLORS[grp.group]||'#f9fafb',cursor:'pointer',userSelect:'none',whiteSpace:'nowrap'}}
                    onClick={()=>toggle(grp.group)}>
                    {grp.group} {collapsed[grp.group]?'▶':'▼'}
                  </th>
                );
              })}
              {/* Grand Total = Net Worth per date */}
              <th rowSpan={2} style={{padding:'6px 10px',textAlign:'right',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',borderBottom:'2px solid var(--border)',borderLeft:'3px solid #6366f1',background:'#eef2ff',whiteSpace:'nowrap',color:'#4338ca',minWidth:100}}>Grand Total</th>
            </tr>
            {/* Row 2: Account name sub-headers */}
            <tr style={{background:'var(--card-bg)'}}>
              {groups.map(grp=>[
                <th key={grp.group+'-t'} style={{padding:'5px 8px',textAlign:'right',fontSize:10,fontWeight:700,borderBottom:'2px solid var(--border)',borderLeft:'2px solid var(--border)',background:GRP_COLORS[grp.group]||'#f9fafb',whiteSpace:'nowrap',color:'#374151'}}>Total</th>,
                ...(!collapsed[grp.group]?grp.accounts.map(acct=>(
                  <th key={acct.id} style={{padding:'5px 8px',textAlign:'right',fontSize:10,fontWeight:500,borderBottom:'2px solid var(--border)',borderLeft:'1px solid var(--border)',background:'var(--card-bg)',whiteSpace:'nowrap',maxWidth:110,overflow:'hidden',textOverflow:'ellipsis'}} title={acct.account_name}>{acct.account_name}</th>
                )):[])
              ])}
            </tr>
          </thead>
          <tbody>
            {dates.map((d,di)=>{
              const isToday=d===today;
              const isFuture=d>today;
              const rowBg=isToday?'#fef9c3':isFuture?'#fafafa':'transparent';
              return(
                <tr key={d} style={{background:rowBg}}>
                  <td style={{position:'sticky',left:0,zIndex:2,background:isToday?'#fef9c3':isFuture?'#fafafa':'var(--card-bg)',padding:'3px 10px',fontFamily:'DM Mono',fontSize:11,borderRight:'2px solid var(--border)',borderBottom:'1px solid #f0f0f0',whiteSpace:'nowrap',color:isToday?'#92400e':isFuture?'var(--text-muted)':'var(--text-secondary)',fontWeight:isToday?700:400}}>
                    {d.slice(5)}{isToday&&<span style={{marginLeft:5,fontSize:9,fontWeight:800,background:'#fbbf24',color:'#fff',borderRadius:3,padding:'1px 4px'}}>TODAY</span>}
                  </td>
                  {(()=>{
                    /* For each group: liabilities always shown as (negative) in red */
                    let grandTotal=0;
                    const cells=groups.flatMap(grp=>{
                      const isLiab=!grp.is_asset;
                      const rawTot=grp.totals[di];
                      /* contribution to net worth: assets add, liabilities subtract */
                      grandTotal+=isLiab?-Math.abs(rawTot??0):(rawTot??0);
                      const dispTot=isLiab?-Math.abs(rawTot??0):(rawTot??0);
                      const totCell=(
                        <td key={grp.group+'-t'} style={{padding:'3px 8px',textAlign:'right',fontFamily:'DM Mono',fontWeight:600,fontSize:12,borderLeft:'2px solid var(--border)',borderBottom:'1px solid #f0f0f0',color:isLiab?'var(--red)':dispTot<0?'var(--red)':'inherit',background:isLiab?'#fff5f5':dispTot<0?'#fff5f5':undefined,whiteSpace:'nowrap'}}>{fmtBal(dispTot)}</td>
                      );
                      const acctCells=!collapsed[grp.group]?grp.accounts.map(acct=>{
                        const rawVal=acct.balances[di];
                        const dispVal=isLiab?-Math.abs(rawVal??0):(rawVal??0);
                        const isProj=acct.projected_dates&&acct.projected_dates.length>0&&d>=acct.projected_dates[0];
                        return(
                          <td key={acct.id} style={{padding:'3px 8px',textAlign:'right',fontFamily:'DM Mono',fontSize:11,borderLeft:'1px solid #f0f0f0',borderBottom:'1px solid #f0f0f0',color:isLiab?'var(--red)':dispVal<0?'var(--red)':'inherit',fontStyle:isProj?'italic':'normal',opacity:isProj?0.8:1,whiteSpace:'nowrap'}}>{fmtBal(dispVal)}</td>
                        );
                      }):[];
                      return[totCell,...acctCells];
                    });
                    grandTotal=Math.round(grandTotal*100)/100;
                    const gtColor=grandTotal>=0?'var(--green)':'var(--red)';
                    cells.push(
                      <td key="grand-total" style={{padding:'3px 10px',textAlign:'right',fontFamily:'DM Mono',fontWeight:700,fontSize:12,borderLeft:'3px solid #6366f1',borderBottom:'1px solid #f0f0f0',color:gtColor,background:'#eef2ff',whiteSpace:'nowrap'}}>{fmtBal(grandTotal)}</td>
                    );
                    return cells;
                  })()}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App(){
  const[page,setPage]=useState('dashboard');
  const[categories,setCategories]=useState([]);
  const[banks,setBanks]=useState([]);
  const[collapsed,setCollapsed]=useState(()=>{try{return localStorage.getItem('nav-collapsed')==='1';}catch(e){return false;}});
  const{toasts,toast}=useToast();

  const loadMeta=useCallback(async()=>{
    try{const[c,b]=await Promise.all([apiFetch('/categories'),apiFetch('/plaid/items')]);setCategories(c);setBanks(b);}catch(e){}
  },[]);

  useEffect(()=>{
    loadMeta();
    if(!document.getElementById('plaid-script')){const s=document.createElement('script');s.id='plaid-script';s.src='https://cdn.plaid.com/link/v2/stable/link-initialize.js';document.head.appendChild(s);}
  },[]);

  const sync=async()=>{
    try{
      const r=await apiFetch('/plaid/sync-transactions',{method:'POST'});
      toast(`Sync started for ${r.items_synced} bank${r.items_synced!==1?'s':''} — transactions will appear shortly`);
      loadMeta();
      setTimeout(loadMeta,15000);
    }catch(e){toast('Sync failed: '+(e.message||e),'error');}
  };

  const openPlaid=usePlaidLink(toast,loadMeta);
  const titles={dashboard:'Dashboard',transactions:'Transactions',budgets:'Budgets',networth:'Net Worth',cashflow:'Daily Balances',loans:'Loans',gcb:'GCB',cards:'Cards',accounts:'Accounts',settings:'Settings'};

  return(
    <div style={{display:'flex',height:'100vh'}}>
      <Sidebar page={page} setPage={setPage} banks={banks} onConnectBank={openPlaid} onSync={sync} collapsed={collapsed} setCollapsed={setCollapsed}/>
      <div className="main" style={{marginLeft:collapsed?56:220}}>
        <div className="topbar">
          <div className="topbar-title">{titles[page]}</div>
          <div>{banks.length>0&&<span className="bank-badge">● {banks.length} account{banks.length!==1?'s':''} connected</span>}</div>
        </div>
        <div className="content">
          {page==='dashboard'&&<DashboardPage categories={categories} toast={toast}/>}
          {page==='transactions'&&<TransactionsPage categories={categories} toast={toast}/>}
          {page==='budgets'&&<BudgetsPage categories={categories} toast={toast}/>}
          {page==='cashflow'&&<DailyBalancesPage toast={toast}/>}
          {page==='networth'&&<NetWorthPage toast={toast}/>}
          {page==='loans'&&<LoansPage toast={toast}/>}
          {page==='accounts'&&<AccountsPage banks={banks} onConnectBank={openPlaid} onSync={sync} toast={toast}/>}
          {page==='cards'&&<CardsPage toast={toast}/>}
          {page==='gcb'&&<GCBPage toast={toast}/>}
          {page==='settings'&&<SettingsPage banks={banks} onConnectBank={openPlaid} toast={toast} onBanksChanged={loadMeta} categories={categories}/>}
        </div>
      </div>
      <ToastContainer toasts={toasts}/>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
