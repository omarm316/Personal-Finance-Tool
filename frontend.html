/* Modal for creating a manual account (Section 2b) */
function ManualAccountModal({onClose,onSaved,toast}){
  const[name,setName]=useState('');
  const[type,setType]=useState('Checking');
  const[balance,setBalance]=useState('0');
  const[startDate,setStartDate]=useState(todayStr());
  const[notes,setNotes]=useState('');
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState('');
  const handleSave=async()=>{
    if(!name){setError('Account name is required');return;}
    setSaving(true);setError('');
    try{
      /* POST /api/accounts — creates manual account with starting balance */
      await apiFetch('/accounts',{method:'POST',body:JSON.stringify({name,account_type:type,starting_balance:parseFloat(balance)||0,start_date:startDate,notes:notes||null})});
      toast('Manual account created');onSaved();onClose();
    }catch(e){setError('Failed to create account');}
    finally{setSaving(false);}
  };
  return(
    <div className="review-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="review-panel">
        <div style={{fontSize:16,fontWeight:600,marginBottom:16}}>Add Manual Account</div>
        {error&&<div style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{error}</div>}
        <div className="review-field"><label>Account Name *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Home, Vehicle, Cash"/></div>
        <div className="review-field"><label>Account Type</label>
          <select value={type} onChange={e=>setType(e.target.value)}>
            {/* All valid types — Title Case values match what the backend normalises to */}
            {[['Checking','Checking'],['Savings','Savings'],['Cash','Cash'],['Gift Card','Gift Card'],
              ['Investment','Investment'],['Real Estate','Real Estate'],['Vehicle','Vehicle'],
              ['Business','Business'],['Credit Card','Credit Card'],['Loan','Loan'],['Other','Other']
            ].map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </select>
        </div>
        <div className="review-field"><label>Starting Balance ($)</label><input type="number" step="0.01" value={balance} onChange={e=>setBalance(e.target.value)} placeholder="0.00"/></div>
        <div className="review-field"><label>Start Date</label><input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}/></div>
        <div className="review-field"><label>Notes</label><input value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional"/></div>
        <div className="review-actions">
          <button className="btn btn-sm btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-sm btn-success" onClick={handleSave} disabled={saving}>{saving?'…':'✓ Create'}</button>
        </div>
      </div>
    </div>
  );
}

/* ── Merge Account Modal ─────────────────────────────────────────────────────
   Reassigns all transactions from the source account into a chosen target,
   then deletes the source. Used to clean up duplicate accounts. */
function MergeAccountModal({source,allAccounts,onDone,onClose}){
  const others=allAccounts.filter(a=>a.id!==source.id);
  const[targetId,setTargetId]=useState('');
  const[busy,setBusy]=useState(false);
  const target=others.find(a=>a.id===parseInt(targetId));
  const doMerge=async()=>{
    if(!targetId)return;
    setBusy(true);
    try{
      const r=await apiFetch(`/accounts/${source.id}/merge-into/${targetId}`,{method:'POST'});
      onDone(`Merged — ${r.transactions_moved} transactions moved to "${target?.account_name}"`);
    }catch(e){onDone(null,'Merge failed: '+(e.message||'error'));}
    finally{setBusy(false);}
  };
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content" onClick={e=>e.stopPropagation()} style={{maxWidth:440}}>
        <div className="modal-header">
          <h3 style={{margin:0}}>Merge Account</h3>
          <button className="btn btn-ghost" onClick={onClose}>✕</button>
        </div>
        <div style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:14}}>
          <p style={{margin:0,fontSize:13,color:'var(--text-muted)'}}>
            All transactions from <strong>{source.account_name}</strong> ({source.transaction_count} txns) will be moved to the account you select below. The source account will then be deleted.
          </p>
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'var(--text-secondary)',marginBottom:4,display:'block'}}>Move into</label>
            <select value={targetId} onChange={e=>setTargetId(e.target.value)} className="filter-select" style={{width:'100%'}}>
              <option value="">— select target account —</option>
              {others.map(a=><option key={a.id} value={a.id}>{a.account_name} ({a.transaction_count} txns)</option>)}
            </select>
          </div>
          {target&&<p style={{margin:0,fontSize:12,background:'#fffbeb',border:'1px solid #fde68a',borderRadius:6,padding:'8px 12px',color:'#92400e'}}>
            ⚠ <strong>{source.account_name}</strong> will be permanently deleted after the merge.
          </p>}
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8,padding:'12px 20px',borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={doMerge} disabled={!targetId||busy}>{busy?'Merging…':'Merge & Delete Source'}</button>
        </div>
      </div>
    </div>
  );
}

/* ── Delete Account Modal ────────────────────────────────────────────────────
   Permanently deletes an account and all its transactions. */
function DeleteAccountModal({account,onDone,onClose}){
  const[busy,setBusy]=useState(false);
  const doDelete=async()=>{
    setBusy(true);
    try{
      const r=await apiFetch(`/accounts/${account.id}`,{method:'DELETE'});
      onDone(`Deleted "${account.account_name}" and ${r.transactions_deleted} transactions`);
    }catch(e){onDone(null,'Delete failed: '+(e.message||'error'));}
    finally{setBusy(false);}
  };
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
        <div className="modal-header">
          <h3 style={{margin:0,color:'var(--red)'}}>Delete Account</h3>
          <button className="btn btn-ghost" onClick={onClose}>✕</button>
        </div>
        <div style={{padding:'16px 20px'}}>
          <p style={{margin:'0 0 12px',fontSize:13}}>This will permanently delete:</p>
          <ul style={{margin:'0 0 16px',paddingLeft:20,fontSize:13,lineHeight:1.7}}>
            <li><strong>{account.account_name}</strong></li>
            <li><strong>{account.transaction_count} transaction{account.transaction_count!==1?'s':''}</strong></li>
          </ul>
          <p style={{margin:0,fontSize:13,color:'var(--red)',fontWeight:600}}>This cannot be undone.</p>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8,padding:'12px 20px',borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-sm" style={{background:'var(--red)',color:'#fff',border:'none',padding:'6px 14px'}} onClick={doDelete} disabled={busy}>{busy?'Deleting…':'Delete Permanently'}</button>
        </div>
      </div>
    </div>
  );
}

/* AccountRow is a top-level component so React never remounts it on parent
   re-renders (same fix as LoanForm — defining it inside AccountsPage would
   create a new function reference each render, causing React to unmount/remount
   the row and swallow click events before modals can open). */
function AccountRow({a,showPlaidActions,editingId,editVals,setEditVals,onSave,onCancel,onStartEdit,onSever,onMerge,onDelete}){
  const isEditing=editingId===a.id;
  return(
    <div style={{padding:'14px 20px',borderBottom:'1px solid #f3f4f6',display:'flex',alignItems:'center',gap:12}}>
      <span style={{width:7,height:7,borderRadius:'50%',background:a.is_manual?(a.is_asset?'var(--blue)':'var(--red)'):'#22c55e',flexShrink:0}}/>
      <div style={{flex:1}}>
        {isEditing?<>
          <input value={editVals.account_name} onChange={e=>setEditVals(v=>({...v,account_name:e.target.value}))} style={{fontSize:14,fontWeight:500,border:'1px solid var(--border)',borderRadius:6,padding:'4px 8px',width:'100%',marginBottom:4}}/>
          <input value={editVals.notes} onChange={e=>setEditVals(v=>({...v,notes:e.target.value}))} placeholder="Notes (optional)" style={{fontSize:12,border:'1px solid var(--border)',borderRadius:6,padding:'3px 8px',width:'100%',color:'var(--text-muted)'}}/>
        </>:<>
          <div style={{fontSize:14,fontWeight:500}}>{a.account_name}</div>
          <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>
            {a.account_type}{a.mask?` ····${a.mask}`:''}{a.bucket?` · ${a.bucket}`:''}{a.notes?` · ${a.notes}`:''}
          </div>
        </>}
      </div>
      {!a.is_manual&&<span className="bank-badge">● Connected</span>}
      {a.is_manual&&<span style={{fontFamily:'DM Mono',fontSize:13,fontWeight:500,color:a.is_liability?'var(--red)':'var(--green)'}}>{fmt(a.starting_balance||0)}</span>}
      <span style={{fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap'}}>{a.transaction_count} txns</span>
      <div style={{display:'flex',gap:6,flexShrink:0}}>
        {isEditing?<>
          <button className="btn btn-sm btn-success" onClick={()=>onSave(a.id)}>Save</button>
          <button className="btn btn-sm btn-ghost" onClick={onCancel}>Cancel</button>
        </>:<>
          <button className="btn btn-sm btn-secondary" onClick={()=>onStartEdit(a)}>Edit</button>
          {showPlaidActions&&<button className="btn btn-sm" style={{background:'#fff7ed',color:'#c2410c',border:'1px solid #fed7aa',fontSize:11}} onClick={()=>onSever(a)}>Sever</button>}
          <button className="btn btn-sm" style={{background:'#eff6ff',color:'#1d4ed8',border:'1px solid #bfdbfe',fontSize:11}} onClick={()=>onMerge(a)}>Merge →</button>
          <button className="btn btn-sm" style={{background:'#fef2f2',color:'var(--red)',border:'1px solid #fecaca',fontSize:11}} onClick={()=>onDelete(a)}>Delete</button>
        </>}
      </div>
    </div>
  );
}

function AccountsPage({banks,onConnectBank,onSync,toast}){
  const[accounts,setAccounts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[showManual,setShowManual]=useState(false);
  const[editingId,setEditingId]=useState(null);
  const[editVals,setEditVals]=useState({});
  const[mergeAccount,setMergeAccount]=useState(null);
  const[deleteAccount,setDeleteAccount]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);
    try{setAccounts(await apiFetch('/accounts'));}catch(e){}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[load]);

  const plaidAccounts=accounts.filter(a=>!a.is_manual);
  const manualAccounts=accounts.filter(a=>a.is_manual);

  const startEdit=(a)=>{setEditingId(a.id);setEditVals({account_name:a.account_name||'',notes:a.notes||''});};
  const cancelEdit=()=>{setEditingId(null);setEditVals({});};
  const saveEdit=async(id)=>{
    try{await apiFetch(`/accounts/${id}`,{method:'PATCH',body:JSON.stringify(editVals)});toast('Account updated');setEditingId(null);await load();}
    catch(e){toast('Failed to save','error');}
  };
  const severPlaid=async(a)=>{
    if(!confirm(`Sever Plaid connection for "${a.account_name}"? Transactions will be kept.`))return;
    try{await apiFetch(`/accounts/${a.id}/sever-plaid`,{method:'POST'});toast('Plaid connection severed');await load();}
    catch(e){toast('Failed: '+(e.message||'error'),'error');}
  };
  const handleMergeDone=(msg,err)=>{setMergeAccount(null);if(err)toast(err,'error');else{toast(msg);load();}};
  const handleDeleteDone=(msg,err)=>{setDeleteAccount(null);if(err)toast(err,'error');else{toast(msg);load();}};

  const rowProps={editingId,editVals,setEditVals,onSave:saveEdit,onCancel:cancelEdit,onStartEdit:startEdit,onSever:severPlaid,onMerge:setMergeAccount,onDelete:setDeleteAccount};

  return(
    <div>
      {showManual&&<ManualAccountModal onClose={()=>setShowManual(false)} onSaved={load} toast={toast}/>}
      {mergeAccount&&<MergeAccountModal source={mergeAccount} allAccounts={accounts} onDone={handleMergeDone} onClose={()=>setMergeAccount(null)}/>}
      {deleteAccount&&<DeleteAccountModal account={deleteAccount} onDone={handleDeleteDone} onClose={()=>setDeleteAccount(null)}/>}
      <div className="card" style={{marginBottom:20}}>
        <div className="section-header">
          <div className="section-title">Plaid Accounts ({plaidAccounts.length})</div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-sm btn-secondary" onClick={onSync}>↻ Sync All</button>
            <button className="btn btn-sm btn-primary" onClick={onConnectBank}>+ Connect Bank</button>
          </div>
        </div>
        {plaidAccounts.length===0?<div className="empty"><div className="empty-icon">◫</div><span>No Plaid accounts connected</span></div>
          :plaidAccounts.map(a=><AccountRow key={a.id} a={a} showPlaidActions={true} {...rowProps}/>)}
      </div>
      <div className="card">
        <div className="section-header">
          <div className="section-title">Manual Accounts ({manualAccounts.length})</div>
          <button className="btn btn-sm btn-primary" onClick={()=>setShowManual(true)}>+ Manual Account</button>
        </div>
        {manualAccounts.length===0?<div className="empty" style={{padding:40}}><div className="empty-icon">◫</div><span>No manual accounts yet</span></div>
          :manualAccounts.map(a=><AccountRow key={a.id} a={a} showPlaidActions={false} {...rowProps}/>)}
      </div>
    </div>
  );
}

function ResetResyncButton({toast,onDone}){
  const[busy,setBusy]=useState(false);
  const run=async()=>{
    if(!confirm('This will delete ALL Plaid-synced transactions and re-fetch everything from scratch. Manually entered transactions are kept. Continue?'))return;
    setBusy(true);
    try{
      const r=await apiFetch('/plaid/reset-and-resync',{method:'POST'});
      toast(`${r.message} — refreshing in 15s`);
      setTimeout(()=>onDone&&onDone(),15000);
    }catch(e){toast('Reset failed: '+(e.message||e),'error');}
    finally{setBusy(false);}
  };
  return<button className="btn btn-sm btn-ghost" style={{color:'var(--red)',border:'1px solid #fecaca',fontSize:11}} onClick={run} disabled={busy}>{busy?'Resetting…':'⟳ Reset & Full Resync'}</button>;
}

function BankRow({item,toast,onRenamed,onSynced}){
  const[editing,setEditing]=useState(false);
  const[nameVal,setNameVal]=useState(item.institution_name);
  const[resyncing,setResyncing]=useState(false);
  const[expanded,setExpanded]=useState(false);
  const[debug,setDebug]=useState(null);
  const[debugging,setDebugging]=useState(false);
  const[confirmingRemove,setConfirmingRemove]=useState(false);
  const save=async()=>{
    try{
      const r=await apiFetch(`/plaid/items/${item.item_id}`,{method:'PATCH',body:JSON.stringify({institution_name:nameVal})});
      onRenamed(item.item_id,r.institution_name);
      setEditing(false);
      toast('Name updated');
    }catch(e){toast('Failed to update: '+(e.message||e),'error');}
  };
  const forceResync=async()=>{
    setResyncing(true);
    try{
      await apiFetch(`/plaid/items/${item.item_id}/force-resync`,{method:'POST'});
      toast(`${item.institution_name}: sync started — refreshing in 15s`);
      setTimeout(()=>onSynced&&onSynced(),15000);
    }catch(e){toast(`Resync failed: ${e.message||e}`,'error');}
    finally{setResyncing(false);}
  };
  const runDebug=async()=>{
    setDebugging(true);setDebug(null);
    try{const r=await apiFetch(`/plaid/debug/${item.item_id}`);setDebug(r);}
    catch(e){toast('Debug failed: '+(e.message||e),'error');}
    finally{setDebugging(false);}
  };
  const envColor={'production':'#059669','development':'#d97706','sandbox':'#6366f1'}[item.environment]||'#6b7280';
  return(
    <div style={{borderBottom:'1px solid var(--border)',paddingBottom:12,marginBottom:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span className="bank-dot"/>
          <div>
            {editing
              ?<div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <input className="form-input" style={{padding:'3px 8px',fontSize:13,width:180}} value={nameVal} onChange={e=>setNameVal(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')save();if(e.key==='Escape')setEditing(false);}} autoFocus/>
                  <button className="btn btn-sm btn-primary" onClick={save}>Save</button>
                  <button className="btn btn-sm btn-ghost" onClick={()=>{setNameVal(item.institution_name);setEditing(false);}}>Cancel</button>
                </div>
              :<div style={{display:'flex',alignItems:'center',gap:6}}>
                  <div className="settings-label">{item.institution_name}</div>
                  <button className="btn btn-sm btn-ghost" style={{fontSize:11,padding:'1px 6px'}} onClick={()=>{setNameVal(item.institution_name);setEditing(true);}}>Edit</button>
                </div>
            }
            <div style={{display:'flex',gap:12,marginTop:3,flexWrap:'wrap'}}>
              <span className="settings-desc">{item.account_count} account{item.account_count!==1?'s':''}</span>
              <span className="settings-desc">{item.transaction_count.toLocaleString()} transaction{item.transaction_count!==1?'s':''}</span>
              <span className="settings-desc">{item.last_synced_at?`Last sync: ${fmtDate(item.last_synced_at)}`:'Never synced'}</span>
              <span className="settings-desc">Connected {item.created_at?fmtDate(item.created_at):''}</span>
            </div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em',color:envColor,background:`${envColor}18`,border:`1px solid ${envColor}40`,borderRadius:20,padding:'2px 8px'}}>{item.environment}</span>
          {item.is_active
            ?<span className="bank-badge">Active</span>
            :<span style={{fontSize:11,fontWeight:600,color:'#b45309',background:'#fef3c7',border:'1px solid #fde68a',borderRadius:20,padding:'2px 8px'}}>Stale</span>}
          <button className="btn btn-sm btn-ghost" style={{fontSize:11,padding:'1px 6px'}} onClick={()=>setExpanded(x=>!x)}>{expanded?'▲':'▼'}</button>
          {item.is_active&&<button className="btn btn-sm btn-ghost" style={{fontSize:11,padding:'1px 6px'}} onClick={runDebug} disabled={debugging}>{debugging?'…':'🔍 Debug'}</button>}
          {item.is_active&&<button className="btn btn-sm btn-secondary" onClick={forceResync} disabled={resyncing}>{resyncing?'Syncing…':'↺ Full Resync'}</button>}
          <button className="btn btn-sm btn-ghost" style={{color:'var(--red)',border:'1px solid #fecaca',fontSize:11}} onClick={async()=>{
            if(item.transaction_count===0){
              if(!confirm(`Remove "${item.institution_name}"? It has 0 transactions — its ${item.account_count} empty account${item.account_count!==1?'s':''} will be deleted.`))return;
              try{await apiFetch(`/plaid/items/${item.item_id}`,{method:'DELETE'});onSynced&&onSynced();toast('Removed');}
              catch(e){toast('Failed: '+(e.message||e),'error');}
            }else{
              setConfirmingRemove(true);
            }
          }}>Remove</button>
        </div>
      </div>
      {confirmingRemove&&(
        <div style={{marginTop:10,background:'#fff1f2',border:'1px solid #fecaca',borderRadius:8,padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
          <div>
            <div style={{fontWeight:700,color:'#b91c1c',fontSize:13,marginBottom:2}}>⚠️ Remove "{item.institution_name}"?</div>
            <div style={{fontSize:12,color:'#7f1d1d'}}>This will deactivate the connection — Plaid will stop syncing. Its <strong>{item.account_count} account{item.account_count!==1?'s':''}</strong> and <strong>{item.transaction_count.toLocaleString()} transaction{item.transaction_count!==1?'s':''}</strong> will be kept but no longer updated.</div>
          </div>
          <div style={{display:'flex',gap:8,flexShrink:0}}>
            <button className="btn btn-sm btn-ghost" style={{fontSize:12}} onClick={()=>setConfirmingRemove(false)}>Cancel</button>
            <button className="btn btn-sm" style={{background:'#b91c1c',color:'#fff',fontSize:12,border:'none'}} onClick={async()=>{
              setConfirmingRemove(false);
              try{await apiFetch(`/plaid/items/${item.item_id}`,{method:'DELETE'});onSynced&&onSynced();toast('Connection removed');}
              catch(e){toast('Failed: '+(e.message||e),'error');}
            }}>Yes, Remove</button>
          </div>
        </div>
      )}
      {expanded&&item.accounts&&item.accounts.length>0&&(
        <div style={{marginTop:10,marginLeft:28,display:'flex',flexDirection:'column',gap:4}}>
          {item.accounts.map((a,i)=>(
            <div key={i} style={{display:'flex',gap:10,fontSize:12,color:'var(--text-muted)'}}>
              <span style={{fontWeight:500,color:'var(--text)'}}>{a.name}</span>
              <span style={{textTransform:'capitalize'}}>{a.type}</span>
              {a.mask&&<span>····{a.mask}</span>}
            </div>
          ))}
        </div>
      )}
      {debug&&(
        <div style={{marginTop:10,marginLeft:28,background:'var(--bg-secondary)',borderRadius:8,padding:12,fontSize:12}}>
          <div style={{fontWeight:600,marginBottom:6}}>🔍 Plaid Diagnostic — {debug.institution}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 16px',marginBottom:8}}>
            <span style={{color:'var(--text-muted)'}}>Environment</span><span>{debug.environment}</span>
            <span style={{color:'var(--text-muted)'}}>Plaid raw transactions</span><span style={{fontWeight:600,color:debug.raw_added>0?'#059669':'var(--red)'}}>{debug.raw_added} added, {debug.raw_modified} modified</span>
            <span style={{color:'var(--text-muted)'}}>Has more pages</span><span>{debug.has_more_pages?'Yes':'No'}</span>
            <span style={{color:'var(--text-muted)'}}>Cursor stored</span><span>{debug.cursor_stored?'Yes (incremental)':'No (full history)'}</span>
            <span style={{color:'var(--text-muted)'}}>DB accounts</span><span>{debug.db_accounts.length}</span>
            <span style={{color:'var(--text-muted)'}}>Plaid accounts</span><span>{debug.plaid_accounts.length}</span>
            {debug.accounts_unmatched.length>0&&<><span style={{color:'var(--red)'}}>Unmatched IDs</span><span style={{color:'var(--red)'}}>{debug.accounts_unmatched.length} — these transactions will be skipped!</span></>}
          </div>
          <div style={{padding:'8px 10px',borderRadius:6,background:debug.raw_added===0?'#fef2f2':'#f0fdf4',color:debug.raw_added===0?'var(--red)':'#059669',fontWeight:500}}>{debug.diagnosis}</div>
        </div>
      )}
    </div>
  );
}

function SettingsPage({banks,onConnectBank,toast,onBanksChanged,categories}){
  const[tab,setTab]=useState('data');
  const[busy,setBusy]=useState(false);
  const[items,setItems]=useState([]);
  /* Rules tab state */
  const[rules,setRules]=useState([]);
  const[rulesLoading,setRulesLoading]=useState(false);
  const[ruleSearch,setRuleSearch]=useState('');
  const[ruleEditing,setRuleEditing]=useState(null);
  const[ruleEditVals,setRuleEditVals]=useState({});
  const[showAddRule,setShowAddRule]=useState(false);
  const[reapplying,setReapplying]=useState(false);

  const[balanceSyncing,setBalanceSyncing]=useState(false);
  const[balanceSyncResult,setBalanceSyncResult]=useState(null);
  const syncBalances=async(force=false)=>{
    setBalanceSyncing(true);
    try{
      const url='/accounts/sync-balances'+(force?'?force=true':'');
      const r=await apiFetch(url,{method:'POST'});
      setBalanceSyncResult({...r,force});
      const anchored=r.accounts.filter(a=>a.anchor_updated).length;
      const snaps=r.accounts.reduce((s,a)=>s+a.months_built,0);
      if(force){
        toast(`Force resync complete — ${anchored} anchor${anchored!==1?'s':''} updated, ${snaps} month snapshots rebuilt`);
      }else{
        toast(`Balance sync complete — ${snaps} month snapshots rebuilt${anchored>0?` (${anchored} new anchor${anchored!==1?'s':''} set)`:''}`);
      }
    }catch(e){toast('Balance sync failed: '+(e.message||e),'error');}
    finally{setBalanceSyncing(false);}
  };
  const[dupResult,setDupResult]=useState(null); // {duplicates, ignored}
  const[dupScanning,setDupScanning]=useState(false);
  const[dupMerging,setDupMerging]=useState(false);
  const dupGroups=dupResult?.duplicates||null;
  const dupIgnored=dupResult?.ignored||[];
  const scanDuplicates=async()=>{
    setDupScanning(true);
    try{
      const r=await apiFetch('/accounts/detect-duplicates');
      setDupResult(r);
      if(r.count===0)toast('No duplicate accounts found ✓');
    }catch(e){toast('Duplicate scan failed: '+(e.message||e),'error');}
    finally{setDupScanning(false);}
  };
  const mergeDuplicates=async()=>{
    if(!dupGroups||dupGroups.length===0)return;
    const names=dupGroups.map(g=>g.accounts.map(a=>a.name).join(' → ')).join('\n');
    if(!window.confirm(`Merge ${dupGroups.length} duplicate group${dupGroups.length!==1?'s':''}?\n\nFor each group, the oldest account (with your custom name and card links) will be kept and all history merged into it.\n\n${names}`))return;
    setDupMerging(true);
    try{
      const r=await apiFetch('/accounts/merge-duplicates',{method:'POST'});
      toast(`Merged ${r.count} duplicate group${r.count!==1?'s':''} — your custom names and card links are preserved`);
      setDupResult(null);
      onBanksChanged&&onBanksChanged();
    }catch(e){toast('Merge failed: '+(e.message||e),'error');}
    finally{setDupMerging(false);}
  };
  const ignoreDuplicatePair=async(idA,idB)=>{
    try{
      await apiFetch('/accounts/ignore-duplicate-pair',{method:'POST',body:JSON.stringify({account_id_a:idA,account_id_b:idB})});
      // Remove from groups, add to ignored in local state
      setDupResult(prev=>{
        if(!prev)return prev;
        const removedGroup=prev.duplicates.find(g=>g.keep_id===Math.min(idA,idB)||g.discard_ids.includes(Math.max(idA,idB)));
        const newGroups=prev.duplicates.filter(g=>!(g.keep_id===idA&&g.discard_ids.includes(idB))&&!(g.keep_id===idB&&g.discard_ids.includes(idA)));
        const newIgnored=[...prev.ignored];
        if(removedGroup)newIgnored.push(removedGroup);
        return{...prev,duplicates:newGroups,count:newGroups.length,ignored:newIgnored};
      });
      toast('Pair ignored — it won\'t appear in future scans');
    }catch(e){toast('Failed to ignore: '+(e.message||e),'error');}
  };
  const unignorePair=async(idA,idB)=>{
    try{
      await apiFetch('/accounts/ignore-duplicate-pair',{method:'DELETE',body:JSON.stringify({account_id_a:idA,account_id_b:idB})});
      await scanDuplicates(); // re-scan to move it back
    }catch(e){toast('Failed to unignore: '+(e.message||e),'error');}
  };
  const refreshItems=useCallback(()=>{apiFetch('/plaid/items').then(r=>{setItems(r);onBanksChanged&&onBanksChanged();}).catch(()=>{});},[onBanksChanged]);
  useEffect(()=>{refreshItems();},[]);

  const run=async(path,msg)=>{setBusy(true);try{const r=await apiFetch(path,{method:'POST'});toast(msg);return r;}catch(e){toast('Failed: '+(e.message||'unknown error'),'error');}finally{setBusy(false);}};

  /* Load rules */
  const loadRules=useCallback(async()=>{
    setRulesLoading(true);
    try{setRules(await apiFetch(`/rules?limit=200${ruleSearch?`&search=${encodeURIComponent(ruleSearch)}`:''}`));}
    catch(e){toast('Failed to load rules','error');}
    finally{setRulesLoading(false);}
  },[ruleSearch]);
  useEffect(()=>{if(tab==='rules')loadRules();},[tab,loadRules]);

  const startRuleEdit=(r)=>{setRuleEditing(r.id);setRuleEditVals({priority:r.priority,match_type:r.match_type,pattern:r.pattern,set_action:r.set_action||'',set_category:r.set_category||'',set_description:r.set_description||'',clean_description:r.clean_description||'',notes:r.notes||''});};
  const _reapplyMsg=r=>r?.reapplied?.updated>0?` — ${r.reapplied.updated} transaction${r.reapplied.updated!==1?'s':''} refreshed`:'';
  const saveRuleEdit=async(id)=>{
    try{const r=await apiFetch(`/rules/${id}`,{method:'PATCH',body:JSON.stringify(ruleEditVals)});toast(`Rule updated${_reapplyMsg(r)}`);setRuleEditing(null);await loadRules();}
    catch(e){toast('Failed to save','error');}
  };
  const deleteRule=async(id)=>{
    if(!confirm('Deactivate this rule?'))return;
    try{await apiFetch(`/rules/${id}`,{method:'DELETE'});toast('Rule deactivated');await loadRules();}
    catch(e){toast('Failed','error');}
  };
  const addRule=async()=>{
    try{const r=await apiFetch('/rules',{method:'POST',body:JSON.stringify(ruleEditVals)});toast(`Rule created${_reapplyMsg(r)}`);setShowAddRule(false);setRuleEditVals({});await loadRules();}
    catch(e){toast('Failed to create','error');}
  };
  const applyRules=async()=>{
    setReapplying(true);
    try{const r=await apiFetch('/rules/reapply',{method:'POST'});toast(r.updated>0?`${r.updated} transaction${r.updated!==1?'s':''} refreshed (${r.total} checked)`:'No changes needed — all transactions already up to date');}
    catch(e){toast('Failed: '+(e.message||e),'error');}
    finally{setReapplying(false);}
  };
  const[cleaningDescs,setCleaningDescs]=useState(false);
  const cleanDescriptions=async()=>{
    setCleaningDescs(true);
    try{
      const r=await apiFetch('/rules/clean-descriptions',{method:'POST'});
      toast(r.updated>0?`Updated ${r.updated} display name${r.updated!==1?'s':''} across ${r.total} transactions`:'All display names already match their rules — nothing to update');
    }catch(e){toast('Failed: '+(e.message||e),'error');}
    finally{setCleaningDescs(false);}
  };

  /* Cards file upload */
  const uploadCards=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    setBusy(true);
    try{
      const form=new FormData();form.append('file',file);
      const r=await fetch('/api/cards/upload-and-import',{method:'POST',body:form}).then(r=>r.json());
      toast(r.message||`Imported ${r.imported} cards`);
    }catch(err){toast('Upload failed','error');}
    finally{setBusy(false);e.target.value='';}
  };

  const tabs=[
    {id:'data',label:'Data Management'},
    {id:'rules',label:'Rules'},
    {id:'bank',label:'Bank Links'},
    {id:'about',label:'About'},
  ];

  return(
    <div>
      <div style={{display:'flex',gap:4,background:'var(--card-bg)',border:'1px solid var(--border)',borderRadius:10,padding:4,marginBottom:20,width:'fit-content'}}>
        {tabs.map(t=>(<button key={t.id} className={`btn btn-sm ${tab===t.id?'btn-primary':'btn-ghost'}`} onClick={()=>setTab(t.id)} style={{borderRadius:7}}>{t.label}</button>))}
      </div>

      {tab==='data'&&<div>
        <div className="card" style={{marginBottom:20}}>
          <div className="section-header"><div className="section-title">Categorization</div></div>
          <div className="settings-row">
            <div><div className="settings-label">Re-categorize All Transactions</div><div className="settings-desc">Re-runs all rules on unlocked transactions</div></div>
            <button className="btn btn-sm btn-secondary" onClick={()=>run('/init/recategorize','Re-categorized!')} disabled={busy}>{busy?'…':'Run'}</button>
          </div>
          <div className="settings-row">
            <div><div className="settings-label">Re-import Rules from Excel</div><div className="settings-desc">Reloads categorization rules from your Excel file</div></div>
            <button className="btn btn-sm btn-secondary" onClick={()=>run('/init/import-rules','Rules imported!')} disabled={busy}>{busy?'…':'Import'}</button>
          </div>
        </div>
        <div className="card" style={{marginBottom:20}}>
          <div className="section-header"><div className="section-title">Data Fixes</div></div>
          <div className="settings-row">
            <div><div className="settings-label">Fix Transaction Signs</div><div className="settings-desc">Corrects sign convention (expenses negative, income positive)</div></div>
            <button className="btn btn-sm btn-secondary" onClick={()=>run('/init/fix-signs','Signs fixed!')} disabled={busy}>{busy?'…':'Fix'}</button>
          </div>
        </div>
        <div className="card" style={{marginBottom:20}}>
          <div className="section-header"><div className="section-title">Cards Import</div></div>
          <div className="settings-row">
            <div><div className="settings-label">Import Cards from local file</div><div className="settings-desc">Loads card data from cards.xlsx on server</div></div>
            <button className="btn btn-sm btn-secondary" onClick={()=>run('/init/import-cards','Cards imported!')} disabled={busy}>{busy?'…':'Import'}</button>
          </div>
          <div className="settings-row">
            <div><div className="settings-label">Upload cards.xlsx</div><div className="settings-desc">Upload a new cards.xlsx file and import</div></div>
            <label className="btn btn-sm btn-primary" style={{cursor:'pointer'}}>{busy?'…':'Upload'}<input type="file" accept=".xlsx,.xls" onChange={uploadCards} style={{display:'none'}}/></label>
          </div>
        </div>
      </div>}

      {tab==='rules'&&<div>
        <div className="card" style={{marginBottom:20}}>
          <div className="section-header" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div className="section-title">Categorization Rules ({rules.length})</div>
            <div style={{display:'flex',gap:8}}>
              <input className="search-input" placeholder="Search patterns…" value={ruleSearch} onChange={e=>setRuleSearch(e.target.value)} style={{width:200}}/>
              <button className="btn btn-sm btn-secondary" onClick={cleanDescriptions} disabled={cleaningDescs} title="Fill in missing display names for transactions that still show raw bank text">{cleaningDescs?'Cleaning…':'✦ Fix Descriptions'}</button>
              <button className="btn btn-sm btn-secondary" onClick={applyRules} disabled={reapplying} title="Re-apply all rules to existing non-locked transactions">{reapplying?'Applying…':'↺ Apply Rules'}</button>
              <button className="btn btn-sm btn-primary" onClick={()=>{setShowAddRule(true);setRuleEditVals({priority:100,match_type:'contains',pattern:'',set_action:'',set_category:'',set_description:'',clean_description:'',notes:''});}}>+ Add Rule</button>
            </div>
          </div>
          {/* Add Rule modal */}
          {showAddRule&&<div style={{padding:'16px 20px',background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:8,margin:'0 16px 16px'}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>New Rule</div>
            <div style={{display:'grid',gridTemplateColumns:'80px 100px 1fr 100px 100px',gap:8,fontSize:12,marginBottom:8}}>
              <input type="number" value={ruleEditVals.priority||100} onChange={e=>setRuleEditVals(v=>({...v,priority:parseInt(e.target.value)}))} placeholder="Priority" style={{border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/>
              <select value={ruleEditVals.match_type||'contains'} onChange={e=>setRuleEditVals(v=>({...v,match_type:e.target.value}))} style={{border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}>
                {[['contains','Contains'],['contains_any','Contains Any'],['contains_all','Contains All'],['equals','Equals'],['starts_with','Starts With'],['regex','Regex']].map(([v,l])=><option key={v} value={v}>{l}</option>)}
              </select>
              <input value={ruleEditVals.pattern||''} onChange={e=>setRuleEditVals(v=>({...v,pattern:e.target.value}))} placeholder="Pattern" style={{border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/>
              <select value={ruleEditVals.set_action||''} onChange={e=>setRuleEditVals(v=>({...v,set_action:e.target.value}))} style={{border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}>
                <option value="">— Action —</option>
                {TXN_TYPES.map(a=><option key={a} value={a}>{a}</option>)}
              </select>
              <select value={ruleEditVals.set_category||''} onChange={e=>setRuleEditVals(v=>({...v,set_category:e.target.value}))} style={{border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}>
                <option value="">— Category —</option>
                {sortedCats(categories||[]).map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
              </select>
            </div>
            <div style={{display:'flex',gap:8}}>
              <input value={ruleEditVals.set_description||''} onChange={e=>setRuleEditVals(v=>({...v,set_description:e.target.value}))} placeholder="Set Description" style={{flex:1,border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/>
              <input value={ruleEditVals.notes||''} onChange={e=>setRuleEditVals(v=>({...v,notes:e.target.value}))} placeholder="Notes" style={{flex:1,border:'1px solid var(--border)',borderRadius:4,padding:'4px 6px',fontSize:12}}/>
              <button className="btn btn-sm btn-success" onClick={addRule}>Create</button>
              <button className="btn btn-sm btn-ghost" onClick={()=>setShowAddRule(false)}>Cancel</button>
            </div>
          </div>}
          {rulesLoading?<div className="loading"><div className="spinner"/></div>
            :<div className="table-wrap" style={{maxHeight:500,overflowY:'auto'}}><table style={{fontSize:12}}>
              <thead><tr><th>Pri</th><th>Match</th><th>Pattern</th><th>Action</th><th>Category</th><th>Description</th><th>Notes</th><th>Stats</th><th></th></tr></thead>
              <tbody>{rules.map(r=>(
                ruleEditing===r.id?<tr key={r.id} style={{background:'#fffbeb'}}>
                  <td><input type="number" value={ruleEditVals.priority} onChange={e=>setRuleEditVals(v=>({...v,priority:parseInt(e.target.value)}))} style={{width:50,fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'2px 4px'}}/></td>
                  <td><select value={ruleEditVals.match_type} onChange={e=>setRuleEditVals(v=>({...v,match_type:e.target.value}))} style={{fontSize:11}}>
                    {[['contains','Contains'],['contains_any','Contains Any'],['contains_all','Contains All'],['equals','Equals'],['starts_with','Starts With'],['regex','Regex']].map(([v,l])=><option key={v} value={v}>{l}</option>)}
                  </select></td>
                  <td><input value={ruleEditVals.pattern} onChange={e=>setRuleEditVals(v=>({...v,pattern:e.target.value}))} style={{width:'100%',fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'2px 4px'}}/></td>
                  <td><select value={ruleEditVals.set_action} onChange={e=>setRuleEditVals(v=>({...v,set_action:e.target.value}))} style={{width:80,fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'2px 4px'}}>
                    <option value="">—</option>
                    {TXN_TYPES.map(a=><option key={a} value={a}>{a}</option>)}
                  </select></td>
                  <td><select value={ruleEditVals.set_category} onChange={e=>setRuleEditVals(v=>({...v,set_category:e.target.value}))} style={{width:110,fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'2px 4px'}}>
                    <option value="">—</option>
                    {sortedCats(categories||[]).map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
                  </select></td>
                  <td><input value={ruleEditVals.set_description} onChange={e=>setRuleEditVals(v=>({...v,set_description:e.target.value}))} style={{width:100,fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'2px 4px'}}/></td>
                  <td><input value={ruleEditVals.notes} onChange={e=>setRuleEditVals(v=>({...v,notes:e.target.value}))} style={{width:80,fontSize:11,border:'1px solid var(--border)',borderRadius:4,padding:'2px 4px'}}/></td>
                  <td></td>
                  <td><div style={{display:'flex',gap:4}}><button className="btn btn-sm btn-success" onClick={()=>saveRuleEdit(r.id)} style={{fontSize:10,padding:'2px 6px'}}>Save</button><button className="btn btn-sm btn-ghost" onClick={()=>setRuleEditing(null)} style={{fontSize:10,padding:'2px 6px'}}>×</button></div></td>
                </tr>:<tr key={r.id}>
                  <td style={{fontFamily:'DM Mono',color:'var(--text-muted)'}}>{r.priority}</td>
                  <td style={{color:'var(--text-muted)'}}>{r.match_type}</td>
                  <td style={{fontWeight:500,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={r.pattern}>{r.pattern}</td>
                  <td>{r.set_action&&<span className="badge badge-income" style={{fontSize:10}}>{r.set_action}</span>}</td>
                  <td>{r.set_category&&<span className="badge badge-category" style={{fontSize:10}}>{r.set_category}</span>}</td>
                  <td style={{color:'var(--text-muted)',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={r.set_description}>{r.set_description||'—'}</td>
                  <td style={{fontSize:10,color:'var(--text-muted)',maxWidth:80,overflow:'hidden',textOverflow:'ellipsis'}} title={r.notes}>{r.notes||''}</td>
                  <td style={{fontSize:10,color:'var(--text-muted)',whiteSpace:'nowrap'}}>{r.times_matched>0?`${r.times_matched}m ${r.times_accepted}a`:''}</td>
                  <td><div style={{display:'flex',gap:4}}>
                    <button className="btn btn-sm btn-ghost" onClick={()=>startRuleEdit(r)} style={{fontSize:10,padding:'2px 6px'}}>Edit</button>
                    <button className="btn btn-sm btn-ghost" onClick={()=>deleteRule(r.id)} style={{fontSize:10,padding:'2px 6px',color:'var(--red)'}}>×</button>
                  </div></td>
                </tr>
              ))}</tbody>
            </table></div>
          }
        </div>
      </div>}

      {tab==='bank'&&<div>
        <div className="card" style={{marginBottom:20}}>
          <div className="section-header">
            <div>
              <div className="section-title">Balance Sync</div>
              <div className="section-desc" style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>Rebuilds monthly balance snapshots from your transactions. Use <b>Force Resync</b> only when Plaid's balance is current (not right after a long weekend) — it re-anchors all accounts to today's Plaid balance.</div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <button className="btn btn-sm btn-secondary" onClick={()=>syncBalances(false)} disabled={balanceSyncing}>{balanceSyncing?'Syncing…':'↺ Sync Balances'}</button>
              <button className="btn btn-sm btn-secondary" onClick={()=>{if(window.confirm("Force resync will re-anchor all accounts to today's Plaid balance. Only do this when Plaid's balance is fully up to date. Continue?"))syncBalances(true);}} disabled={balanceSyncing} style={{borderColor:'#f59e0b',color:'#b45309'}}>⚡ Force Resync</button>
            </div>
          </div>
          {balanceSyncResult&&<div style={{marginTop:12}}>
            <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:8}}>
              Last sync: {balanceSyncResult.synced} account{balanceSyncResult.synced!==1?'s':''} processed
              {balanceSyncResult.force&&<span style={{marginLeft:8,fontWeight:600,color:'#b45309'}}>(force resync — anchors updated from Plaid)</span>}
              {balanceSyncResult.skipped>0&&<span style={{marginLeft:8,color:'#b45309'}}>({balanceSyncResult.skipped} skipped)</span>}
            </div>
            {balanceSyncResult.accounts&&balanceSyncResult.accounts.length>0&&(()=>{
              const fmtB=v=>{const neg=v<0;return (neg?'−':'')+new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Math.abs(v));};
              const anyDelta=balanceSyncResult.accounts.some(a=>a.delta!=null&&Math.abs(a.delta)>0.01);
              return <div style={{overflowX:'auto'}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                  <thead><tr style={{borderBottom:'1px solid var(--border)',color:'var(--text-muted)'}}>
                    <th style={{textAlign:'left',padding:'4px 8px 4px 0',fontWeight:500}}>Account</th>
                    <th style={{textAlign:'right',padding:'4px 8px',fontWeight:500}}>Plaid Balance</th>
                    <th style={{textAlign:'right',padding:'4px 8px',fontWeight:500}}>System Balance</th>
                    <th style={{textAlign:'right',padding:'4px 0 4px 8px',fontWeight:500}}>Difference</th>
                  </tr></thead>
                  <tbody>{balanceSyncResult.accounts.map((a,i)=>{
                    const diff=a.delta;
                    const absDiff=diff!=null?Math.abs(diff):null;
                    const diffColor=diff==null?'var(--text-muted)':absDiff<0.01?'var(--text-muted)':absDiff<10?'#b45309':'var(--red)';
                    const plaidUnavail=a.source==='plaid_unavailable';
                    return <tr key={i} style={{borderBottom:'1px solid var(--border-light)'}}>
                      <td style={{padding:'5px 8px 5px 0'}}>
                        <span style={{fontWeight:500}}>{a.name}</span>
                        {a.is_manual&&<span style={{marginLeft:6,fontSize:10,background:'var(--bg-subtle)',color:'var(--text-muted)',borderRadius:3,padding:'1px 4px'}}>manual</span>}
                        {plaidUnavail&&<span style={{marginLeft:6,fontSize:10,background:'#fee2e2',color:'#991b1b',borderRadius:3,padding:'1px 4px'}} title="Plaid returned no balance for this account">no Plaid data</span>}
                        {a.anchor_updated&&<span style={{marginLeft:6,fontSize:10,background:'#fef3c7',color:'#b45309',borderRadius:3,padding:'1px 4px'}}>anchor reset</span>}
                      </td>
                      <td style={{textAlign:'right',padding:'5px 8px',fontFamily:'monospace',color:(a.is_manual||plaidUnavail)?'var(--text-muted)':'inherit'}}>
                        {a.plaid_balance!=null?fmtB(a.plaid_balance):'—'}
                      </td>
                      <td style={{textAlign:'right',padding:'5px 8px',fontFamily:'monospace'}}>{fmtB(a.computed_balance)}</td>
                      <td style={{textAlign:'right',padding:'5px 0 5px 8px',fontFamily:'monospace',color:diffColor,fontWeight:absDiff!=null&&absDiff>0.01?600:400}}>
                        {diff==null?'—':absDiff<0.01?'—':(diff>0?'+':'')+fmtB(diff)}
                      </td>
                    </tr>;
                  })}</tbody>
                </table>
                {anyDelta&&<div style={{marginTop:8,fontSize:11,color:'var(--text-muted)'}}>
                  A non-zero difference typically means Plaid's balance lags your transactions (e.g. after a weekend). If it persists once transactions have posted, use ⚡ Force Resync.
                </div>}
              </div>;
            })()}
          </div>}
        </div>
        <div className="card" style={{marginBottom:20}}>
          <div className="section-header">
            <div>
              <div className="section-title">Duplicate Accounts</div>
              <div className="section-desc" style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>After re-linking a bank, Plaid sometimes creates duplicate accounts. Scan to detect them and merge with one click — your custom names, card links, and full history are preserved.</div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <button className="btn btn-sm btn-secondary" onClick={scanDuplicates} disabled={dupScanning||dupMerging}>{dupScanning?'Scanning…':'🔍 Scan for Duplicates'}</button>
              {dupGroups&&dupGroups.length>0&&<button className="btn btn-sm btn-primary" onClick={mergeDuplicates} disabled={dupMerging}>{dupMerging?'Merging…':'✓ Merge All'}</button>}
            </div>
          </div>
          {dupResult&&(()=>{
            const hasDups=dupGroups&&dupGroups.length>0;
            const hasIgnored=dupIgnored&&dupIgnored.length>0;
            if(!hasDups&&!hasIgnored)return<div style={{fontSize:12,color:'var(--text-muted)',marginTop:8}}>✓ No duplicate accounts found.</div>;
            const DupTable=({rows,showIgnore,showUnignore})=>(
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                <thead><tr style={{borderBottom:'1px solid var(--border)',color:'var(--text-muted)'}}>
                  <th style={{textAlign:'left',padding:'4px 8px 4px 0',fontWeight:500}}>Keep (oldest)</th>
                  <th style={{textAlign:'left',padding:'4px 8px',fontWeight:500}}>{showIgnore?'Flagged as duplicate':'Ignored (not a duplicate)'}</th>
                  <th style={{textAlign:'right',padding:'4px 0 4px 8px',fontWeight:500}}>{showIgnore?'':'Action'}</th>
                </tr></thead>
                <tbody>{rows.map((g,gi)=>g.discard_ids.map((did,di)=>{
                  const keep=g.accounts.find(a=>a.id===g.keep_id);
                  const discard=g.accounts.find(a=>a.id===did);
                  return <tr key={`${gi}-${di}`} style={{borderBottom:'1px solid var(--border-light)'}}>
                    <td style={{padding:'5px 8px 5px 0'}}>
                      <span style={{fontWeight:500}}>{keep.name}</span>
                      <span style={{marginLeft:6,fontSize:10,background:'var(--bg-subtle)',color:'var(--text-muted)',borderRadius:3,padding:'1px 4px'}}>…{keep.mask}</span>
                      {keep.card_count>0&&<span style={{marginLeft:4,fontSize:10,background:'#dbeafe',color:'#1d4ed8',borderRadius:3,padding:'1px 4px'}}>{keep.card_count} card{keep.card_count!==1?'s':''}</span>}
                    </td>
                    <td style={{padding:'5px 8px',color:'var(--text-muted)'}}>
                      <span>{discard.name}</span>
                      {showIgnore&&<span style={{marginLeft:6,fontSize:10,background:'#fee2e2',color:'#991b1b',borderRadius:3,padding:'1px 4px'}}>duplicate</span>}
                      {showUnignore&&<span style={{marginLeft:6,fontSize:10,background:'var(--bg-subtle)',color:'var(--text-muted)',borderRadius:3,padding:'1px 4px'}}>ignored</span>}
                    </td>
                    <td style={{textAlign:'right',padding:'5px 0 5px 8px',whiteSpace:'nowrap'}}>
                      {showIgnore&&<button className="btn btn-xs btn-secondary" style={{fontSize:10,padding:'1px 6px'}} onClick={()=>ignoreDuplicatePair(keep.id,did)} title="Mark as not a duplicate — won't appear in future scans">Ignore</button>}
                      {showUnignore&&<button className="btn btn-xs btn-secondary" style={{fontSize:10,padding:'1px 6px'}} onClick={()=>unignorePair(keep.id,did)}>Unignore</button>}
                    </td>
                  </tr>;
                }))}</tbody>
              </table>
            );
            return <div style={{marginTop:12}}>
              {hasDups&&<>
                <div style={{fontSize:12,color:'#b45309',marginBottom:8,fontWeight:500}}>{dupGroups.length} duplicate group{dupGroups.length!==1?'s':''} found — click "Merge All" to fix, or "Ignore" for false positives</div>
                <DupTable rows={dupGroups} showIgnore={true} showUnignore={false}/>
                <div style={{marginTop:8,fontSize:11,color:'var(--text-muted)'}}>
                  "Merge All" keeps the oldest account's name and card links, adopts the new Plaid connection so future syncs work, and moves any new transactions across. Use "Ignore" if two accounts share the same last 4 digits but are genuinely different cards.
                </div>
              </>}
              {hasIgnored&&<>
                <div style={{fontSize:12,color:'var(--text-muted)',marginTop:hasDups?20:0,marginBottom:8}}>Ignored pairs (confirmed not duplicates)</div>
                <DupTable rows={dupIgnored} showIgnore={false} showUnignore={true}/>
              </>}
            </div>;
          })()}
        </div>
        <div className="card" style={{marginBottom:20}}>
          <div className="section-header">
            <div className="section-title">Connected Banks ({items.length})</div>
            <div style={{display:'flex',gap:8}}>
              {items.length>0&&<ResetResyncButton toast={toast} onDone={refreshItems}/>}
              <button className="btn btn-sm btn-primary" onClick={onConnectBank}>+ Connect Bank</button>
            </div>
          </div>
          {items.length===0?<div className="empty" style={{padding:40}}><div className="empty-icon">◫</div><span>No banks connected</span><span style={{fontSize:12,color:'var(--text-muted)'}}>Click "+ Connect Bank" to link via Plaid</span></div>
            :items.map((item,i)=><BankRow key={item.item_id||i} item={item} toast={toast} onRenamed={(id,name)=>{setItems(prev=>prev.map(it=>it.item_id===id?{...it,institution_name:name}:it));onBanksChanged&&onBanksChanged();}} onSynced={refreshItems}/>)
          }
        </div>
      </div>}

      {tab==='about'&&<div>
        <div className="card">
          <div className="section-header"><div className="section-title">About</div></div>
          <div style={{padding:'20px',fontSize:13,color:'var(--text-secondary)',lineHeight:1.8}}>
            <p style={{fontWeight:500,color:'var(--text-primary)'}}>Finance Automation v2.0</p>
            <p>Plaid sync + rule-based categorization + manual accounts</p>
            <p style={{marginTop:8}}>Stack: FastAPI + SQLAlchemy + SQLite + React</p>
            <p>Features: Transactions, Budgets, Balance Timeline, Net Worth, Cards, GCB Tracking</p>
          </div>
        </div>
      </div>}
    </div>
  );
}

function usePlaidLink(toast,onSuccess){
  /* Handle OAuth return — bank redirects back to /plaid/oauth-return */
  React.useEffect(()=>{
    if(!window.location.pathname.startsWith('/plaid/oauth-return'))return;
    (async()=>{
      try{
        const{link_token}=await apiFetch('/plaid/link-token');
        const handler=window.Plaid.create({
          token:link_token,
          receivedRedirectUri:window.location.href,
          onSuccess:async(public_token)=>{
            try{const r=await apiFetch('/plaid/exchange-token',{method:'POST',body:JSON.stringify({public_token})});toast(`Linked ${r.accounts_linked} account${r.accounts_linked!==1?'s':''}, synced ${r.transactions_synced} transactions`);onSuccess();window.history.replaceState({},'','/');}
            catch(e){toast('Failed to link: '+(e.message||e),'error');}
          },
          onExit:()=>{window.history.replaceState({},'','/');},
        });
        handler.open();
      }catch(e){toast('OAuth return failed: '+(e.message||e),'error');}
    })();
  },[]);

  return async()=>{
    try{
      const{link_token}=await apiFetch('/plaid/link-token');
      const handler=window.Plaid.create({
        token:link_token,
        onSuccess:async(public_token)=>{
          try{const r=await apiFetch('/plaid/exchange-token',{method:'POST',body:JSON.stringify({public_token})});toast(`Linked ${r.accounts_linked} account${r.accounts_linked!==1?'s':''}, synced ${r.transactions_synced} transactions`);onSuccess();}
          catch(e){toast('Failed to link: '+(e.message||e),'error');}
        },
        onExit:()=>{},
      });
      handler.open();
    }catch(e){toast('Failed to start connection: '+(e.message||e),'error');}
  };
}


function CardsPage({toast}){
  const[cards,setCards]=useState([]);
  const[accounts,setAccounts]=useState([]);
  const[plaidAccounts,setPlaidAccounts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[editing,setEditing]=useState(null);
  const[editVals,setEditVals]=useState({});
  const[showInactive,setShowInactive]=useState(false);
  const[detail,setDetail]=useState(null);
  const[detailLoading,setDetailLoading]=useState(false);
  const[matchSuggestions,setMatchSuggestions]=useState(null); // null=hidden, []=shown
  const[matching,setMatching]=useState(false);
  const[linking,setLinking]=useState({}); // {card_db_id: true} while confirming

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const[c,a,accts]=await Promise.all([apiFetch('/cards'),apiFetch('/plaid/items'),apiFetch('/accounts')]);
      setCards(c);setPlaidAccounts(a);setAccounts(accts);
    }catch(e){toast('Failed to load cards','error');}
    finally{setLoading(false);}
  },[]);

  const runMatch=async()=>{
    setMatching(true);setMatchSuggestions(null);
    try{
      const r=await apiFetch('/cards/match-accounts',{method:'POST'});
      setMatchSuggestions(r.suggestions||[]);
      if((r.suggestions||[]).length===0)toast('No confident matches found — link cards manually','error');
      else toast(`Found ${r.suggestions.length} suggested match${r.suggestions.length!==1?'es':''}`);
    }catch(e){toast('Matching failed','error');}
    finally{setMatching(false);}
  };

  const confirmLink=async(cardDbId,accountDbId)=>{
    setLinking(l=>({...l,[cardDbId]:true}));
    try{
      const r=await apiFetch(`/cards/${cardDbId}/link-account`,{method:'POST',body:JSON.stringify({account_id:accountDbId})});
      toast(`Linked — ${r.transactions_updated} transactions updated`);
      setMatchSuggestions(s=>s.filter(x=>x.card_db_id!==cardDbId));
      await load();
    }catch(e){toast('Link failed','error');}
    finally{setLinking(l=>({...l,[cardDbId]:false}));}
  };

  const dismissSuggestion=(cardDbId)=>setMatchSuggestions(s=>s.filter(x=>x.card_db_id!==cardDbId));

  useEffect(()=>{load();},[load]);

  const loadDetail=async(cardId)=>{
    setDetailLoading(true);
    try{setDetail(await apiFetch(`/cards/${cardId}/detail`));}catch(e){toast('Failed to load detail','error');}
    finally{setDetailLoading(false);}
  };

  const[plaidWarnings,setPlaidWarnings]=useState({});

  const startEdit=(card)=>{setEditing(card.id);setEditVals({card_name:card.card_name||'',last_four:card.last_four||'',statement_close_day:card.statement_close_day||'',payment_due_day:card.payment_due_day||'',credit_limit:card.credit_limit||'',account_id:card.account_id||null,payment_account_id:card.payment_account_id||null,is_active:card.is_active,notes:card.notes||'',annual_fee:card.annual_fee||''});};
  const cancelEdit=()=>{setEditing(null);setEditVals({});};
  const saveEdit=async(cardId)=>{
    try{
      await apiFetch(`/cards/${cardId}`,{method:'PATCH',body:JSON.stringify({...editVals,last_four:editVals.last_four?parseInt(editVals.last_four):null,statement_close_day:editVals.statement_close_day?parseInt(editVals.statement_close_day):null,payment_due_day:editVals.payment_due_day?parseInt(editVals.payment_due_day):null,credit_limit:editVals.credit_limit?parseFloat(editVals.credit_limit):null,annual_fee:editVals.annual_fee?parseFloat(editVals.annual_fee):null,payment_account_id:editVals.payment_account_id?parseInt(editVals.payment_account_id):null})});
      await load();setEditing(null);toast('Card updated');
    }catch(e){toast('Failed to save','error');}
  };

  /* Validate Plaid links on load */
  useEffect(()=>{
    apiFetch('/cards/validate-plaid').then(res=>{
      const w={};res.forEach(r=>{if(r.warning)w[r.card_id]=r.warning;});
      setPlaidWarnings(w);
    }).catch(()=>{});
  },[cards]);

  const visible=cards.filter(c=>showInactive||c.is_active);
  const networkColor={VISA:'#1a1f71',AMEX:'#016FD0',MC:'#EB001B',DISCOVER:'#FF6600'};

  /* Summary KPIs */
  const totalLimit=visible.reduce((s,c)=>s+(c.credit_limit||0),0);
  const activeCount=cards.filter(c=>c.is_active).length;
  const totalFees=visible.reduce((s,c)=>s+(c.annual_fee||0),0);

  return(
    <div>
      {/* Detail panel overlay */}
      {detail&&<div className="review-overlay" onClick={e=>e.target===e.currentTarget&&setDetail(null)}>
        <div className="review-panel" style={{width:560,maxHeight:'80vh',overflowY:'auto'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <div>
              <div style={{fontSize:16,fontWeight:600}}>{detail.card.card_name||detail.card.card_id}</div>
              <div style={{fontSize:12,color:'var(--text-muted)'}}>{detail.card.issuer} · {detail.card.network}</div>
            </div>
            <button className="btn btn-sm btn-ghost" onClick={()=>setDetail(null)}>✕</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:16}}>
            <div style={{background:'#f9fafb',borderRadius:8,padding:'10px 14px'}}>
              <div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase'}}>Credit Limit</div>
              <div style={{fontSize:16,fontWeight:600,fontFamily:'DM Mono'}}>{detail.card.credit_limit?`$${detail.card.credit_limit.toLocaleString()}`:'—'}</div>
            </div>
            <div style={{background:'#f9fafb',borderRadius:8,padding:'10px 14px'}}>
              <div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase'}}>Stmt Balance</div>
              <div style={{fontSize:16,fontWeight:600,fontFamily:'DM Mono',color:detail.statement_balance!=null?'var(--red)':'var(--text-muted)'}}>{detail.statement_balance!=null?fmt(Math.abs(detail.statement_balance)):'—'}</div>
            </div>
            <div style={{background:'#f9fafb',borderRadius:8,padding:'10px 14px'}}>
              <div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase'}}>Utilization</div>
              <div style={{fontSize:16,fontWeight:600,fontFamily:'DM Mono',color:detail.utilization>80?'var(--red)':detail.utilization>50?'var(--amber)':'var(--green)'}}>{detail.utilization!=null?`${detail.utilization}%`:'—'}</div>
            </div>
          </div>
          {detail.linked_account&&<div style={{fontSize:12,color:'var(--text-muted)',marginBottom:8}}>Linked: {detail.linked_account.name} · Balance: {fmt(detail.linked_account.balance||0)}</div>}
          <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Recent Transactions</div>
          {detail.recent_transactions.length===0?<div style={{fontSize:12,color:'var(--text-muted)',padding:'12px 0'}}>No transactions found</div>
            :<div style={{maxHeight:300,overflowY:'auto'}}>{detail.recent_transactions.map(t=>(
              <div key={t.id} style={{padding:'8px 0',borderBottom:'1px solid #f3f4f6',display:'flex',alignItems:'center',gap:8}}>

                <span style={{flex:1,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.description}</span>
                <span style={{fontFamily:'DM Mono',fontSize:12,color:t.amount<0?'var(--red)':'var(--green)',whiteSpace:'nowrap'}}>{t.amount<0?'-':'+'}{fmt(t.amount)}</span>
              </div>
            ))}</div>
          }
        </div>
      </div>}

      {/* KPI cards */}
      <div className="metric-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:20}}>
        <div className="card metric-card"><div className="metric-label">Active Cards</div><div className="metric-value">{activeCount}</div></div>
        <div className="card metric-card"><div className="metric-label">Total Credit Limit</div><div className="metric-value">{fmt(totalLimit)}</div></div>
        <div className="card metric-card"><div className="metric-label">Annual Fees</div><div className="metric-value" style={{color:totalFees>0?'var(--red)':'var(--text-muted)'}}>{totalFees>0?fmt(totalFees):'$0'}</div></div>
      </div>

      {/* Account match suggestions panel */}
      {matchSuggestions&&matchSuggestions.length>0&&(
        <div className="card" style={{marginBottom:16,border:'2px solid #dbeafe'}}>
          <div className="section-header" style={{paddingBottom:8}}>

            <button className="btn btn-sm btn-ghost" onClick={()=>setMatchSuggestions(null)}>Dismiss all</button>
          </div>
          <div style={{padding:'0 20px 16px',display:'flex',flexDirection:'column',gap:10}}>
            {matchSuggestions.map(s=>(
              <div key={s.card_db_id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'#f8faff',borderRadius:8,border:'1px solid #dbeafe'}}>

                <button className="btn btn-sm btn-success" disabled={linking[s.card_db_id]} onClick={()=>confirmLink(s.card_db_id,s.account_db_id)}>{linking[s.card_db_id]?'…':'✓ Link'}</button>

        <div className="section-header">

                  <td onClick={e=>e.stopPropagation()}><input type="number" min="1" max="31" value={editVals.statement_close_day} onChange={e=>setEditVals(v=>({...v,statement_close_day:e.target.value}))} style={{width:50,border:'1px solid var(--border)',borderRadius:6,padding:'4px 6px',fontSize:12}}/></td>
