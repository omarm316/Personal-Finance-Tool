                <label style={{fontSize:11,fontWeight:500,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.05em'}}>Date</label>
                <input type="date" value={ovForm.flow_date} onChange={e=>setOvForm(f=>({...f,flow_date:e.target.value}))} style={INP}/>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                <label style={{fontSize:11,fontWeight:500,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.05em'}}>Source</label>
                <select value={ovForm.source} onChange={e=>setOvForm(f=>({...f,source:e.target.value}))} style={INP}>
                  <option value="manual">Manual</option>
                  <option value="cc_payment">CC Payment</option>
                  <option value="loan_payment">Loan Payment</option>
                </select>
              </div>
              <div style={{gridColumn:'1/-1',display:'flex',flexDirection:'column',gap:4}}>
                <label style={{fontSize:11,fontWeight:500,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.05em'}}>Account <span style={{fontWeight:400,opacity:0.7,textTransform:'none'}}>(optional)</span></label>
                <select value={ovForm.account_id} onChange={e=>setOvForm(f=>({...f,account_id:e.target.value}))} style={INP}>
                  <option value="">— None —</option>
                  {overlayAccounts.filter(a=>a.is_active).map(a=><option key={a.id} value={a.id}>{a.account_name}</option>)}
                </select>
              </div>
            </div>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end',borderTop:'1px solid var(--border)',paddingTop:16}}>
              <button className="btn btn-sm btn-ghost" onClick={()=>setShowOverlayForm(false)}>Cancel</button>
              <button className="btn btn-sm btn-primary" onClick={saveOverlay} disabled={ovSaving}>{ovSaving?'Saving…':'Save'}</button>
            </div>
          </div>
        </div>
      )}

      {/* ── Salary & Income card ───────────────────────────────────────────── */}
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,overflow:'hidden',marginBottom:20}}>
        <div style={{padding:'18px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid var(--border)'}}>
          <div style={{fontSize:11,fontWeight:500,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'1.5px'}}>Salary & Income</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {salSel.size>0&&<button className="btn btn-sm btn-ghost" style={{color:'var(--red)'}} onClick={deleteSelectedSalary}>Delete Selected ({salSel.size})</button>}
            <button className="btn btn-sm btn-primary" onClick={openAddSalary}>+ Add Payment</button>
          </div>
        </div>
        {salaryPayments.length===0
          ?<div style={{textAlign:'center',padding:'28px 0',color:'var(--text-muted)',fontSize:13}}>No salary entries yet — click <strong>+ Add Payment</strong> to add a pay date.</div>
          :<div className="table-wrap"><table style={{fontSize:13}}>
            <thead><tr>
              <th style={{width:32,textAlign:'center'}}><input type="checkbox" checked={salSel.size>0&&salSel.size===salaryPayments.length} onChange={toggleAllSal} style={{cursor:'pointer'}}/></th>
              <th style={{minWidth:100}}>Date</th>
              <th>Description</th>
              <th>Person</th>
              {salaryAccounts.map(a=>(
                <th key={a.id} style={{textAlign:'right',minWidth:110,maxWidth:130,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={`${a.account_name} (${fmtAcctType(a.account_type)})`}>{a.account_name}</th>
              ))}
              <th style={{textAlign:'right',minWidth:100}}>Total</th>
              <th style={{textAlign:'center'}}>Actions</th>
            </tr></thead>
            <tbody>{salaryPayments.map(sp=>{
              const allocMap={};
              sp.allocations.forEach(a=>{allocMap[a.account_id]=a.amount;});
              const isPast=sp.payment_date<today;
              return(
                <tr key={sp.id} style={{opacity:isPast?0.5:1,background:isPast?'var(--elevated)':'transparent'}}>
                  <td style={{textAlign:'center'}}><input type="checkbox" checked={salSel.has(sp.id)} onChange={()=>toggleSalSel(sp.id)} style={{cursor:'pointer'}}/></td>
                  <td style={{fontFamily:'DM Sans',fontSize:12,fontWeight:300,whiteSpace:'nowrap',color:isPast?'var(--text-muted)':'var(--text-primary)'}}>{sp.payment_date}</td>
                  <td style={{fontWeight:300}}>{sp.description}</td>
                  <td><span style={{display:'inline-block',padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:400,background:'rgba(52,211,153,0.12)',color:'var(--green)'}}>{sp.person}</span></td>
                  {salaryAccounts.map(a=>{
                    const amt=allocMap[a.id];
                    return<td key={a.id} style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,color:amt?'var(--green)':'var(--text-muted)'}}>{amt?'+$'+amt.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}</td>;
                  })}
                  <td style={{textAlign:'right',fontFamily:'DM Sans',fontWeight:400,color:'var(--green)'}}>+${spTotal(sp).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                  <td style={{textAlign:'center'}}>
                    <div style={{display:'flex',gap:4,justifyContent:'center'}}>
                      <button className="btn btn-sm btn-ghost" style={{padding:'2px 8px',fontSize:11}} onClick={()=>openEditSalary(sp)}>Edit</button>
                      <button className="btn btn-sm btn-ghost" style={{padding:'2px 8px',fontSize:11,color:'var(--red)'}} onClick={()=>deleteSalary(sp.id)}>Delete</button>
                    </div>
                  </td>
                </tr>
              );
            })}</tbody>
          </table></div>
        }
      </div>

      {/* ── Expected Outflows & One-Time Income card ───────────────────────── */}
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,overflow:'hidden'}}>
        <div style={{padding:'18px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid var(--border)'}}>
          <div style={{fontSize:11,fontWeight:500,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'1.5px'}}>Expected Outflows & One-Time Income</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {ovSel.size>0&&<button className="btn btn-sm btn-ghost" style={{color:'var(--red)'}} onClick={deleteSelectedOverlays}>Delete Selected ({ovSel.size})</button>}
            <button className="btn btn-sm btn-secondary" onClick={generateOverlays} disabled={genBusy} title="Auto-create entries from credit card and loan payment schedules">
              {genBusy?'Generating…':'Generate from Cards & Loans'}
            </button>
            <button className="btn btn-sm btn-primary" onClick={openAddOverlay}>+ Add</button>
          </div>
        </div>
        {overlays.length===0
          ?<div style={{textAlign:'center',padding:'28px 0',color:'var(--text-muted)',fontSize:13}}>No entries yet — add one manually or click <strong>Generate from Cards &amp; Loans</strong>.</div>
          :<div className="table-wrap">
            <table style={{fontSize:13}}>
              <thead><tr>
                <th style={{width:32,textAlign:'center'}}><input type="checkbox" checked={ovSel.size>0&&ovSel.size===overlays.length} onChange={toggleAllOv} style={{cursor:'pointer'}}/></th>
                <th style={{minWidth:90}}>Date</th>
                <th>Description</th>
                <th style={{textAlign:'right',minWidth:100}}>Amount</th>
                <th>Account</th>
                <th>Source</th>
                <th style={{textAlign:'center'}}>Actions</th>
              </tr></thead>
              <tbody>{overlays.map(o=>{
                const badge=SOURCE_BADGE[o.source]||SOURCE_BADGE.manual;
                const isOut=o.amount<0;
                const isPast=o.flow_date<today;
                return(
                  <tr key={o.id} style={{opacity:isPast?0.5:1,background:isPast?'var(--elevated)':'transparent'}}>
                    <td style={{textAlign:'center'}}><input type="checkbox" checked={ovSel.has(o.id)} onChange={()=>toggleOvSel(o.id)} style={{cursor:'pointer'}}/></td>
                    <td style={{fontFamily:'DM Sans',fontSize:12,fontWeight:300,whiteSpace:'nowrap',color:isPast?'var(--text-muted)':'var(--text-primary)'}}>{o.flow_date}</td>
                    <td style={{fontWeight:300}}>{o.description}</td>
                    <td style={{textAlign:'right',fontFamily:'DM Sans',fontWeight:300,color:isOut?'var(--red)':'var(--green)',whiteSpace:'nowrap'}}>
                      {isOut?'(':'+'}{isOut?'':'$'}{Math.abs(o.amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}{isOut?')':''}
                    </td>
                    <td style={{color:'var(--text-muted)',fontSize:12}}>{o.account_name||'—'}</td>
                    <td><span style={{display:'inline-block',padding:'2px 8px',borderRadius:10,fontSize:11,fontWeight:500,background:badge.bg,color:badge.color}}>{badge.label}</span></td>
                    <td style={{textAlign:'center'}}>
                      <div style={{display:'flex',gap:4,justifyContent:'center'}}>
                        <button className="btn btn-sm btn-ghost" style={{padding:'2px 8px',fontSize:11}} onClick={()=>openEditOverlay(o)}>Edit</button>
                        <button className="btn btn-sm btn-ghost" style={{padding:'2px 8px',fontSize:11,color:'var(--red)'}} onClick={()=>deleteOverlay(o.id)}>Delete</button>
                      </div>
                    </td>
                  </tr>
                );
              })}</tbody>
            </table>
            {overlays.length>0&&(()=>{
              const net=ovUpIn+ovUpOut;
              return(
                <div style={{display:'flex',gap:28,padding:'10px 18px',borderTop:'1px solid var(--border)',background:'var(--elevated)',fontSize:12,fontWeight:300,color:'var(--text-muted)'}}>
                  <span>Upcoming inflows: <span style={{color:'var(--green)',fontFamily:'DM Sans',fontWeight:400}}>+{fmt(ovUpIn)}</span></span>
                  <span>Outflows: <span style={{color:'var(--red)',fontFamily:'DM Sans',fontWeight:400}}>({fmt(Math.abs(ovUpOut))})</span></span>
                  <span>Net: <span style={{color:net>=0?'var(--gold)':'var(--red)',fontFamily:'DM Sans',fontWeight:400}}>{net>=0?'+':''}{net<0?`(${fmt(Math.abs(net))})`:fmt(net)}</span></span>
                </div>
              );
            })()}
          </div>
        }
      </div>
    </div>
  );
}

/* ── Reconciliation Panel ──────────────────────────────────────────────── */
function ReconciliationPanel({toast}){
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const load=async()=>{
    setLoading(true);
    try{const r=await apiFetch('/reconciliation');setData(r);}
    catch(e){toast('Failed to load reconciliation data','error');}
    finally{setLoading(false);}
  };
  useEffect(()=>{load();},[]);
  if(loading)return<div style={{padding:40,textAlign:'center'}}><div className="spinner"/></div>;
  if(!data||!data.accounts?.length)return<div style={{padding:40,textAlign:'center',color:'var(--text-muted)'}}>No balance observations yet. Click <strong>Sync</strong> in the sidebar to record the first observations.</div>;
  const fmtDt=(iso)=>{if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});};
  const driftColor=(d)=>{if(d==null)return'var(--text-muted)';const a=Math.abs(d);return a<0.02?'var(--green)':a<5?'var(--amber)':'var(--red)';};
  const driftBadge=(d)=>{if(d==null)return'—';const a=Math.abs(d);return a<0.02?'✓ Matched':d>0?`+${fmt(d)} over`:`${fmt(a)} under`;};
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div>
          <h2 style={{fontSize:16,fontWeight:500,margin:0}}>Balance Reconciliation</h2>
          <p style={{fontSize:12,color:'var(--text-muted)',margin:'4px 0 0'}}>Plaid-reported vs. transaction-derived balances. Observations are recorded every sync.</p>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-sm btn-secondary" onClick={async()=>{
            try{
              const r=await apiFetch('/reconciliation/reanchor-all',{method:'POST'});
              toast(`Re-anchored ${r.corrected} of ${r.total_accounts} accounts`);
              load();
            }catch(e){toast('Re-anchor all failed: '+e.message,'error');}
          }}>⚓ Re-anchor All</button>
          <button className="btn btn-sm btn-secondary" onClick={load}>↻ Refresh</button>
        </div>
      </div>
      <div className="table-wrap">
        <table style={{fontSize:13}}>
          <thead><tr>
            <th>Account</th>
            <th style={{textAlign:'right'}}>Plaid Balance</th>
            <th style={{textAlign:'right'}}>Computed Balance</th>
            <th style={{textAlign:'right'}}>Drift</th>
            <th>Last Observed</th>
            <th>Last Reconciled</th>
            <th style={{textAlign:'center'}}>Observations</th>
            <th></th>
          </tr></thead>
          <tbody>{data.accounts.map(a=>(
            <tr key={a.account_id}>
              <td style={{fontWeight:500}}>
                {a.account_name}
                <div style={{fontSize:11,color:'var(--text-muted)'}}>{fmtAcctType(a.account_type)}</div>
              </td>
              <td style={{textAlign:'right',fontFamily:'DM Sans'}}>{a.latest?(a.latest.plaid_balance<0?'−':'')+fmt(a.latest.plaid_balance):'—'}</td>
              <td style={{textAlign:'right',fontFamily:'DM Sans'}}>{a.latest?(a.latest.computed_balance<0?'−':'')+fmt(a.latest.computed_balance):'—'}</td>
              <td style={{textAlign:'right',fontWeight:500,color:driftColor(a.latest?.delta)}}>
                {a.latest?driftBadge(a.latest.delta):'—'}
              </td>
              <td style={{fontSize:12,color:'var(--text-secondary)'}}>{a.latest?fmtDt(a.latest.observed_at):'Never'}</td>
              <td style={{fontSize:12,color:'var(--text-secondary)'}}>{a.last_reconciled?fmtDt(a.last_reconciled):'Never'}</td>
              <td style={{textAlign:'center',color:'var(--text-muted)'}}>{a.observation_count}</td>
              <td>{a.latest&&Math.abs(a.latest.delta)>=0.02&&<button className="btn btn-sm btn-ghost" style={{fontSize:11,padding:'2px 8px',color:'var(--blue)'}}
                onClick={async()=>{
                  try{
                    const r=await apiFetch(`/reconciliation/${a.account_id}/reanchor`,{method:'POST'});
                    toast(`${a.account_name}: re-anchored from Plaid (${r.old_balance?.toFixed(2)} → ${r.new_balance?.toFixed(2)})`);
                    load();
                  }catch(e){toast('Re-anchor failed: '+e.message,'error');}
                }}>Re-anchor</button>}</td>
            </tr>
          ))}</tbody>
        </table>
      </div>
      {/* Drift history sparklines for accounts with drift */}
      {data.accounts.filter(a=>a.drift_history?.length>1).map(a=>(
        <div key={a.account_id} style={{marginTop:16,padding:12,background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8}}>
          <div style={{fontSize:13,fontWeight:500,marginBottom:8}}>{a.account_name} — Drift History</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:2,height:40}}>
            {(()=>{
              const pts=a.drift_history;
              const maxD=Math.max(...pts.map(p=>Math.abs(p.delta||0)),0.01);
              return pts.map((p,i)=>{
                const h=Math.max(2,Math.abs(p.delta||0)/maxD*36);
                const clr=(p.delta||0)===0?'var(--green)':(p.delta||0)>0?'#f59e0b':'#3b82f6';
                return<div key={i} title={`${fmtDt(p.date)}: ${p.delta>0?'+':''}${p.delta?.toFixed(2)}`}
                  style={{width:Math.max(4,Math.floor(300/pts.length)),height:h,background:clr,borderRadius:2,opacity:0.8}}/>;
              });
            })()}
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text-muted)',marginTop:4}}>
            <span>{a.drift_history[0]?.date?.slice(0,10)}</span>
            <span>{a.drift_history[a.drift_history.length-1]?.date?.slice(0,10)}</span>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ── Daily Balances Page ─────────────────────────────────────────────────── */
function DailyBalancesPage({toast,refreshKey}){
  const[tab,setTab]=useState('balances'); // 'balances' | 'reconciliation'
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[rangeMode,setRangeMode]=useState('month');
  const[customStart,setCustomStart]=useState('');
  const[customEnd,setCustomEnd]=useState('');
  // All groups expanded by default; collapse Others that are less common
  const[collapsed,setCollapsed]=useState({'Other Assets':true,'Other Liabilities':true});

  // Balance-detail modal state {acct_name, date, raw_balance, projected_balance, entries}
  const[cellModal,setCellModal]=useState(null);

  // Account filter: empty set = all, or a set of selected account ids
  const[acctFilter,setAcctFilter]=useState(new Set());
  const[acctDropOpen,setAcctDropOpen]=useState(false);
  const toggleAcctFilter=(id)=>setAcctFilter(prev=>{const s=new Set(prev);if(s.has(id))s.delete(id);else s.add(id);return s;});

  const getRange=()=>{
    const n=new Date();
    if(rangeMode==='month'){
      const y=n.getFullYear(),m=n.getMonth()+1;
      const s=`${y}-${String(m).padStart(2,'0')}-01`;
      const last=new Date(y,m,0).getDate();
      return{s,e:`${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}`};
    }
    if(rangeMode==='quarter'){
      const y=n.getFullYear(),m=n.getMonth()+1;
      const qs=Math.floor((m-1)/3)*3+1,qe=qs+2;
      const last=new Date(y,qe,0).getDate();
      return{s:`${y}-${String(qs).padStart(2,'0')}-01`,e:`${y}-${String(qe).padStart(2,'0')}-${String(last).padStart(2,'0')}`};
    }
    return{s:customStart,e:customEnd};
  };

  const load=useCallback(async()=>{
    const{s,e}=getRange();
    if(rangeMode==='custom'&&(!s||!e))return;
    setLoading(true);
    try{
      const ct=todayStr();
      const q=`?client_today=${ct}${s?`&start_date=${s}`:''}${e?`&end_date=${e}`:''}`;
      setData(await apiFetch(`/daily-balances${q}`));
    }catch(err){toast('Failed to load daily balances','error');}
    finally{setLoading(false);}
  },[rangeMode,customStart,customEnd]);

  useEffect(()=>{load();},[load,refreshKey]);

  const toggle=g=>setCollapsed(p=>({...p,[g]:!p[g]}));


  const fmtBal=v=>{
    if(v==null)return'—';
    const abs=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    return v<0?`(${abs})`:abs;
  };

  const GRP_COLORS={'Checking & Savings':'rgba(52,211,153,0.08)','Investments':'rgba(96,165,250,0.08)','Other Assets':'rgba(139,92,246,0.08)','Credit Cards':'rgba(251,191,36,0.08)','Loans':'rgba(248,113,113,0.08)','Other Liabilities':'rgba(248,113,113,0.08)'};

  if(loading)return<SkeletonTable rows={6}/>;
  if(!data||!data.dates)return<div style={{padding:20,color:'var(--text-muted)'}}>No data</div>;

  const{dates,groups=[],today,projection_details={}}=data;
  const numDays=dates.length;

  return(
    <div>
      {/* Tab bar */}
      <div style={{display:'flex',gap:24,marginBottom:20,borderBottom:'1px solid var(--border)',paddingBottom:0,width:'fit-content'}}>
        <button onClick={()=>setTab('balances')}
          style={{padding:'8px 0',border:'none',borderBottom:tab==='balances'?'2px solid var(--gold)':'2px solid transparent',cursor:'pointer',fontSize:12,fontWeight:tab==='balances'?500:400,letterSpacing:'0.2px',
            background:'transparent',color:tab==='balances'?'var(--gold)':'var(--text-muted)',transition:'all 0.15s',marginBottom:'-1px'}}>Daily Balances</button>
        <button onClick={()=>setTab('reconciliation')}
          style={{padding:'8px 0',border:'none',borderBottom:tab==='reconciliation'?'2px solid var(--gold)':'2px solid transparent',cursor:'pointer',fontSize:12,fontWeight:tab==='reconciliation'?500:400,letterSpacing:'0.2px',
            background:'transparent',color:tab==='reconciliation'?'var(--gold)':'var(--text-muted)',transition:'all 0.15s',marginBottom:'-1px'}}>Reconciliation</button>
      </div>

      {tab==='reconciliation'?<ReconciliationPanel toast={toast}/>:<>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div><h2 style={{fontSize:20,fontWeight:400,letterSpacing:'-0.3px'}}>Daily Balances</h2>
          <p style={{fontSize:11,color:'var(--text-muted)',marginTop:3,fontWeight:300}}>{numDays} days · end-of-day · italic = projected · <span style={{color:'var(--amber)'}}>◈</span> = click for detail</p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          {/* Account multi-select filter */}
          <div style={{position:'relative'}}>
            <button className="sel-drop" onClick={()=>setAcctDropOpen(p=>!p)}
              style={{fontSize:11,padding:'4px 8px',height:30,minWidth:140,textAlign:'left',display:'flex',alignItems:'center',gap:4}}>
              {acctFilter.size===0?'All Accounts':`${acctFilter.size} selected`}
              <span style={{marginLeft:'auto',fontSize:8}}>▼</span>
            </button>
            {acctDropOpen&&<div style={{position:'absolute',top:'100%',left:0,marginTop:4,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:6,zIndex:30,boxShadow:'var(--shadow-md)',minWidth:220,maxHeight:300,overflowY:'auto'}}
              onMouseLeave={()=>setAcctDropOpen(false)}>
              {acctFilter.size>0&&<button style={{display:'block',width:'100%',textAlign:'left',border:'none',background:'none',padding:'4px 8px',fontSize:11,color:'var(--amber)',cursor:'pointer',fontFamily:'inherit',marginBottom:4}}
                onClick={()=>setAcctFilter(new Set())}>✕ Clear all</button>}
              {groups.map(g=>(
                <div key={g.group_name}>
                  <div style={{fontSize:10,fontWeight:500,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'1px',padding:'6px 8px 2px'}}>{g.group_name}</div>
                  {g.accounts.map(a=>(
                    <label key={a.id} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 8px',borderRadius:6,cursor:'pointer',fontSize:12,color:'var(--text-primary)',fontWeight:300}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--elevated)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      <input type="checkbox" checked={acctFilter.has(a.id)} onChange={()=>toggleAcctFilter(a.id)} style={{accentColor:'var(--gold)'}}/>
                      {a.account_name}
                    </label>
                  ))}
                </div>
              ))}
            </div>}
          </div>
          <div style={{display:'flex',gap:16}}>
            {[['month','This Month'],['quarter','This Quarter'],['custom','Custom']].map(([v,l])=>(
              <button key={v} onClick={()=>setRangeMode(v)}
                style={{padding:'4px 0',border:'none',borderBottom:rangeMode===v?'2px solid var(--gold)':'2px solid transparent',cursor:'pointer',fontSize:11,fontWeight:rangeMode===v?500:400,letterSpacing:'0.2px',
                  background:'transparent',color:rangeMode===v?'var(--gold)':'var(--text-muted)',transition:'all 0.15s'}}>{l}</button>
            ))}
          </div>
          {rangeMode==='custom'&&<>
            <input type="date" className="date-input" value={customStart} onChange={e=>setCustomStart(e.target.value)}/>
            <span style={{fontSize:12,color:'var(--text-muted)'}}>–</span>
            <input type="date" className="date-input" value={customEnd} onChange={e=>setCustomEnd(e.target.value)}/>
            <button className="btn btn-sm btn-primary" onClick={load}>Go</button>
          </>}
        </div>
      </div>

      {/* ── Filtered groups (account filter applied) ─────────────────────── */}
      {(()=>{
        const filtIds=acctFilter.size>0?acctFilter:null;
        // When filtering to selected accounts, keep only groups that contain them
        // and narrow accounts list within each group, recompute totals
        const fGroups=filtIds
          ?groups.map(g=>{
            const matchAccts=g.accounts.filter(a=>filtIds.has(a.id));
            if(!matchAccts.length)return null;
            // Recompute group totals by summing selected accounts' balances
            const totals={};
            matchAccts.forEach(a=>{Object.entries(a.balances||{}).forEach(([d,v])=>{totals[d]=(totals[d]||0)+v;});});
            return{...g,accounts:matchAccts,totals};
          }).filter(Boolean)
          :groups;
        const isSingle=filtIds&&filtIds.size===1;
        const singleAcct=isSingle?fGroups[0]?.accounts[0]:null;
        const singleLabel=singleAcct?singleAcct.account_name:'';

        /* ── KPI strip ────────────────────────────────────────────────────── */
        const computeNW=(di)=>{
          let s=0;
          fGroups.forEach(g=>{const v=g.totals[di]??0;s+=g.is_asset?v:-Math.abs(v);});
          return Math.round(s*100)/100;
        };
        const todayDi=dates.indexOf(today);
        const lastActualDi=todayDi>=0?todayDi:dates.reduce((best,d,i)=>d<=today?i:best,-1);
        const kpiStrip=lastActualDi<0?null:(()=>{
          const nwStart=computeNW(0);
          const nwNow=computeNW(lastActualDi);
          const nwChg=nwNow-nwStart;
          const nwChgPct=Math.abs(nwStart)>1?Math.round(nwChg/Math.abs(nwStart)*100):null;
          const nwPeak=Math.max(...Array.from({length:lastActualDi+1},(_,i)=>computeNW(i)));
          const fmtNW=v=>{const abs=fmt(Math.abs(v));return v<0?`(${abs})`:abs;};
          const chgPos=nwChg>=0;
          const lbl1=isSingle?`${singleLabel} — Today`:'Net Worth — Today';
          return(
            <div className="metric-grid grid-4" style={{marginBottom:16}}>
              <div className="card metric-card">
                <div className="metric-label">{lbl1}</div>
                <div className="metric-value" style={{color:nwNow>=0?'var(--green)':'var(--red)'}}>{fmtNW(nwNow)}</div>
                <div className="metric-sub"><span style={{fontSize:11,color:'var(--text-muted)'}}>{today}</span></div>
              </div>
              <div className="card metric-card">
                <div className="metric-label">Start of Period</div>
                <div className="metric-value" style={{color:nwStart>=0?'var(--green)':'var(--red)'}}>{fmtNW(nwStart)}</div>
                <div className="metric-sub"><span style={{fontSize:11,color:'var(--text-muted)'}}>{dates[0]}</span></div>
              </div>
              <div className="card metric-card">
                <div className="metric-label">Period Change</div>
                <div className="metric-value" style={{color:chgPos?'var(--green)':'var(--red)'}}>{nwChg>0?'+':''}{fmtNW(nwChg)}</div>
                <div className="metric-sub">{nwChgPct!=null&&<span style={{background:chgPos?'rgba(52,211,153,0.12)':'rgba(248,113,113,0.12)',color:chgPos?'var(--green)':'var(--red)',borderRadius:12,padding:'2px 8px',fontSize:11,fontWeight:400}}>{nwChgPct>0?'+':''}{nwChgPct}%</span>}</div>
              </div>
              <div className="card metric-card">
                <div className="metric-label">Period High</div>
                <div className="metric-value" style={{color:nwPeak>=0?'var(--green)':'var(--red)'}}>{fmtNW(nwPeak)}</div>
                <div className="metric-sub"><span style={{fontSize:11,color:'var(--text-muted)'}}>actual high in range</span></div>
              </div>
            </div>
          );
        })();
        return(<>
      {kpiStrip}

      <div style={{overflowX:'auto',borderRadius:14,border:'1px solid var(--border)',background:'var(--surface)',maxHeight:'75vh',overflowY:'auto'}}>
        <table style={{borderCollapse:'collapse',fontSize:12,width:'100%'}}>
          <thead style={{position:'sticky',top:0,zIndex:10}}>
            {/* Row 1: Group headers */}
            <tr>
              <th rowSpan={2} style={{position:'sticky',left:0,zIndex:12,background:'var(--surface)',padding:'8px 12px',textAlign:'left',fontSize:11,fontWeight:400,borderBottom:'2px solid var(--border)',borderRight:'2px solid var(--border)',whiteSpace:'nowrap',minWidth:70,color:'var(--text-muted)'}}>Date</th>
              {fGroups.map(grp=>{
                const span=collapsed[grp.group]?1:1+grp.accounts.length;
                return(
                  <th key={grp.group} colSpan={span} style={{padding:'6px 10px',textAlign:'center',fontSize:10,fontWeight:400,textTransform:'uppercase',letterSpacing:'0.5px',borderBottom:'1px solid var(--border)',borderLeft:'2px solid var(--border)',background:GRP_COLORS[grp.group]||'#f9fafb',cursor:'pointer',userSelect:'none',whiteSpace:'nowrap'}}
                    onClick={()=>toggle(grp.group)}>
                    {grp.group} {collapsed[grp.group]?'▶':'▼'}
                  </th>
                );
              })}
              {/* Grand Total = Net Worth per date */}
              <th rowSpan={2} style={{padding:'6px 10px',textAlign:'right',fontSize:10,fontWeight:500,textTransform:'uppercase',letterSpacing:'1px',borderBottom:'2px solid var(--border)',borderLeft:'3px solid var(--gold)',background:'var(--gold-soft)',whiteSpace:'nowrap',color:'var(--gold)',minWidth:100}}>Grand Total</th>
            </tr>
            {/* Row 2: Account name sub-headers */}
            <tr style={{background:'var(--surface)'}}>
              {fGroups.map(grp=>[
                <th key={grp.group+'-t'} style={{padding:'5px 8px',textAlign:'right',fontSize:10,fontWeight:400,borderBottom:'2px solid var(--border)',borderLeft:'2px solid var(--border)',background:GRP_COLORS[grp.group]||'var(--elevated)',whiteSpace:'nowrap',color:'var(--text-secondary)'}}>Total</th>,
                ...(!collapsed[grp.group]?grp.accounts.map(acct=>(
                  <th key={acct.id} style={{padding:'5px 8px',textAlign:'right',fontSize:10,fontWeight:400,borderBottom:'2px solid var(--border)',borderLeft:'1px solid var(--border)',background:'var(--surface)',whiteSpace:'nowrap',maxWidth:110,overflow:'hidden',textOverflow:'ellipsis',color:'var(--text-muted)'}} title={acct.account_name}>{acct.account_name}</th>
                )):[])
              ])}
            </tr>
          </thead>
          <tbody>
            {dates.map((d,di)=>{
              const isToday=d===today;
              const isFuture=d>today;
              const rowBg=isToday?'var(--gold-soft)':isFuture?'var(--elevated)':'transparent';
              return(
                <tr key={d} style={{background:rowBg}}>
                  <td style={{position:'sticky',left:0,zIndex:2,background:isToday?'var(--gold-soft)':isFuture?'var(--elevated)':'var(--surface)',padding:'3px 10px',fontFamily:'DM Sans',fontSize:11,fontWeight:300,borderRight:'2px solid var(--border)',borderBottom:'1px solid var(--border)',whiteSpace:'nowrap',color:isToday?'var(--gold)':isFuture?'var(--text-muted)':'var(--text-secondary)'}}>
                    {d.slice(5)}{isToday&&<span style={{marginLeft:5,fontSize:9,fontWeight:500,background:'var(--gold)',color:'var(--on-gold)',borderRadius:3,padding:'1px 4px'}}>TODAY</span>}
                  </td>
                  {(()=>{
                    /* For each group: liabilities always shown as (negative) in red */
                    let grandTotal=0;
                    const cells=fGroups.flatMap(grp=>{
                      const isLiab=!grp.is_asset;
                      const rawTot=grp.totals[di];
                      /* contribution to net worth: assets add, liabilities subtract */
                      grandTotal+=isLiab?-Math.abs(rawTot??0):(rawTot??0);
                      const dispTot=isLiab?-Math.abs(rawTot??0):(rawTot??0);
                      const totCell=(
                        <td key={grp.group+'-t'} style={{padding:'3px 8px',textAlign:'right',fontFamily:'DM Sans',fontWeight:500,fontSize:12,borderLeft:'2px solid var(--border)',borderBottom:'1px solid var(--border)',color:isLiab?'var(--red)':dispTot<0?'var(--red)':'inherit',background:isLiab?'rgba(248,113,113,0.08)':dispTot<0?'rgba(248,113,113,0.08)':undefined,whiteSpace:'nowrap'}}>{fmtBal(dispTot)}</td>
                      );
                      const acctCells=!collapsed[grp.group]?grp.accounts.map(acct=>{
                        const rawVal=acct.balances[di];
                        const dispVal=isLiab?-Math.abs(rawVal??0):(rawVal??0);
                        const isProj=acct.projected_dates&&acct.projected_dates.length>0&&d>=acct.projected_dates[0];
                        const projEntries=(projection_details[String(acct.id)]||{})[d];
                        const hasProj=!!(projEntries&&projEntries.length>0);
                        const handleClick=hasProj?()=>{
                          // Compute "balance before today's entries" by subtracting this date's
                          // entries from the projected balance.  This guarantees the modal math
                          // always reconciles even when earlier-date overlays have already shifted
                          // the running balance (those prior entries aren't shown here).
                          const entriesSum=projEntries.reduce((s,e)=>s+e.amount,0);
                          const balBefore=Math.round((dispVal-entriesSum)*100)/100;
                          setCellModal({acct_name:acct.account_name,date:d,raw_balance:balBefore,projected_balance:dispVal,entries:projEntries});
                        }:undefined;
                        return(
                          <td key={acct.id} onClick={handleClick} title={hasProj?`Click to see ${projEntries.length} projection${projEntries.length>1?'s':''}`:undefined} style={{padding:'3px 8px',textAlign:'right',fontFamily:'DM Sans',fontSize:11,borderLeft:'1px solid var(--border)',borderBottom:'1px solid var(--border)',color:isLiab?'var(--red)':dispVal<0?'var(--red)':'inherit',fontStyle:isProj?'italic':'normal',opacity:isProj?0.8:1,whiteSpace:'nowrap',cursor:hasProj?'pointer':undefined,background:hasProj?'var(--gold-soft)':undefined}}>
                            {fmtBal(dispVal)}{hasProj&&<span style={{marginLeft:2,fontSize:8,color:'var(--amber)',verticalAlign:'super'}}>◈</span>}
                          </td>
                        );
                      }):[];
                      return[totCell,...acctCells];
                    });
                    grandTotal=Math.round(grandTotal*100)/100;
                    const gtColor=grandTotal>=0?'var(--green)':'var(--red)';
                    cells.push(
                      <td key="grand-total" style={{padding:'3px 10px',textAlign:'right',fontFamily:'DM Sans',fontWeight:400,fontSize:12,borderLeft:'3px solid var(--violet)',borderBottom:'1px solid var(--border)',color:gtColor,background:'var(--violet-soft)',whiteSpace:'nowrap'}}>{fmtBal(grandTotal)}</td>
                    );
                    return cells;
                  })()}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* ── Balance-detail modal ─────────────────────────────────────────── */}
      {cellModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{background:'var(--card-bg)',borderRadius:12,padding:24,minWidth:340,maxWidth:480,boxShadow:'0 20px 60px rgba(0,0,0,0.2)',width:'90%'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16}}>
              <div>
                <div style={{fontWeight:400,fontSize:15,color:'var(--text-primary)'}}>{cellModal.acct_name}</div>
                <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{cellModal.date}</div>
              </div>
              <button onClick={()=>setCellModal(null)} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'var(--text-muted)',lineHeight:1,padding:0}}>×</button>
            </div>
            <div style={{borderTop:'1px solid var(--border)',paddingTop:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <span style={{fontSize:13,color:'var(--text-secondary)'}}>Balance before today's entries</span>
                <span style={{fontFamily:'DM Sans',fontSize:13}}>{fmtBal(cellModal.raw_balance)}</span>
              </div>
              {cellModal.entries.map((e,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,paddingLeft:10,borderLeft:'3px solid '+(e.amount>=0?'var(--green)':'var(--red)')}}>
                  <div>
                    <div style={{fontSize:13,color:'var(--text-primary)'}}>{e.description}</div>
                    <div style={{fontSize:10,color:'var(--text-muted)',textTransform:'capitalize',marginTop:1}}>{e.source.replace(/_/g,' ')}</div>
                  </div>
                  <span style={{fontFamily:'DM Sans',fontSize:13,fontWeight:500,color:e.amount>=0?'var(--green)':'var(--red)',marginLeft:16,whiteSpace:'nowrap'}}>
                    {e.amount>=0?'+':'–'}${Math.abs(e.amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
                  </span>
                </div>
              ))}
              <div style={{borderTop:'2px solid var(--border)',marginTop:12,paddingTop:12,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span style={{fontSize:14,fontWeight:400,color:'var(--text-primary)'}}>Projected balance</span>
                <span style={{fontFamily:'DM Sans',fontSize:15,fontWeight:400,color:cellModal.projected_balance>=0?'inherit':'var(--red)'}}>{fmtBal(cellModal.projected_balance)}</span>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── Overlay section moved to Cash Flow page ──────────────────────── */}
      <div style={{marginTop:28}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div style={{fontSize:13,color:'var(--text-muted)'}}>💡 Manage overlays &amp; salary projections in the <strong>Cash Flow</strong> page.</div>
        </div>

      </div>
      </>);
      })()}
      </>}
    </div>
  );
}

/* ── Hash-based URL routing ─────────────────────────────────────────────── */
const PAGES=['dashboard','transactions','budgets','networth','cashflow',
             'cashplanner','loans','gcb','cards','accounts','settings'];
function parseHash(){
  const raw=window.location.hash.slice(1)||'';
  const qi=raw.indexOf('?');
  const path=qi>=0?raw.slice(0,qi):raw;
  const search=qi>=0?raw.slice(qi+1):'';
  return{page:PAGES.includes(path)?path:'dashboard',params:new URLSearchParams(search)};
}
function syncHashParams(newParams){
  const{page}=parseHash();
  const qs=new URLSearchParams(
    Object.fromEntries(Object.entries(newParams).filter(([,v])=>v!=null&&String(v)!==''))
  ).toString();
  window.history.replaceState(null,'','#'+page+(qs?'?'+qs:''));
}
function useHashRouter(){
  const[route,setRoute]=useState(parseHash);
  useEffect(()=>{
    const h=()=>setRoute(parseHash());
    window.addEventListener('hashchange',h);
    return()=>window.removeEventListener('hashchange',h);
  },[]);
  const navigate=useCallback((page,params={})=>{
    const filtered=Object.fromEntries(
      Object.entries(params).filter(([,v])=>v!=null&&String(v)!=='')
    );
    const qs=new URLSearchParams(filtered).toString();
    window.location.hash=qs?`${page}?${qs}`:page;
  },[]);
  return{page:route.page,params:route.params,navigate};
}

function App(){
  const{page,navigate}=useHashRouter();
  const setPage=useCallback((p)=>navigate(p),[navigate]);
  const[categories,setCategories]=useState([]);
  const[banks,setBanks]=useState([]);
  const[collapsed,setCollapsed]=useState(()=>{try{const v=localStorage.getItem('nav-collapsed');return v===null?true:v==='1';}catch(e){return true;}});
  const[refreshKey,setRefreshKey]=useState(0);
  const[refreshing,setRefreshing]=useState(false);
  const[pendingDupScan,setPendingDupScan]=useState(false);
  const[theme,setTheme]=useState(()=>{try{return localStorage.getItem('theme')||'dark'}catch(e){return'dark'}});
  const{toasts,toast}=useToast();
  const contentRef=useRef(null);

  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);try{localStorage.setItem('theme',theme)}catch(e){}const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content=theme==='dark'?'#0e0e10':'#f4f4f7';},[theme]);

  const handleRefresh=useCallback(()=>{
    setRefreshing(true);
    setRefreshKey(k=>k+1);
    setTimeout(()=>setRefreshing(false),600);
  },[]);
  const{ptrState,pullY}=usePullToRefresh(contentRef,handleRefresh);

  const loadMeta=useCallback(async()=>{
    try{const[c,b]=await Promise.all([apiFetch('/categories'),apiFetch('/plaid/items')]);setCategories(c);setBanks(b);}catch(e){}
  },[]);

  // Auto-sync on app open — throttled to once per 20 minutes so refreshing
  // the page doesn't hammer Plaid.  Runs silently in the background.
  useEffect(()=>{
    loadMeta();
    if(!document.getElementById('plaid-script')){const s=document.createElement('script');s.id='plaid-script';s.src='https://cdn.plaid.com/link/v2/stable/link-initialize.js';document.head.appendChild(s);}
    const AUTO_SYNC_INTERVAL=20*60*1000;
    const last=parseInt(localStorage.getItem('lastAutoSync')||'0');
    if(Date.now()-last>AUTO_SYNC_INTERVAL){
      localStorage.setItem('lastAutoSync',String(Date.now()));
      apiFetch('/plaid/sync-transactions',{method:'POST'})
        .then(r=>{
          if(r.items_errored>0){
            const names=r.errored.map(e=>e.institution_name).join(', ');
            toast(`⚠️ ${r.items_errored} bank${r.items_errored!==1?' accounts need':'account needs'} reconnecting: ${names}`,'error');
          }
          if(r.items_cursor_reset>0){
            toast(`↺ ${r.items_cursor_reset} stuck account${r.items_cursor_reset!==1?'s':''} reset — re-downloading transactions`);
          }
          setTimeout(loadMeta,15000);
          apiFetch('/challenges/recalc-all',{method:'POST'}).catch(()=>{});
        })
        .catch(()=>{});
    }
  },[]);

  const sync=async()=>{
    try{
      const r=await apiFetch('/plaid/sync-transactions',{method:'POST'});
      if(r.items_errored>0&&r.items_queued===0){
        const names=r.errored.map(e=>e.institution_name).join(', ');
        toast(`Sync skipped — reconnect required: ${names} (Settings → Connected Banks)`,'error');
      }else if(r.items_errored>0){
        const names=r.errored.map(e=>e.institution_name).join(', ');
        const resetNote=r.items_cursor_reset>0?` (${r.items_cursor_reset} re-downloading from scratch)`:'';
        toast(`Syncing ${r.items_queued} bank${r.items_queued!==1?'s':''}${resetNote} — reconnect required: ${names}`,'error');
      }else if(r.items_cursor_reset>0){
        toast(`↺ ${r.items_cursor_reset} stuck account${r.items_cursor_reset!==1?'s':''} reset + syncing ${r.items_queued} bank${r.items_queued!==1?'s':''} — transactions will appear shortly`);
      }else{
        toast(`Syncing ${r.items_queued} bank${r.items_queued!==1?'s':''} — new transactions will appear shortly`);
      }
      loadMeta();
      setTimeout(loadMeta,15000);
      apiFetch('/challenges/recalc-all',{method:'POST'}).catch(()=>{});
    }catch(e){toast('Sync failed: '+(e.message||e),'error');}
  };

  /* After a successful link: reload meta; if new accounts were created,
     navigate to Settings → Bank Links and auto-trigger a duplicate scan */
  const handleLinkDone=useCallback((hasNew)=>{
    loadMeta();
    if(hasNew){setPage('settings');setPendingDupScan(true);}
  },[loadMeta]);

  const[openPlaid,linkSummaryModal]=usePlaidLink(toast,handleLinkDone);
  const[online,setOnline]=useState(navigator.onLine);
  useEffect(()=>{
    const on=()=>{setOnline(true);handleRefresh();toast('Back online — refreshing data');};
    const off=()=>{setOnline(false);toast('You\'re offline — showing cached data','error');};
    window.addEventListener('online',on);window.addEventListener('offline',off);
    return()=>{window.removeEventListener('online',on);window.removeEventListener('offline',off);};
  },[handleRefresh]);
  const titles={dashboard:'Dashboard',transactions:'Transactions',budgets:'Budgets',networth:'Net Worth',cashflow:'Daily Balances',cashplanner:'Cash Flows',loans:'Loans',gcb:'GCB',cards:'Cards',accounts:'Accounts',settings:'Settings'};

  return(
    <div style={{display:'flex',height:'100vh'}}>
      <Sidebar page={page} setPage={setPage} banks={banks} onConnectBank={openPlaid} onSync={sync} collapsed={collapsed} setCollapsed={setCollapsed}/>
      <div className="main" style={{marginLeft:collapsed?56:190}}>
        <div className="topbar">
          <div style={{display:'flex',alignItems:'center',gap:16}}>
            <div className="topbar-title">{titles[page]}</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            {banks.length>0&&<span className="bank-badge">{banks.length} account{banks.length!==1?'s':''} connected</span>}
            <button className="btn btn-ghost" onClick={()=>setTheme(theme==='dark'?'light':'dark')} title="Toggle theme" style={{padding:'6px 8px'}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">{theme==='dark'?<><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></>:<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>}</svg></button>
            <button onClick={handleRefresh} title="Refresh page data" style={{background:'none',border:'1px solid var(--border)',borderRadius:7,padding:'5px 10px',cursor:'pointer',color:'var(--text-muted)',fontSize:15,lineHeight:1,transition:'transform 0.4s',transform:refreshing?'rotate(360deg)':'rotate(0deg)'}}>↻</button>
          </div>
        </div>
        {!online&&<div style={{padding:'6px 16px',background:'rgba(248,113,113,0.1)',borderBottom:'1px solid rgba(248,113,113,0.2)',
          display:'flex',alignItems:'center',gap:8,fontSize:12,color:'var(--red)',fontWeight:400}}>
          <span style={{fontSize:14}}>⚡</span>You're offline — showing cached data. Changes will sync when reconnected.
        </div>}
        <PullToRefreshIndicator pullY={pullY} ptrState={ptrState}/>
        <div className="content" ref={contentRef}>
          {page==='dashboard'&&<DashboardPage categories={categories} toast={toast} setPage={setPage} refreshKey={refreshKey}/>}
          {page==='transactions'&&<TransactionsPage categories={categories} toast={toast} refreshKey={refreshKey}/>}
          {page==='budgets'&&<BudgetsPage categories={categories} toast={toast} refreshKey={refreshKey}/>}
          {page==='cashflow'&&<DailyBalancesPage toast={toast} refreshKey={refreshKey}/>}
          {page==='cashplanner'&&<CashFlowPage toast={toast} refreshKey={refreshKey}/>}
          {page==='networth'&&<NetWorthPage toast={toast} refreshKey={refreshKey}/>}
          {page==='loans'&&<LoansPage toast={toast} refreshKey={refreshKey}/>}
          {page==='accounts'&&<AccountsPage banks={banks} onConnectBank={openPlaid} onSync={sync} toast={toast} refreshKey={refreshKey}/>}
          {page==='cards'&&<CardsPage toast={toast} refreshKey={refreshKey}/>}
          {page==='gcb'&&<GCBPage toast={toast} refreshKey={refreshKey}/>}
          {page==='settings'&&<SettingsPage banks={banks} onConnectBank={openPlaid} toast={toast} onBanksChanged={loadMeta} categories={categories} autoScan={pendingDupScan} onAutoScanDone={()=>setPendingDupScan(false)}/>}
        </div>
      </div>
      <ToastContainer toasts={toasts}/>
      {linkSummaryModal}
      <MobileNav page={page} setPage={setPage}/>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
<script>
// Service Worker registration
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').then(r=>{
      console.log('[SW] Registered, scope:',r.scope);
    }).catch(e=>console.warn('[SW] Registration failed:',e));
  });
}

// iOS Add-to-Home-Screen tooltip (shown once)
(function(){
  var isIOS=/iPhone|iPad/.test(navigator.userAgent)&&!window.navigator.standalone;
  var dismissed=localStorage.getItem('pwa-install-dismissed');
  if(isIOS&&!dismissed){
    setTimeout(function(){
      var tip=document.createElement('div');
      tip.id='ios-install-tip';
      tip.style.cssText='position:fixed;bottom:74px;left:12px;right:12px;z-index:9999;background:var(--surface);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,0.4)';
      var inner=document.createElement('div');
      inner.style.flex='1';
      var title=document.createElement('div');
      title.style.cssText='font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:4px';
      title.textContent='Install Moresheth';
      var desc=document.createElement('div');
      desc.style.cssText='font-size:11px;color:var(--text-muted)';
      desc.textContent='Tap the Share button \u2B06 then "Add to Home Screen"';
      inner.appendChild(title);
      inner.appendChild(desc);
      var btn=document.createElement('button');
      btn.textContent='Got it';
      btn.style.cssText='background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text-muted);cursor:pointer;font-size:11px;font-family:inherit';
      btn.onclick=function(){localStorage.setItem('pwa-install-dismissed','1');tip.remove();};
      tip.appendChild(inner);
      tip.appendChild(btn);
      document.body.appendChild(tip);
    },3000);
  }
})();

// Android install prompt
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
});
</script>
</body>
</html>
