<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finance Automation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sidebar-w:220px;--bg:#f0f3f8;--sidebar-bg:#00245d;--sidebar-text:#a8bcd8;
  --sidebar-hover-bg:rgba(255,255,255,0.09);--sidebar-active-bg:rgba(255,255,255,0.15);
  --card-bg:#ffffff;--border:#dde3ee;--text-primary:#0d1b2e;--text-secondary:#6b7280;--text-muted:#9ca3af;
  --blue:#0070d2;--green:#10b981;--red:#ef4444;--amber:#f59e0b;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 4px 12px rgba(0,0,0,0.08);
}
html,body,#root{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-primary)}
body{overflow:hidden}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--sidebar-bg);display:flex;flex-direction:column;z-index:100;border-right:none;box-shadow:2px 0 12px rgba(0,36,93,0.18)}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.1)}
.sidebar-logo h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:-0.3px}
.sidebar-logo p{font-size:11px;color:var(--sidebar-text);margin-top:2px}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-section-label{font-size:10px;font-weight:600;color:rgba(168,188,216,0.55);text-transform:uppercase;letter-spacing:1px;padding:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:400;color:var(--sidebar-text);transition:all 0.15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--sidebar-hover-bg);color:#e8eef8}
.nav-item.active{background:var(--sidebar-active-bg);color:#ffffff;font-weight:600;box-shadow:inset 3px 0 0 rgba(255,255,255,0.6)}
.nav-icon{font-size:15px;width:18px;text-align:center}
.sidebar-footer{padding:16px 10px;border-top:1px solid rgba(255,255,255,0.1)}
.sidebar-bank{padding:6px 10px;border-radius:8px;font-size:12px;color:#c8d8ee;display:flex;align-items:center;gap:8px}
.bank-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.main{margin-left:var(--sidebar-w);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600;color:var(--text-primary)}
.content{flex:1;overflow-y:auto;padding:24px 28px}
.card{background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow)}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.metric-card{padding:20px 22px}
.metric-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-bottom:8px}
.metric-value{font-size:28px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:-1px}
.metric-sub{font-size:12px;color:var(--text-muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#005bb5}
.btn-secondary{background:#f3f4f6;color:var(--text-primary);border:1px solid var(--border)}
.btn-secondary:hover{background:#e9eaec}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-success{background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0}
.btn-success:hover{background:#dcfce7}
.btn-ghost{background:transparent;color:var(--text-secondary)}
.btn-ghost:hover{background:#f3f4f6}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-outline-white{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.35)}
.btn-outline-white:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.6)}
.filters{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.search-input{border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;outline:none;color:var(--text-primary);background:#fafafa;width:200px}
.search-input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.filter-select{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;color:var(--text-primary);background:#fafafa;cursor:pointer}
.filter-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.date-input{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit;outline:none;color:var(--text-primary);background:#fafafa}
.filter-count{margin-left:auto;font-size:12px;color:var(--text-muted);white-space:nowrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:var(--text-muted);border-bottom:1px solid var(--border);white-space:nowrap;background:#fafafa}
tbody tr{border-bottom:1px solid #f3f4f6;transition:background 0.1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#f9faff}
tbody tr.row-locked{background:#eff6ff}
tbody tr.row-locked:hover{background:#dbeafe}
tbody tr.row-review{background:#fffbeb}
tbody tr.row-review:hover{background:#fef3c7}
tbody tr.row-transfer{opacity:0.7}
td{padding:11px 14px;font-size:13.5px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap}
.badge-transfer{background:#f3f4f6;color:#6b7280}
.badge-income{background:#f0fdf4;color:#059669}
.badge-expense{background:#fef2f2;color:#dc2626}
.badge-category{background:#eff6ff;color:#2563eb}
.badge-unclassified{background:#fef2f2;color:#dc2626}
.edit-actions{display:flex;gap:6px;align-items:center}
.amount-neg{color:var(--red);font-family:'DM Mono',monospace;font-size:13.5px;font-weight:500}
.amount-pos{color:var(--green);font-family:'DM Mono',monospace;font-size:13.5px;font-weight:500}
.amount-neutral{color:var(--text-secondary);font-family:'DM Mono',monospace;font-size:13.5px}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#0f1117;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-md);animation:slideUp 0.2s ease;max-width:320px}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.review-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:center;justify-content:center}
.review-panel{background:#fff;border-radius:16px;padding:28px;width:480px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.review-field{margin-bottom:16px}
.review-field label{font-size:12px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:6px}
.review-field select,.review-field input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none}
.review-field select:focus,.review-field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.review-actions{display:flex;gap:8px;margin-top:24px;justify-content:flex-end}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-muted);font-size:14px;gap:10px}
.spinner{width:18px;height:18px;border:2px solid #e5e7eb;border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:var(--text-muted);gap:8px}
.empty-icon{font-size:36px;opacity:0.4}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.section-title{font-size:14px;font-weight:600}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:14px;font-weight:500}
.settings-desc{font-size:12px;color:var(--text-muted);margin-top:2px}
.bank-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);border-radius:20px;padding:3px 10px;font-size:11px;color:#059669}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback}=React;
const API='/api';
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Math.abs(n??0));
const fmtDate=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const monthStart=()=>new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);
const todayStr=()=>new Date().toISOString().slice(0,10);

function useToast(){
  const[toasts,setToasts]=useState([]);
  const add=(msg,type='success')=>{
    const id=Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500);
  };
  return{toasts,toast:add};
}

async function apiFetch(path,opts={}){
  const res=await fetch(API+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});
  if(!res.ok){const text=await res.text();let msg=text;try{const j=JSON.parse(text);if(j.detail)msg=j.detail;}catch{}throw new Error(msg);}
  return res.json();
}

function ToastContainer({toasts}){
  return<div className="toast-container">{toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}</div>;
}

function Sidebar({page,setPage,banks,onConnectBank,onSync}){
  const nav=[{id:'dashboard',icon:'⊞',label:'Dashboard'},{id:'transactions',icon:'↕',label:'Transactions'},{id:'budgets',icon:'◉',label:'Budgets'},{id:'networth',icon:'△',label:'Net Worth'},{id:'cashflow',icon:'⇄',label:'Daily Balances'},{id:'loans',icon:'⌂',label:'Loans'},{id:'gcb',icon:'$',label:'GCB'},{id:'cards',icon:'▭',label:'Cards'},{id:'accounts',icon:'◫',label:'Accounts'},{id:'settings',icon:'⚙',label:'Settings'}];
  const uniqueBanks=[...new Map(banks.map(b=>[b.institution_name,b])).values()];
  return(
    <div className="sidebar">
      <div className="sidebar-logo"><h1>Finance</h1><p>Personal dashboard</p></div>
      <nav className="sidebar-nav">
        <div className="nav-section-label">Menu</div>
        {nav.map(n=><button key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}><span className="nav-icon">{n.icon}</span>{n.label}</button>)}
      </nav>
      <div className="sidebar-footer">
        <div className="nav-section-label" style={{paddingTop:0,marginBottom:6}}>Connected Banks</div>
        {uniqueBanks.length===0?<div style={{fontSize:12,color:'var(--sidebar-text)',padding:'4px 10px'}}>No banks connected</div>
          :uniqueBanks.map((b,i)=><div key={i} className="sidebar-bank"><span className="bank-dot"/><span style={{fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{b.institution_name}</span></div>)}
        <div style={{display:'flex',gap:6,marginTop:12}}>
          <button className="btn btn-sm btn-primary" style={{flex:1,justifyContent:'center'}} onClick={onConnectBank}>+ Bank</button>
          <button className="btn btn-sm btn-outline-white" style={{flex:1,justifyContent:'center'}} onClick={onSync}>Sync</button>
        </div>
      </div>
    </div>
  );
}

/* Sort categories alphabetically for dropdowns (Section 4D) */
const sortedCats=(cats)=>[...cats].sort((a,b)=>a.name.localeCompare(b.name));

/* 8 canonical transaction types (Section 4B) */
const TXN_TYPES=['Expense','Income','Transfer','Investment Gain (Loss)','Purchase','Sale','Depreciation','Other'];
/* Types that show a category selector — only Expense and Income (Section 4C) */
const BUDGET_TYPES_SET=new Set(['Expense','Income']);
/* Category only shown for Expense/Income */
const showCategoryForType=(t)=>BUDGET_TYPES_SET.has(t);

function ReviewModal({txn,categories,onSave,onDiscard,onIgnore,onClose}){
  const[category,setCategory]=useState(txn.category_final||'');
  const[action,setAction]=useState(txn.action||'Expense');
  const[saving,setSaving]=useState(false);
  const[createRule,setCreateRule]=useState(txn.enrichment_source==='llm'||txn.enrichment_source==='fallback');
  /* When type changes, clear category if new type hides it */
  const handleTypeChange=(newType)=>{setAction(newType);if(!showCategoryForType(newType))setCategory('');};
  const handleSave=async()=>{
    setSaving(true);
    await onSave(txn.id,{category,action,needs_review:false});
    /* If checkbox is ticked and it's an LLM/fallback-sourced txn, create a rule */
    if(createRule&&showCategoryForType(action)&&category&&category!=='Unclassified'){
      try{await apiFetch(`/llm/create-rule-from-transaction/${txn.id}`,{method:'POST'});}
      catch(e){/* Non-fatal — rule creation failure shouldn't block the save */}
    }
    setSaving(false);onClose();
  };
  const isLlmOrFallback=txn.enrichment_source==='llm'||txn.enrichment_source==='fallback';
  return(
    <div className="review-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="review-panel">
        <div style={{fontSize:16,fontWeight:600,marginBottom:4}}>Review Transaction</div>
        <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:20}}>{fmtDate(txn.date)} · {txn.amount<0?'–':'+'}{fmt(txn.amount)}</div>
        <div className="review-field"><label>Description</label><input value={txn.description_display||txn.description_raw} readOnly style={{background:'#fafafa',color:'#6b7280'}}/>
          {txn.description_display&&txn.description_display!==txn.description_raw&&<div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>Raw: {txn.description_raw}</div>}
        </div>
        <div className="review-field"><label>Type</label>
          <select value={action} onChange={e=>handleTypeChange(e.target.value)}>
            {TXN_TYPES.map(a=><option key={a}>{a}</option>)}
          </select>
        </div>
        {showCategoryForType(action)&&<div className="review-field"><label>Category</label>
          <select value={category} onChange={e=>setCategory(e.target.value)}>
            <option value="">— Select category —</option>
            {sortedCats(categories).map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
        </div>}
        {isLlmOrFallback&&showCategoryForType(action)&&
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--text-secondary)',marginTop:4,cursor:'pointer'}}>
            <input type="checkbox" checked={createRule} onChange={e=>setCreateRule(e.target.checked)}/>
            Save as rule for future transactions
          </label>}
        <div className="review-actions">
          <button className="btn btn-sm btn-ghost" onClick={onDiscard} title="Close without saving">✕ Discard</button>
          <button className="btn btn-sm btn-ghost" onClick={()=>{onIgnore(txn.id);onClose();}} title="Remove from review queue without categorizing">○ Ignore</button>
          <button className="btn btn-sm btn-success" onClick={handleSave} disabled={saving}>{saving?'…':'✓ Save'}</button>
        </div>
      </div>
    </div>
  );
}

function TxnRow({txn,categories,onSave,onReview,onSplit,selected,onToggleSelect,onBatchEdit}){
  const[locked,setLocked]=useState(txn.is_locked);
  const[gcb,setGcb]=useState(txn.is_gcb||false);
  const[editing,setEditing]=useState(false);
  const[category,setCategory]=useState(txn.category_final);
  const[action,setAction]=useState(txn.action);
  const[saving,setSaving]=useState(false);
  const[expanded,setExpanded]=useState(false);
  const rowClass=locked?'row-locked':txn.needs_review?'row-review':txn.action==='Transfer'?'row-transfer':'';
  /* When type changes in edit mode, clear category if new type hides it */
  const handleTypeChange=(newType)=>{setAction(newType);if(!showCategoryForType(newType))setCategory('');};
  const[showRulePrompt,setShowRulePrompt]=useState(false);
  const[ruleCreating,setRuleCreating]=useState(false);
  const isLlmSource=txn.enrichment_source==='llm'||txn.enrichment_source==='override';
  const save=async()=>{
    setSaving(true);await onSave(txn.id,{category,action,needs_review:false});setLocked(true);setSaving(false);setEditing(false);
    /* Only offer rule creation when enrichment came from LLM (not already a rule) */
    if(isLlmSource&&category&&category!=='Unclassified')setShowRulePrompt(true);
  };
  const createRuleFromTxn=async()=>{
    setRuleCreating(true);
    try{
      /* Use new smart rule API — uses clean merchant name, deduplicates, priority 200 */
      await apiFetch(`/llm/create-rule-from-transaction/${txn.id}`,{method:'POST'});
      onSave(txn.id,{});/* Trigger reload */
    }catch(e){}
    finally{setRuleCreating(false);setShowRulePrompt(false);}
  };
  const cancel=()=>{setCategory(txn.category_final);setAction(txn.action);setEditing(false);};
  const toggleLock=async()=>{const nl=!locked;await onSave(txn.id,{is_locked:nl});setLocked(nl);};
  const amtClass=txn.action==='Transfer'?'amount-neutral':txn.amount<0?'amount-neg':'amount-pos';
  const typeBadge=(a)=>{const l=(a||'').toLowerCase();return l==='income'?'income':l==='transfer'?'transfer':'expense';};
  const displayAction=txn.action_display||txn.action;
  return(
    <React.Fragment>
    <tr className={rowClass} style={selected?{background:'#eff6ff'}:{}}>
      <td style={{width:28,paddingLeft:12,paddingRight:4,verticalAlign:'middle'}}>
        <input type="checkbox" checked={!!selected} onChange={()=>onToggleSelect(txn.id)} onClick={e=>e.stopPropagation()} style={{cursor:'pointer'}}/>
      </td>
      <td style={{color:'var(--text-secondary)',whiteSpace:'nowrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:4}}>
          {txn.is_split&&<span onClick={()=>setExpanded(!expanded)} style={{cursor:'pointer',display:'inline-block',transition:'transform 0.15s',transform:expanded?'rotate(90deg)':'rotate(0deg)',fontSize:10,color:'var(--text-muted)',userSelect:'none'}}>&#9654;</span>}
          {fmtDate(txn.date)}
        </div>
      </td>
      <td>
        <div style={{fontWeight:500,fontSize:13.5}}>{txn.description_display||txn.description_raw}</div>
        <div style={{display:'flex',gap:6,alignItems:'center',marginTop:2,flexWrap:'wrap'}}>
          {locked&&<span title="Manually edited — protected from sync">🔒</span>}
          {txn.category_confidence<0.8&&!locked&&<span style={{fontSize:11,color:'var(--amber)'}}>{Math.round((txn.category_confidence||0)*100)}% confidence</span>}
          {txn.description_display&&txn.description_display!==txn.description_raw&&<span style={{fontSize:10,color:'var(--text-muted)'}} title={txn.description_raw}>raw: {txn.description_raw.substring(0,30)}{txn.description_raw.length>30?'...':''}</span>}
          {txn.enrichment_source&&txn.enrichment_source!=='rule'&&(()=>{
            const src=txn.enrichment_source;
            const cfg={llm:{bg:'#dbeafe',color:'#1d4ed8',label:'AI'},override:{bg:'#dcfce7',color:'#15803d',label:'saved'},fallback:{bg:'#f3f4f6',color:'var(--text-muted)',label:'fallback'}};
            const c=cfg[src]||cfg.fallback;
            return<span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:c.bg,color:c.color,fontWeight:500,flexShrink:0}} title={`Enriched by: ${src}`}>{c.label}</span>;
          })()}
          {txn.import_source&&txn.import_source!=='plaid'&&(()=>{
            const cfg={csv:{bg:'#fef3c7',color:'#92400e',label:'CSV'},ofx:{bg:'#fef3c7',color:'#92400e',label:'OFX'},manual:{bg:'#f3f4f6',color:'var(--text-muted)',label:'manual'}};
            const c=cfg[txn.import_source]||{bg:'#f3f4f6',color:'var(--text-muted)',label:txn.import_source};
            return<span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:c.bg,color:c.color,fontWeight:500,flexShrink:0}} title={`Source: ${txn.import_source}`}>{c.label}</span>;
          })()}
        </div>
      </td>
      <td><span className={amtClass}>{txn.amount<0?'–':'+'}{fmt(txn.amount)}</span></td>
      <td>
        {editing
          ?<select value={action} onChange={e=>handleTypeChange(e.target.value)} className="filter-select" style={{fontSize:12,padding:'4px 8px'}}>
            {TXN_TYPES.map(a=><option key={a}>{a}</option>)}
          </select>
          :<span className={`badge badge-${typeBadge(displayAction)}`}>{displayAction||'Expense'}</span>
        }
      </td>
      <td>
        {!showCategoryForType(displayAction)
          ?<span style={{color:'#d1d5db',fontSize:13}}>—</span>
          :editing
            ?<select value={category} onChange={e=>setCategory(e.target.value)} className="filter-select" style={{fontSize:12,padding:'4px 8px',width:130}}>
              <option value="">Unclassified</option>
              {sortedCats(categories).map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
            </select>
            :<span className={`badge ${!txn.category_final||txn.category_final==='Unclassified'?'badge-unclassified':'badge-category'}`}>
              {txn.category_final||'Unclassified'}
              {txn.category_manual&&<span style={{marginLeft:4,opacity:0.5}}>✎</span>}
            </span>
        }
      </td>
      <td style={{color:'var(--text-muted)',fontSize:12,maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={txn.account_name}>{txn.account_name}</td>
      <td>
        {editing
          ?<div className="edit-actions">
            <button className="btn btn-sm btn-success" onClick={save} disabled={saving}>{saving?'…':'Save'}</button>
            <button className="btn btn-sm btn-ghost" onClick={cancel}>Cancel</button>
          </div>
          :showRulePrompt
          ?<div className="edit-actions">
            <span style={{fontSize:11,color:'var(--text-muted)'}}>Create rule?</span>
            <button className="btn btn-sm btn-success" onClick={createRuleFromTxn} disabled={ruleCreating} style={{fontSize:11}}>{ruleCreating?'…':'Yes'}</button>
            <button className="btn btn-sm btn-ghost" onClick={()=>setShowRulePrompt(false)} style={{fontSize:11}}>No</button>
          </div>
          :<div className="edit-actions">
            {txn.needs_review&&!locked&&<button className="btn btn-sm" style={{background:'var(--amber)',color:'#fff',border:'none'}} onClick={()=>onReview(txn)}>Review</button>}
            <button className="btn btn-sm btn-secondary" onClick={()=>selected?onBatchEdit():setEditing(true)}>Edit</button>
            <button className="btn btn-sm btn-secondary" onClick={()=>onSplit(txn)} style={{fontSize:11}}>{txn.is_split?'Splits':'Split'}</button>
            {locked&&<button className="btn btn-ghost" style={{padding:'4px 6px',fontSize:13}} onClick={toggleLock} title="Unlock">🔓</button>}
            <button className="btn btn-sm" style={{padding:'4px 8px',fontSize:11,background:gcb?'#fef9c3':'#f3f4f6',color:gcb?'#854d0e':'var(--text-muted)',border:gcb?'1px solid #fde047':'1px solid var(--border)'}}
              onClick={async()=>{const ng=!gcb;await onSave(txn.id,{is_gcb:ng});setGcb(ng);}}
              title={gcb?'Remove GCB tag':'Tag as GCB'}>GCB</button>
          </div>
        }
      </td>
    </tr>
    {expanded&&txn.splits&&txn.splits.map((s,i)=>(
      <tr key={`split-${txn.id}-${i}`} style={{background:'#f9fafb',fontSize:12}}>
        <td></td>
        <td></td>
        <td style={{paddingLeft:28,color:'var(--text-secondary)'}}>{s.description||<span style={{color:'#d1d5db',fontStyle:'italic'}}>—</span>}</td>
        <td><span style={{color:'var(--text-secondary)'}}>{s.amount<0?'–':'+'}{fmt(s.amount)}</span></td>
        <td><span className={`badge badge-${typeBadge(s.action)}`} style={{fontSize:11}}>{s.action||'Expense'}</span></td>
        <td>{s.category?<span className="badge badge-category" style={{fontSize:11}}>{s.category}</span>:<span style={{color:'#d1d5db'}}>—</span>}</td>
        <td></td>
        <td></td>
      </tr>
    ))}
    </React.Fragment>
  );
}

/* Modal for creating manual value-change transactions (Section 2c) */
function ManualTransactionModal({accounts,onClose,onSaved,toast}){
  const[date,setDate]=useState(todayStr());
  const[desc,setDesc]=useState('');
  const[amount,setAmount]=useState('');
  const[action,setAction]=useState('Purchase');
  const[accountId,setAccountId]=useState(accounts[0]?.id||'');
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState('');
  /* Valid manual transaction actions from Section 2c */
  const actions=['Purchase','Sale','Unrealized Gain/Loss','Transfer','Depreciation','Other'];
  const handleSave=async()=>{
    if(!desc||!amount||!accountId){setError('Fill all required fields');return;}
    setSaving(true);setError('');
    try{
      /* Amount sign is caller-controlled: negative = outflow, positive = inflow */
      await apiFetch('/transactions/manual',{method:'POST',body:JSON.stringify({
        date,description:desc,amount:parseFloat(amount),action,account_id:parseInt(accountId)
      })});
      toast('Manual transaction added');onSaved();onClose();
    }catch(e){setError('Failed to save transaction');}
    finally{setSaving(false);}
  };
  return(
    <div className="review-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="review-panel">
        <div style={{fontSize:16,fontWeight:600,marginBottom:16}}>Add Manual Transaction</div>
        {error&&<div style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{error}</div>}
        <div className="review-field"><label>Account *</label>
          <select value={accountId} onChange={e=>setAccountId(e.target.value)}>
            {accounts.map(a=><option key={a.id} value={a.id}>{a.account_name}{a.is_manual?' (Manual)':''}</option>)}
          </select>
        </div>
        <div className="review-field"><label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
        <div className="review-field"><label>Description *</label><input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="e.g. Home value update, Loan payment"/></div>
        <div className="review-field"><label>Amount * (negative = outflow)</label><input type="number" step="0.01" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="-500.00 or 1000.00"/></div>
        <div className="review-field"><label>Action</label>
          <select value={action} onChange={e=>setAction(e.target.value)}>
            {actions.map(a=><option key={a}>{a}</option>)}
          </select>
        </div>
        <div className="review-actions">
          <button className="btn btn-sm btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-sm btn-success" onClick={handleSave} disabled={saving}>{saving?'…':'✓ Save'}</button>
        </div>
      </div>
    </div>
  );
}

/* Inline split editor modal (Section 2E) */
function SplitEditorModal({txn,categories,onClose,onSaved,toast}){
  const[splits,setSplits]=useState([]);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState('');

  useEffect(()=>{
    (async()=>{
      try{const s=await apiFetch(`/transactions/${txn.id}/splits`);
        setSplits(s.length?s:[{amount:txn.amount,description:'',category:txn.category_final||'',action:txn.action||'Expense',is_gcb:false,notes:''}]);
      }catch(e){setSplits([{amount:txn.amount,description:'',category:txn.category_final||'',action:txn.action||'Expense',is_gcb:false,notes:''}]);}
      finally{setLoading(false);}
    })();
  },[txn.id]);

  const addRow=()=>setSplits([...splits,{amount:0,description:'',category:'',action:txn.action||'Expense',is_gcb:false,notes:''}]);
  const removeRow=(i)=>{if(splits.length>1)setSplits(splits.filter((_,j)=>j!==i));};
  const updateRow=(i,field,val)=>{const s=[...splits];s[i]={...s[i],[field]:val};setSplits(s);};

  const total=splits.reduce((s,r)=>s+parseFloat(r.amount||0),0);
  const balanced=Math.abs(Math.round(total*100)-Math.round(txn.amount*100))===0;

  const handleSave=async()=>{
    if(!balanced){setError(`Splits sum to ${total.toFixed(2)}, need ${txn.amount.toFixed(2)}`);return;}
    setSaving(true);setError('');
    try{
      await apiFetch(`/transactions/${txn.id}/splits`,{method:'POST',body:JSON.stringify({splits:splits.map(s=>({
        amount:parseFloat(s.amount),description:s.description,category:s.category,action:s.action||null,is_gcb:!!s.is_gcb,notes:s.notes
      }))})});
      toast('Splits saved');onSaved();onClose();
    }catch(e){setError(e.message||'Failed to save splits');}
    finally{setSaving(false);}
  };

  const handleUnsplit=async()=>{
    try{await apiFetch(`/transactions/${txn.id}/splits`,{method:'DELETE'});toast('Splits removed');onSaved();onClose();}
    catch(e){toast('Failed to remove splits','error');}
  };

  if(loading)return<div className="review-overlay"><div className="review-panel"><div className="spinner"/></div></div>;
  return(
    <div className="review-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="review-panel" style={{maxWidth:700,width:'90vw'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div><div style={{fontSize:16,fontWeight:600}}>Split Transaction</div>
          <div style={{fontSize:13,color:'var(--text-muted)'}}>{txn.description_display||txn.description_raw} · {fmt(txn.amount)}</div></div>
        </div>
        {error&&<div style={{color:'var(--red)',fontSize:13,marginBottom:8}}>{error}</div>}
        <table style={{width:'100%',fontSize:13,marginBottom:12}}><thead><tr>
          <th style={{textAlign:'left',padding:'6px 8px'}}>Amount</th>
          <th style={{textAlign:'left',padding:'6px 8px'}}>Description</th>
          <th style={{textAlign:'left',padding:'6px 8px'}}>Type</th>
          <th style={{textAlign:'left',padding:'6px 8px'}}>Category</th>
          <th style={{textAlign:'center',padding:'6px 8px'}}>GCB</th>
          <th style={{width:32}}></th>
        </tr></thead><tbody>{splits.map((s,i)=>(
          <tr key={i}><td style={{padding:'4px 8px'}}><input type="number" step="0.01" value={s.amount} onChange={e=>updateRow(i,'amount',e.target.value)} style={{width:90,fontSize:13,padding:'4px 6px'}}/></td>
          <td style={{padding:'4px 8px'}}><input value={s.description||''} onChange={e=>updateRow(i,'description',e.target.value)} style={{width:'100%',fontSize:13,padding:'4px 6px'}} placeholder="Optional"/></td>
          <td style={{padding:'4px 8px'}}><select value={s.action||'Expense'} onChange={e=>{updateRow(i,'action',e.target.value);if(!showCategoryForType(e.target.value))updateRow(i,'category','');}} style={{fontSize:12,padding:'4px'}}>
            {TXN_TYPES.map(t=><option key={t}>{t}</option>)}
          </select></td>
          <td style={{padding:'4px 8px'}}>{showCategoryForType(s.action||'Expense')
            ?<select value={s.category||''} onChange={e=>updateRow(i,'category',e.target.value)} style={{fontSize:12,padding:'4px'}}>
              <option value="">Unclassified</option>{sortedCats(categories).map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
            </select>
            :<span style={{color:'#d1d5db',fontSize:12}}>—</span>}
          </td>
          <td style={{textAlign:'center',padding:'4px'}}><input type="checkbox" checked={!!s.is_gcb} onChange={e=>updateRow(i,'is_gcb',e.target.checked)}/></td>
          <td style={{padding:'4px'}}><button className="btn btn-sm btn-ghost" onClick={()=>removeRow(i)} style={{padding:'2px 6px',fontSize:13}}>×</button></td></tr>
        ))}</tbody></table>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <button className="btn btn-sm btn-secondary" onClick={addRow}>+ Add Row</button>
          <div style={{fontSize:13,color:balanced?'var(--green)':'var(--red)',fontWeight:500}}>
            Total: {total.toFixed(2)} / {txn.amount.toFixed(2)} {balanced?'✓':'✗'}
          </div>
        </div>
        <div className="review-actions">
          {txn.is_split&&<button className="btn btn-sm btn-ghost" onClick={handleUnsplit} style={{color:'var(--red)'}}>Remove Splits</button>}
          <button className="btn btn-sm btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-sm btn-success" onClick={handleSave} disabled={saving||!balanced}>{saving?'…':'✓ Save Splits'}</button>
        </div>
      </div>
    </div>
  );
}

/* ── CSV/OFX Import Modal ──────────────────────────────────────────────────── */
function ImportModal({accounts,onClose,onImported,toast}){
  const[accountId,setAccountId]=useState('');
  const[signConvention,setSignConvention]=useState('auto');
  const[file,setFile]=useState(null);
  const[stage,setStage]=useState('upload');   // 'upload' | 'preview' | 'importing' | 'done'
  const[preview,setPreview]=useState(null);
  const[result,setResult]=useState(null);
  const[error,setError]=useState('');

  const runPreview=async()=>{
    if(!file||!accountId){setError('Please select an account and a file.');return;}
    setError('');setStage('preview');setPreview(null);
    const fd=new FormData();
    fd.append('file',file);
    try{
      const res=await fetch(`/api/transactions/import?account_id=${accountId}&sign_convention=${signConvention}&preview_only=true`,{method:'POST',body:fd});
      if(!res.ok){const d=await res.json();throw new Error(d.detail||'Preview failed');}
      setPreview(await res.json());
    }catch(e){setError(e.message);setStage('upload');}
  };

  const runImport=async()=>{
    setStage('importing');setError('');
    const fd=new FormData();
    fd.append('file',file);
    try{
      const res=await fetch(`/api/transactions/import?account_id=${accountId}&sign_convention=${signConvention}&preview_only=false`,{method:'POST',body:fd});
      if(!res.ok){const d=await res.json();throw new Error(d.detail||'Import failed');}
      const r=await res.json();
      setResult(r);setStage('done');
      toast(`Imported ${r.imported} transactions (${r.skipped_duplicates} duplicates skipped)`);
      onImported();
    }catch(e){setError(e.message);setStage('preview');}
  };

  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{maxWidth:640,width:'100%'}}>
        <div className="modal-header">
          <div className="modal-title">Import Transactions</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div style={{padding:'20px 24px'}}>
          {error&&<div style={{color:'var(--red)',fontSize:13,marginBottom:12,padding:'8px 12px',background:'#fef2f2',borderRadius:6}}>{error}</div>}

          {/* ── UPLOAD STAGE ── */}
          {(stage==='upload'||stage==='preview')&&<>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
              <div>
                <label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:4}}>Account</label>
                <select className="filter-select" style={{width:'100%'}} value={accountId} onChange={e=>setAccountId(e.target.value)}>
                  <option value="">— Select account —</option>
                  {accounts.map(a=><option key={a.id} value={a.id}>{a.account_name}{a.mask?` ···${a.mask}`:''}</option>)}
                </select>
              </div>
              <div>
                <label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:4}}>Amount sign</label>
                <select className="filter-select" style={{width:'100%'}} value={signConvention} onChange={e=>setSignConvention(e.target.value)}>
                  <option value="auto">Auto-detect (recommended)</option>
                  <option value="bank">Bank CSV (debits positive)</option>
                  <option value="plaid">Plaid-style (expenses negative)</option>
                </select>
              </div>
            </div>
            <div>
              <label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:4}}>File (CSV or OFX/QFX)</label>
              <input type="file" accept=".csv,.ofx,.qfx" onChange={e=>setFile(e.target.files?.[0]||null)}
                style={{fontSize:13,width:'100%',padding:'6px 0'}}/>
            </div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginTop:8,lineHeight:1.5}}>
              CSV columns auto-detected. Supported: Date, Amount (or Debit/Credit), Description / Name / Memo.<br/>
              OFX/QFX files from most US banks work natively.
            </div>
          </>}

          {/* ── PREVIEW STAGE ── */}
          {stage==='preview'&&!preview&&<div className="loading" style={{padding:24}}><div className="spinner"/><span>Analysing file…</span></div>}
          {stage==='preview'&&preview&&<>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,margin:'16px 0'}}>
              <div style={{textAlign:'center',padding:'12px 8px',background:'var(--bg)',borderRadius:8}}>
                <div style={{fontSize:22,fontWeight:700}}>{preview.total_rows}</div>
                <div style={{fontSize:11,color:'var(--text-muted)'}}>Total rows</div>
              </div>
              <div style={{textAlign:'center',padding:'12px 8px',background:'#f0fdf4',borderRadius:8}}>
                <div style={{fontSize:22,fontWeight:700,color:'var(--green)'}}>{preview.to_import}</div>
                <div style={{fontSize:11,color:'var(--text-muted)'}}>New to import</div>
              </div>
              <div style={{textAlign:'center',padding:'12px 8px',background:'#fafafa',borderRadius:8}}>
                <div style={{fontSize:22,fontWeight:700,color:'var(--text-muted)'}}>{preview.duplicates}</div>
                <div style={{fontSize:11,color:'var(--text-muted)'}}>Duplicates (skip)</div>
              </div>
            </div>
            {preview.sample_rows?.length>0&&<>
              <div style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',marginBottom:6}}>
                Preview (first {Math.min(preview.sample_rows.length,10)} rows)
              </div>
              <div style={{maxHeight:220,overflowY:'auto',border:'1px solid var(--border)',borderRadius:6}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                  <thead><tr style={{background:'var(--bg)'}}>
                    <th style={{padding:'6px 8px',textAlign:'left',fontWeight:600}}>Date</th>
                    <th style={{padding:'6px 8px',textAlign:'left',fontWeight:600}}>Description</th>
                    <th style={{padding:'6px 8px',textAlign:'right',fontWeight:600}}>Amount</th>
                    <th style={{padding:'6px 8px',textAlign:'center',fontWeight:600}}>Status</th>
                  </tr></thead>
                  <tbody>{preview.sample_rows.slice(0,10).map((r,i)=>(
                    <tr key={i} style={{borderTop:'1px solid var(--border)',opacity:r.duplicate?0.45:1}}>
                      <td style={{padding:'5px 8px',color:'var(--text-secondary)'}}>{r.date}</td>
                      <td style={{padding:'5px 8px',maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.description}</td>
                      <td style={{padding:'5px 8px',textAlign:'right',fontFamily:'DM Mono',color:r.amount<0?'var(--red)':'var(--green)'}}>{r.amount<0?'-':'+'}{fmt(Math.abs(r.amount))}</td>
                      <td style={{padding:'5px 8px',textAlign:'center'}}>
                        {r.duplicate
                          ?<span style={{fontSize:10,color:'var(--text-muted)',background:'#f3f4f6',borderRadius:4,padding:'2px 6px'}}>skip</span>
                          :<span style={{fontSize:10,color:'var(--green)',background:'#f0fdf4',borderRadius:4,padding:'2px 6px'}}>new</span>}
                      </td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            </>}
            {preview.to_import===0&&<div style={{color:'var(--amber)',fontSize:13,marginTop:8}}>⚠ All rows are duplicates — nothing will be imported.</div>}
          </>}

          {/* ── IMPORTING ── */}
          {stage==='importing'&&<div className="loading" style={{padding:24}}><div className="spinner"/><span>Importing and categorising…</span></div>}

          {/* ── DONE ── */}
          {stage==='done'&&result&&<div style={{textAlign:'center',padding:'20px 0'}}>
            <div style={{fontSize:32,marginBottom:8}}>✓</div>
            <div style={{fontSize:18,fontWeight:700,color:'var(--green)',marginBottom:4}}>{result.imported} transactions imported</div>
            <div style={{fontSize:13,color:'var(--text-muted)'}}>{result.skipped_duplicates} duplicates skipped · {result.llm_calls} LLM enrichments</div>
          </div>}
        </div>

        {/* Footer buttons */}
        <div style={{padding:'12px 24px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'flex-end',gap:8}}>
          {stage==='upload'&&<>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={runPreview} disabled={!file||!accountId}>Preview →</button>
          </>}
          {stage==='preview'&&preview&&<>
            <button className="btn btn-ghost" onClick={()=>setStage('upload')}>← Back</button>
            <button className="btn btn-primary" onClick={runImport} disabled={preview.to_import===0}>
              Import {preview.to_import} transactions
            </button>
          </>}
          {stage==='done'&&<button className="btn btn-primary" onClick={onClose}>Done</button>}
        </div>
      </div>
    </div>
  );
}

/* ── Batch Edit Modal ────────────────────────────────────────────────────────
   Allows editing Type + Category (and optionally "mark reviewed") across all
   selected transactions in one shot. Leave a field at "— keep —" to skip it. */
function BatchEditModal({count,categories,onSave,onClose}){
  const[action,setAction]=useState('');      // '' = keep existing
  const[category,setCategory]=useState(''); // '' = keep existing
  const[gcbAction,setGcbAction]=useState(''); // '' | 'tag' | 'untag'
  const[markReviewed,setMarkReviewed]=useState(false);
  const[saving,setSaving]=useState(false);
  const save=async()=>{
    const updates={};
    if(action) updates.action=action;
    if(category) updates.category=category;
    if(gcbAction==='tag') updates.is_gcb=true;
    if(gcbAction==='untag') updates.is_gcb=false;
    if(markReviewed) updates.needs_review=false;
    if(!Object.keys(updates).length){toast('No changes selected','error');return;}
    setSaving(true);
    try{await onSave(updates);}
    catch(e){}
    finally{setSaving(false);}
  };
  const label={fontSize:12,fontWeight:600,color:'var(--text-secondary)',marginBottom:4,display:'block'};
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
        <div className="modal-header">
          <h3 style={{margin:0}}>Edit {count} Transaction{count!==1?'s':''}</h3>
          <button className="btn btn-ghost" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:14,padding:'16px 20px'}}>
          <p style={{margin:0,color:'var(--text-muted)',fontSize:13}}>Leave a field at <em>— keep —</em> to leave existing values unchanged.</p>
          <div>
            <label style={label}>Type</label>
            <select value={action} onChange={e=>setAction(e.target.value)} className="filter-select" style={{width:'100%'}}>
              <option value="">— keep existing —</option>
              {TXN_TYPES.map(a=><option key={a}>{a}</option>)}
            </select>
          </div>
          <div>
            <label style={label}>Category</label>
            <select value={category} onChange={e=>setCategory(e.target.value)} className="filter-select" style={{width:'100%'}}>
              <option value="">— keep existing —</option>
              <option value="Unclassified">Unclassified</option>
              {sortedCats(categories).map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
            </select>
          </div>
          <div>
            <label style={label}>GCB Tag</label>
            <select value={gcbAction} onChange={e=>setGcbAction(e.target.value)} className="filter-select" style={{width:'100%'}}>
              <option value="">— keep existing —</option>
              <option value="tag">🟡 Tag as GCB</option>
              <option value="untag">Remove GCB tag</option>
            </select>
          </div>
          <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13}}>
            <input type="checkbox" checked={markReviewed} onChange={e=>setMarkReviewed(e.target.checked)}/>
            Mark all as reviewed
          </label>
        </div>
        <div className="modal-footer" style={{display:'flex',justifyContent:'flex-end',gap:8,padding:'12px 20px',borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={save} disabled={saving}>
            {saving?'Saving…':`Apply to ${count} transaction${count!==1?'s':''}`}
          </button>
        </div>
      </div>
    </div>
  );
}

function TransactionsPage({categories,toast}){
  const[txns,setTxns]=useState([]);
  const[loading,setLoading]=useState(true);
  const[search,setSearch]=useState('');
  const[needsReview,setNeedsReview]=useState(false);
  const[startDate,setStartDate]=useState('');
  const[endDate,setEndDate]=useState('');
  const[catFilter,setCatFilter]=useState('');
  const[actionFilter,setActionFilter]=useState('');
  const[reviewTxn,setReviewTxn]=useState(null);
  const[showManual,setShowManual]=useState(false);
  const[splitTxn,setSplitTxn]=useState(null);
  const[accounts,setAccounts]=useState([]);
  const[accountFilter,setAccountFilter]=useState('');
  const[showImport,setShowImport]=useState(false);
  const[enrichJob,setEnrichJob]=useState(null); // {job_id,status,processed,total,llm_calls,override_hits,errors}
  const[selectedIds,setSelectedIds]=useState(new Set());
  const[showBatchEdit,setShowBatchEdit]=useState(false);
  const[showDupes,setShowDupes]=useState(false);

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      let q='?limit=500';
      if(needsReview)q+='&needs_review=true';
      if(startDate)q+=`&start_date=${startDate}`;
      if(endDate)q+=`&end_date=${endDate}`;
      if(accountFilter)q+=`&account_id=${accountFilter}`;
      const[t,a]=await Promise.all([apiFetch(`/transactions${q}`),apiFetch('/accounts')]);
      setTxns(t);setAccounts(a);
    }catch(e){toast('Failed to load','error');}
    finally{setLoading(false);}
  },[needsReview,startDate,endDate,accountFilter]);

  useEffect(()=>{load();},[load]);

  /* Preserve scroll position after save (Section 2C) */
  const handleSave=async(id,updates)=>{
    const scrollY=window.scrollY;
    try{await apiFetch(`/transactions/${id}`,{method:'PATCH',body:JSON.stringify(updates)});await load();toast('Saved');requestAnimationFrame(()=>window.scrollTo(0,scrollY));}
    catch(e){toast('Failed to save','error');}
  };
  const handleIgnore=async(id)=>{await handleSave(id,{needs_review:false});toast('Ignored');};

  /* ── Multi-select helpers ─────────────────────────────────────── */
  const toggleSelect=(id)=>setSelectedIds(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const selectAll=()=>setSelectedIds(new Set(visible.map(t=>t.id)));
  const handleBatchSave=async(updates)=>{
    const count=selectedIds.size;
    try{
      await apiFetch('/transactions/batch-update',{method:'POST',body:JSON.stringify({ids:[...selectedIds],updates})});
      await load();
      setSelectedIds(new Set());setShowBatchEdit(false);
      toast(`Updated ${count} transaction${count!==1?'s':''}`);
    }catch(e){toast('Batch update failed: '+e.message,'error');}
  };
  /* Clear selection whenever the visible set changes (filter applied) */
  useEffect(()=>{setSelectedIds(new Set());},[search,catFilter,actionFilter,needsReview,accountFilter,startDate,endDate,showDupes]);

  /* Section 4A: Filter CC payment credits on the credit-card side (structural, not keyword-based).
     A CC payment shows up twice: once as a debit on the checking account (keep) and once as a
     positive Transfer on the credit card account (hide by default — it's the duplicate).
     Refunds/credits are NOT Transfers so they pass through unaffected. */
  const isCCPaymentDuplicate=(t)=>{
    if(t.action!=='Transfer'||t.amount<=0)return false;
    const type=(t.account_type||'').toLowerCase();
    return type==='credit'||type==='credit card';
  };

  let visible=txns;
  if(!showDupes)visible=visible.filter(t=>!isCCPaymentDuplicate(t));
  if(search)visible=visible.filter(t=>(t.description_display||t.description_raw||'').toLowerCase().includes(search.toLowerCase())||t.description_raw?.toLowerCase().includes(search.toLowerCase()));
  if(catFilter)visible=visible.filter(t=>t.category_final===catFilter);
  if(actionFilter)visible=visible.filter(t=>t.action===actionFilter);

  const exportCSV=()=>{
    const h=['Date','Description','Amount','Type','Category','Account'];
    const rows=visible.map(t=>[fmtDate(t.date),t.description_display||t.description_raw,t.amount,t.action,t.category_final,t.account_name]);
    const csv=[h,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='transactions.csv';a.click();
  };

  /* Batch LLM enrichment — starts a background job, polls until done */
  const startEnrich=async()=>{
    try{
      const r=await apiFetch('/llm/enrich-transactions',{method:'POST',body:JSON.stringify({limit:300,overwrite_existing:false})});
      setEnrichJob({job_id:r.job_id,status:'running',processed:0,total:0,llm_calls:0,override_hits:0,errors:0});
    }catch(e){toast('Failed to start enrichment: '+e.message,'error');}
  };

  /* Poll job status every 2s while running */
  useEffect(()=>{
    if(!enrichJob||enrichJob.status!=='running')return;
    const id=setInterval(async()=>{
      try{
        const s=await apiFetch(`/llm/enrich-status/${enrichJob.job_id}`);
        setEnrichJob(s);
        if(s.status==='done'||s.status==='error'){
          clearInterval(id);
          if(s.status==='done'){load();toast(`Enriched ${s.processed} transactions`);}
          else toast('Enrichment failed: '+(s.error||'unknown error'),'error');
        }
      }catch(e){clearInterval(id);}
    },2000);
    return()=>clearInterval(id);
  },[enrichJob?.job_id,enrichJob?.status]);

  return(
    <div>
      {reviewTxn&&<ReviewModal txn={reviewTxn} categories={categories} onSave={handleSave} onDiscard={()=>setReviewTxn(null)} onIgnore={handleIgnore} onClose={()=>setReviewTxn(null)}/>}
      {showManual&&<ManualTransactionModal accounts={accounts} onClose={()=>setShowManual(false)} onSaved={load} toast={toast}/>}
      {splitTxn&&<SplitEditorModal txn={splitTxn} categories={categories} onClose={()=>setSplitTxn(null)} onSaved={load} toast={toast}/>}
      {showImport&&<ImportModal accounts={accounts} onClose={()=>setShowImport(false)} onImported={load} toast={toast}/>}
      {showBatchEdit&&<BatchEditModal count={selectedIds.size} categories={categories} onSave={handleBatchSave} onClose={()=>setShowBatchEdit(false)}/>}
      <div className="card">
        <div className="filters">
          <input className="search-input" placeholder="Search descriptions…" value={search} onChange={e=>setSearch(e.target.value)}/>
          <select className="filter-select" value={actionFilter} onChange={e=>setActionFilter(e.target.value)}>
            <option value="">All types</option>
            {TXN_TYPES.map(a=><option key={a}>{a}</option>)}
          </select>
          <select className="filter-select" value={catFilter} onChange={e=>setCatFilter(e.target.value)}>
            <option value="">All categories</option>
            {sortedCats(categories).map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          <select className="filter-select" value={accountFilter} onChange={e=>setAccountFilter(e.target.value)}>
            <option value="">All accounts</option>
            {accounts.map(a=><option key={a.id} value={a.id}>{a.account_name}{a.is_manual?' (Manual)':''}</option>)}
          </select>
          <label className="filter-label"><input type="checkbox" checked={needsReview} onChange={e=>setNeedsReview(e.target.checked)}/> Needs review</label>
          <label className="filter-label" title="CC payments appear on both the checking account (kept) and the credit card account (hidden by default)"><input type="checkbox" checked={showDupes} onChange={e=>setShowDupes(e.target.checked)}/> Show CC payment credits</label>
          <input type="date" className="date-input" value={startDate} onChange={e=>setStartDate(e.target.value)}/>
          <span style={{color:'var(--text-muted)',fontSize:13}}>→</span>
          <input type="date" className="date-input" value={endDate} onChange={e=>setEndDate(e.target.value)}/>
          {(startDate||endDate||search||catFilter||actionFilter||needsReview||accountFilter)&&
            <button className="btn btn-sm btn-ghost" onClick={()=>{setSearch('');setCatFilter('');setActionFilter('');setStartDate('');setEndDate('');setNeedsReview(false);setAccountFilter('');}}>Clear</button>}
          <span className="filter-count">{visible.length} transactions</span>
          {visible.length>0&&<button className="btn btn-sm btn-ghost" onClick={selectAll} title="Select all visible transactions">☑ Select All</button>}
          <button className="btn btn-sm btn-primary" onClick={()=>setShowManual(true)}>+ Manual</button>
          <button className="btn btn-sm btn-secondary" onClick={()=>setShowImport(true)}>↑ Import</button>
          <button className="btn btn-sm btn-secondary" onClick={exportCSV}>↓ CSV</button>
          <button className="btn btn-sm btn-secondary" onClick={startEnrich} disabled={enrichJob?.status==='running'} title="Run AI enrichment on unclassified transactions">{enrichJob?.status==='running'?'Enriching…':'✨ Enrich'}</button>
        </div>
        {enrichJob&&(
          <div style={{padding:'8px 16px',background:enrichJob.status==='done'?'#dcfce7':enrichJob.status==='error'?'#fee2e2':'#eff6ff',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,fontSize:13}}>
            {enrichJob.status==='running'&&<div className="spinner" style={{width:14,height:14,flexShrink:0}}/>}
            {enrichJob.status==='done'&&<span style={{color:'#15803d',fontWeight:600}}>✓</span>}
            {enrichJob.status==='error'&&<span style={{color:'#dc2626',fontWeight:600}}>✗</span>}
            <span>
              {enrichJob.status==='running'&&`Enriching… ${enrichJob.processed}/${enrichJob.total||'?'} transactions`}
              {enrichJob.status==='done'&&`Enrichment complete — ${enrichJob.processed} enriched · ${enrichJob.llm_calls} AI calls · ${enrichJob.override_hits} from saved rules`}
              {enrichJob.status==='error'&&`Enrichment failed: ${enrichJob.error||'unknown error'}`}
            </span>
            {enrichJob.status==='running'&&enrichJob.last&&<span style={{color:'var(--text-muted)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:200}}>last: {enrichJob.last.merchant||enrichJob.last.raw}</span>}
            {(enrichJob.status==='done'||enrichJob.status==='error')&&<button className="btn btn-sm btn-ghost" style={{marginLeft:'auto'}} onClick={()=>setEnrichJob(null)}>Dismiss</button>}
          </div>
        )}
        {selectedIds.size>0&&(
          <div style={{padding:'8px 16px',background:'#eff6ff',borderBottom:'1px solid #bfdbfe',display:'flex',alignItems:'center',gap:10,fontSize:13}}>
            <span style={{fontWeight:600,color:'#1d4ed8'}}>{selectedIds.size} selected</span>
            <button className="btn btn-sm btn-primary" onClick={()=>setShowBatchEdit(true)}>✎ Edit Selected</button>
            <button className="btn btn-sm btn-ghost" onClick={()=>setSelectedIds(new Set())}>✕ Deselect All</button>
          </div>
        )}
        {loading?<div className="loading"><div className="spinner"/><span>Loading…</span></div>
          :visible.length===0?<div className="empty"><div className="empty-icon">◎</div><span>No transactions found</span></div>
          :<div className="table-wrap"><table>
            <thead><tr>
              <th style={{width:28,paddingLeft:12,paddingRight:4}}>
                <input type="checkbox" title="Select / deselect all visible"
                  checked={visible.length>0&&visible.every(t=>selectedIds.has(t.id))}
                  onChange={e=>e.target.checked?selectAll():setSelectedIds(new Set())}
                  style={{cursor:'pointer'}}/>
              </th>
              <th>Date</th><th>Description</th><th>Amount</th><th>Type</th><th>Category</th><th>Account</th><th>Actions</th>
            </tr></thead>
            <tbody>{visible.map(t=><TxnRow key={t.id} txn={t} categories={categories} onSave={handleSave} onReview={setReviewTxn} onSplit={setSplitTxn} selected={selectedIds.has(t.id)} onToggleSelect={toggleSelect} onBatchEdit={()=>setShowBatchEdit(true)}/>)}</tbody>
          </table></div>
        }
      </div>
    </div>
  );
}

function DashboardPage({categories,toast}){
  const[stats,setStats]=useState(null);
  const[recent,setRecent]=useState([]);
  const[reviewQ,setReviewQ]=useState([]);
  const[netWorth,setNetWorth]=useState(null);
  const[topCats,setTopCats]=useState([]);
  const[period,setPeriod]=useState('month');
  const[reviewTxn,setReviewTxn]=useState(null);
  const[loading,setLoading]=useState(true);

  const getDates=()=>{
    const now=new Date();
    if(period==='month')return{start:monthStart(),end:todayStr()};
    if(period==='ytd')return{start:`${now.getFullYear()}-01-01`,end:todayStr()};
    if(period==='last30'){const d=new Date();d.setDate(d.getDate()-30);return{start:d.toISOString().slice(0,10),end:todayStr()};}
    return{start:'',end:''};
  };

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const{start,end}=getDates();
      const statsQ=`/stats${start?`?start_date=${start}`:''}${end?(start?`&end_date=${end}`:`?end_date=${end}`):''}`;
      const[s,r,rv,nw]=await Promise.all([
        apiFetch(statsQ),
        apiFetch(`/transactions?limit=5${start?`&start_date=${start}`:''}${end?`&end_date=${end}`:''}`),
        apiFetch('/transactions?needs_review=true&limit=10'),
        apiFetch('/net-worth').catch(()=>null),
      ]);
      setStats(s);setRecent(r);setReviewQ(rv);setNetWorth(nw);

      /* Top 5 expense categories */
      const byCat=s?.by_category||{};
      const sorted=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
      setTopCats(sorted);
    }catch(e){toast('Failed to load','error');}
    finally{setLoading(false);}
  },[period]);

  useEffect(()=>{load();},[load]);

  const handleSave=async(id,updates)=>{
    try{await apiFetch(`/transactions/${id}`,{method:'PATCH',body:JSON.stringify(updates)});await load();toast('Saved');}
    catch(e){toast('Failed','error');}
  };
  const handleIgnore=async(id)=>{await handleSave(id,{needs_review:false});toast('Ignored');};

  if(loading)return<div className="loading"><div className="spinner"/><span>Loading…</span></div>;

  const income=stats?.total_income??0;
  const expenses=stats?.total_expenses??0;
  const hr=new Date().getHours();
  const greeting=hr<12?'morning':hr<17?'afternoon':'evening';

  return(
    <div>
      {reviewTxn&&<ReviewModal txn={reviewTxn} categories={categories} onSave={handleSave} onDiscard={()=>setReviewTxn(null)} onIgnore={handleIgnore} onClose={()=>setReviewTxn(null)}/>}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div>
          <h2 style={{fontSize:18,fontWeight:600}}>Good {greeting}</h2>
          <p style={{fontSize:13,color:'var(--text-muted)',marginTop:2}}>Here's your financial overview</p>
        </div>
        <div style={{display:'flex',gap:6,background:'var(--card-bg)',border:'1px solid var(--border)',borderRadius:10,padding:4}}>
          {[['month','This Month'],['last30','Last 30 Days'],['ytd','Year to Date']].map(([v,l])=>(
            <button key={v} className={`btn btn-sm ${period===v?'btn-primary':'btn-ghost'}`} onClick={()=>setPeriod(v)} style={{borderRadius:7}}>{l}</button>
          ))}
        </div>
      </div>

      {/* KPI row 1: Cash flow */}
      <div className="metric-grid">
        <div className="card metric-card">
          <div className="metric-label">Total Income</div>
          <div className="metric-value" style={{color:'var(--green)'}}>{fmt(income)}</div>
        </div>
        <div className="card metric-card">
          <div className="metric-label">Total Expenses</div>
          <div className="metric-value" style={{color:'var(--red)'}}>-{fmt(expenses)}</div>
        </div>
        <div className="card metric-card">
          <div className="metric-label">Net Cash Flow</div>
          <div className="metric-value" style={{color:(income-expenses)>=0?'var(--green)':'var(--red)'}}>{income-expenses>=0?'+':''}{fmt(income-expenses)}</div>
        </div>
        <div className="card metric-card">
          <div className="metric-label">Net Worth</div>
          <div className="metric-value" style={{color:netWorth&&netWorth.net_worth>=0?'var(--green)':'var(--red)'}}>{netWorth?fmt(netWorth.net_worth):'—'}</div>
        </div>
      </div>

      <div className="dash-grid">
        <div style={{display:'flex',flexDirection:'column',gap:20}}>
          {/* Recent transactions */}
          <div className="card">
            <div className="section-header"><div className="section-title">Recent Transactions</div></div>
            {recent.length===0?<div className="empty"><div className="empty-icon">◎</div><span>No transactions yet</span></div>
              :<table style={{width:'100%'}}><tbody>{recent.map(t=>(
                <tr key={t.id} style={{borderBottom:'1px solid #f3f4f6'}}>
                  <td style={{padding:'11px 16px',color:'var(--text-muted)',fontSize:12,whiteSpace:'nowrap'}}>{fmtDate(t.date)}</td>
                  <td style={{padding:'11px 8px',fontSize:13.5,fontWeight:500}}>{t.description_display||t.description_raw}</td>
                  <td style={{padding:'11px 16px',textAlign:'right',whiteSpace:'nowrap'}}>
                    <span className={t.action==='Transfer'?'amount-neutral':t.amount<0?'amount-neg':'amount-pos'}>{t.amount<0?'-':'+'}{fmt(t.amount)}</span>
                  </td>
                  <td style={{padding:'11px 16px'}}>
                    {showCategoryForType(t.action)&&<span className={`badge ${!t.category_final||t.category_final==='Unclassified'?'badge-unclassified':'badge-category'}`} style={{fontSize:11}}>{t.category_final||'Unclassified'}</span>}
                  </td>
                  <td style={{padding:'11px 12px',fontSize:11,color:'var(--text-muted)',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={t.account_name}>{t.account_name}</td>
                </tr>
              ))}</tbody></table>
            }
          </div>

          {/* Top 5 expense categories */}
          {topCats.length>0&&<div className="card">
            <div className="section-header"><div className="section-title">Top Expense Categories</div></div>
            <div style={{padding:'8px 0'}}>{topCats.map(([cat,amt],i)=>{
              const maxAmt=topCats[0][1]||1;
              const pct=Math.round(amt/maxAmt*100);
              return(
                <div key={cat} style={{padding:'8px 18px',display:'flex',alignItems:'center',gap:12}}>
                  <span style={{width:20,textAlign:'right',fontSize:12,color:'var(--text-muted)',fontWeight:600}}>{i+1}</span>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                      <span style={{fontSize:13,fontWeight:500}}>{cat}</span>
                      <span style={{fontFamily:'DM Mono',fontSize:12,color:'var(--red)'}}>{fmt(amt)}</span>
                    </div>
                    <div style={{background:'#f3f4f6',borderRadius:3,height:5,overflow:'hidden'}}>
                      <div style={{width:`${pct}%`,height:'100%',background:'var(--red)',borderRadius:3,opacity:0.7}}/>
                    </div>
                  </div>
                </div>
              );
            })}</div>
          </div>}
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:20}}>
          {/* Review queue */}
          <div className="card">
            <div className="section-header">
              <div className="section-title">Needs Review</div>
              {reviewQ.length>0&&<span className="badge" style={{background:'#fef3c7',color:'#92400e'}}>{reviewQ.length}</span>}
            </div>
            {reviewQ.length===0
              ?<div className="empty" style={{padding:40}}><div className="empty-icon">✓</div><span style={{fontSize:13}}>All caught up!</span></div>
              :<div>{reviewQ.map(t=>(
                <div key={t.id} style={{padding:'12px 16px',borderBottom:'1px solid #f3f4f6',display:'flex',alignItems:'center',gap:10}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.description_display||t.description_raw}</div>
                    <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{fmtDate(t.date)}</div>
                  </div>
                  <div style={{fontSize:13,fontFamily:'DM Mono',color:t.amount<0?'var(--red)':'var(--green)',whiteSpace:'nowrap'}}>{t.amount<0?'-':'+'}{fmt(t.amount)}</div>
                  <button className="btn btn-sm" style={{background:'var(--amber)',color:'#fff',border:'none',flexShrink:0}} onClick={()=>setReviewTxn(t)}>Review</button>
                </div>
              ))}</div>
            }
          </div>

          {/* Quick net worth breakdown */}
          {netWorth&&<div className="card">
            <div className="section-header"><div className="section-title">Net Worth Summary</div></div>
            {Object.entries(netWorth.buckets||{}).map(([bucket,bData])=>{
              const total=bData.accounts.reduce((s,a)=>s+(bData.is_asset?a.balance:Math.abs(a.balance)),0);
              return(
                <div key={bucket} style={{padding:'10px 18px',borderBottom:'1px solid #f3f4f6',display:'flex',justifyContent:'space-between'}}>
                  <span style={{fontSize:13,fontWeight:500}}>{bucket}</span>
                  <span style={{fontFamily:'DM Mono',fontSize:12,fontWeight:500,color:bData.is_asset?'var(--green)':'var(--red)'}}>{bData.is_asset?'':'-'}{fmt(total)}</span>
                </div>
              );
            })}
          </div>}
        </div>
      </div>
    </div>
  );
}

/* Modal for creating a manual account (Section 2b) */
function ManualAccountModal({onClose,onSaved,toast}){
  const[name,setName]=useState('');
  const[type,setType]=useState('checking');
  const[balance,setBalance]=useState('0');
  const[startDate,setStartDate]=useState(todayStr());
  const[notes,setNotes]=useState('');
  const[saving,setSaving]=useState(false);
  const[error,setError]=useState('');
  const handleSave=async()=>{
    if(!name){setError('Account name is required');return;}
    setSaving(true);setError('');
    try{
      /* POST /api/accounts — creates manual account with starting balance */
      await apiFetch('/accounts',{method:'POST',body:JSON.stringify({name,account_type:type,starting_balance:parseFloat(balance)||0,start_date:startDate,notes:notes||null})});
      toast('Manual account created');onSaved();onClose();
    }catch(e){setError('Failed to create account');}
    finally{setSaving(false);}
  };
  return(
    <div className="review-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="review-panel">
        <div style={{fontSize:16,fontWeight:600,marginBottom:16}}>Add Manual Account</div>
        {error&&<div style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{error}</div>}
        <div className="review-field"><label>Account Name *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Home, Vehicle, Cash"/></div>
        <div className="review-field"><label>Account Type</label>
          <select value={type} onChange={e=>setType(e.target.value)}>
            {/* All valid types from Section 1 bucket mapping */}
            {['checking','savings','investment','real_estate','vehicle','business_owned','other','credit','loan'].map(t=><option key={t} value={t}>{t.replace(/_/g,' ')}</option>)}
          </select>
        </div>
        <div className="review-field"><label>Starting Balance ($)</label><input type="number" step="0.01" value={balance} onChange={e=>setBalance(e.target.value)} placeholder="0.00"/></div>
        <div className="review-field"><label>Start Date</label><input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)}/></div>
        <div className="review-field"><label>Notes</label><input value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional"/></div>
        <div className="review-actions">
          <button className="btn btn-sm btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-sm btn-success" onClick={handleSave} disabled={saving}>{saving?'…':'✓ Create'}</button>
        </div>
      </div>
    </div>
  );
}

/* ── Merge Account Modal ─────────────────────────────────────────────────────
   Reassigns all transactions from the source account into a chosen target,
   then deletes the source. Used to clean up duplicate accounts. */
function MergeAccountModal({source,allAccounts,onDone,onClose}){
  const others=allAccounts.filter(a=>a.id!==source.id);
  const[targetId,setTargetId]=useState('');
  const[busy,setBusy]=useState(false);
  const target=others.find(a=>a.id===parseInt(targetId));
  const doMerge=async()=>{
    if(!targetId)return;
    setBusy(true);
    try{
      const r=await apiFetch(`/accounts/${source.id}/merge-into/${targetId}`,{method:'POST'});
      onDone(`Merged — ${r.transactions_moved} transactions moved to "${target?.account_name}"`);
    }catch(e){onDone(null,'Merge failed: '+(e.message||'error'));}
    finally{setBusy(false);}
  };
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content" onClick={e=>e.stopPropagation()} style={{maxWidth:440}}>
        <div className="modal-header">
          <h3 style={{margin:0}}>Merge Account</h3>
          <button className="btn btn-ghost" onClick={onClose}>✕</button>
        </div>
        <div style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:14}}>
          <p style={{margin:0,fontSize:13,color:'var(--text-muted)'}}>
            All transactions from <strong>{source.account_name}</strong> ({source.transaction_count} txns) will be moved to the account you select below. The source account will then be deleted.
          </p>
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'var(--text-secondary)',marginBottom:4,display:'block'}}>Move into</label>
            <select value={targetId} onChange={e=>setTargetId(e.target.value)} className="filter-select" style={{width:'100%'}}>
              <option value="">— select target account —</option>
              {others.map(a=><option key={a.id} value={a.id}>{a.account_name} ({a.transaction_count} txns)</option>)}
            </select>
          </div>
          {target&&<p style={{margin:0,fontSize:12,background:'#fffbeb',border:'1px solid #fde68a',borderRadius:6,padding:'8px 12px',color:'#92400e'}}>
            ⚠ <strong>{source.account_name}</strong> will be permanently deleted after the merge.
          </p>}
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8,padding:'12px 20px',borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={doMerge} disabled={!targetId||busy}>{busy?'Merging…':'Merge & Delete Source'}</button>
        </div>
      </div>
    </div>
  );
}

/* ── Delete Account Modal ────────────────────────────────────────────────────
   Permanently deletes an account and all its transactions. */
function DeleteAccountModal({account,onDone,onClose}){
  const[busy,setBusy]=useState(false);
  const doDelete=async()=>{
    setBusy(true);
    try{
      const r=await apiFetch(`/accounts/${account.id}`,{method:'DELETE'});
      onDone(`Deleted "${account.account_name}" and ${r.transactions_deleted} transactions`);
    }catch(e){onDone(null,'Delete failed: '+(e.message||'error'));}
    finally{setBusy(false);}
  };
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
        <div className="modal-header">
          <h3 style={{margin:0,color:'var(--red)'}}>Delete Account</h3>
          <button className="btn btn-ghost" onClick={onClose}>✕</button>
        </div>
        <div style={{padding:'16px 20px'}}>
          <p style={{margin:'0 0 12px',fontSize:13}}>This will permanently delete:</p>
          <ul style={{margin:'0 0 16px',paddingLeft:20,fontSize:13,lineHeight:1.7}}>
            <li><strong>{account.account_name}</strong></li>
            <li><strong>{account.transaction_count} transaction{account.transaction_count!==1?'s':''}</strong></li>
          </ul>
          <p style={{margin:0,fontSize:13,color:'var(--red)',fontWeight:600}}>This cannot be undone.</p>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8,padding:'12px 20px',borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-sm" style={{background:'var(--red)',color:'#fff',border:'none',padding:'6px 14px'}} onClick={doDelete} disabled={busy}>{busy?'Deleting…':'Delete Permanently'}</button>
        </div>
      </div>
    </div>
  );
}

/* AccountRow is a top-level component so React never remounts it on parent
   re-renders (same fix as LoanForm — defining it inside AccountsPage would
   create a new function reference each render, causing React to unmount/remount
   the row and swallow click events before modals can open). */
function AccountRow({a,showPlaidActions,editingId,editVals,setEditVals,onSave,onCancel,onStartEdit,onSever,onMerge,onDelete}){
  const isEditing=editingId===a.id;
  return(
    <div style={{padding:'14px 20px',borderBottom:'1px solid #f3f4f6',display:'flex',alignItems:'center',gap:12}}>
      <span style={{width:7,height:7,borderRadius:'50%',background:a.is_manual?(a.is_asset?'var(--blue)':'var(--red)'):'#22c55e',flexShrink:0}}/>
      <div style={{flex:1}}>
        {isEditing?<>
          <input value={editVals.account_name} onChange={e=>setEditVals(v=>({...v,account_name:e.target.value}))} style={{fontSize:14,fontWeight:500,border:'1px solid var(--border)',borderRadius:6,padding:'4px 8px',width:'100%',marginBottom:4}}/>
          <input value={editVals.notes} onChange={e=>setEditVals(v=>({...v,notes:e.target.value}))} placeholder="Notes (optional)" style={{fontSize:12,border:'1px solid var(--border)',borderRadius:6,padding:'3px 8px',width:'100%',color:'var(--text-muted)'}}/>
        </>:<>
          <div style={{fontSize:14,fontWeight:500}}>{a.account_name}</div>
          <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>
            {a.account_type}{a.mask?` ····${a.mask}`:''}{a.bucket?` · ${a.bucket}`:''}{a.notes?` · ${a.notes}`:''}
          </div>
        </>}
      </div>
      {!a.is_manual&&<span className="bank-badge">● Connected</span>}
      {a.is_manual&&<span style={{fontFamily:'DM Mono',fontSize:13,fontWeight:500,color:a.is_liability?'var(--red)':'var(--green)'}}>{fmt(a.starting_balance||0)}</span>}
      <span style={{fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap'}}>{a.transaction_count} txns</span>
      <div style={{display:'flex',gap:6,flexShrink:0}}>
        {isEditing?<>
          <button className="btn btn-sm btn-success" onClick={()=>onSave(a.id)}>Save</button>
          <button className="btn btn-sm btn-ghost" onClick={onCancel}>Cancel</button>
        </>:<>
          <button className="btn btn-sm btn-secondary" onClick={()=>onStartEdit(a)}>Edit</button>
          {showPlaidActions&&<button className="btn btn-sm" style={{background:'#fff7ed',color:'#c2410c',border:'1px solid #fed7aa',fontSize:11}} onClick={()=>onSever(a)}>Sever</button>}
          <button className="btn btn-sm" style={{background:'#eff6ff',color:'#1d4ed8',border:'1px solid #bfdbfe',fontSize:11}} onClick={()=>onMerge(a)}>Merge →</button>
          <button className="btn btn-sm" style={{background:'#fef2f2',color:'var(--red)',border:'1px solid #fecaca',fontSize:11}} onClick={()=>onDelete(a)}>Delete</button>
        </>}
      </div>
    </div>
  );
}

function AccountsPage({banks,onConnectBank,onSync,toast}){
  const[accounts,setAccounts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[showManual,setShowManual]=useState(false);
  const[editingId,setEditingId]=useState(null);
  const[editVals,setEditVals]=useState({});
  const[mergeAccount,setMergeAccount]=useState(null);
  const[deleteAccount,setDeleteAccount]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);
    try{setAccounts(await apiFetch('/accounts'));}catch(e){}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[load]);

  const plaidAccounts=accounts.filter(a=>!a.is_manual);
  const manualAccounts=accounts.filter(a=>a.is_manual);
