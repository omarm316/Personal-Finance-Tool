      rows.push({cat:matched,values});
    }
    setParsedRows(rows);setParseErrors(errs);
  };
  const confirmPaste=async()=>{
    if(!parsedRows||parsedRows.length===0)return;
    setPasteSaving(true);
    try{
      const bulk=[];
      parsedRows.forEach(({cat,values})=>{values.forEach((v,i)=>{if(v!=null)bulk.push({year,month:i+1,category:cat,amount:v});});});
      await apiFetch('/budget/targets/bulk',{method:'POST',body:JSON.stringify({targets:bulk})});
      toast(`✓ Imported ${bulk.length} budget targets`);
      setPasteModal(false);setPasteText('');setParsedRows(null);setParseErrors([]);
      await load();
    }catch(e){toast('Failed to import','error');}
    finally{setPasteSaving(false);}
  };
  const closePasteModal=()=>{setPasteModal(false);setPasteText('');setParsedRows(null);setParseErrors([]);};

  /* ── KPI values for selected month ───────────────────────────────────────── */
  const monthIncomeBudget=allIncomeCats.reduce((s,c)=>s+getBudget(c,month),0);
  const monthIncomeActual=allIncomeCats.reduce((s,c)=>s+getActual(c,month),0);
  const monthExpenseBudget=allExpenseCats.reduce((s,c)=>s+getBudget(c,month),0);
  const monthExpenseActual=allExpenseCats.reduce((s,c)=>s+getActual(c,month),0);
  const monthNetBudget=monthIncomeBudget-monthExpenseBudget;
  const monthNetActual=monthIncomeActual-monthExpenseActual;

  /* ── Annual KPI ────────────────────────────────────────────────────────── */
  const annualIncomeBudget=(()=>{let s=0;for(let m=1;m<=12;m++)s+=allIncomeCats.reduce((a,c)=>a+getBudget(c,m),0);return s;})();
  const annualIncomeActual=(()=>{let s=0;for(let m=1;m<=12;m++)s+=allIncomeCats.reduce((a,c)=>a+getActual(c,m),0);return s;})();
  const annualExpenseBudget=(()=>{let s=0;for(let m=1;m<=12;m++)s+=allExpenseCats.reduce((a,c)=>a+getBudget(c,m),0);return s;})();
  const annualExpenseActual=(()=>{let s=0;for(let m=1;m<=12;m++)s+=allExpenseCats.reduce((a,c)=>a+getActual(c,m),0);return s;})();

  /* ── Month View: P&L row renderer ─────────────────────────────────────── */
  const renderPLRow=(cat,isIncome,isEditing)=>{
    const budget=getBudget(cat,month);
    const actual=getActual(cat,month);
    const variance=isIncome?(actual-budget):(budget-actual); // positive = good
    const pct=budget>0?Math.min(actual/budget,1):0;
    const over=budget>0&&actual>budget;
    const barColor=isIncome?'var(--green)':(over?'var(--red)':'var(--gold)');
    const varColor=variance>0?'var(--green)':(variance<0?'var(--red)':'var(--text-muted)');
    const editVal=edits[cat]?.[String(month)]||'';
    const suggestion=suggestions[cat];
    const actualColor=over?'var(--red)':isIncome?'var(--green)':'var(--text-primary)';

    if(!isEditing&&budget===0&&actual===0) return null;

    /* Mobile: Category | Budget | Actual | Remaining (no progress bar) */
    if(isMob&&!isEditing) return(
      <tr key={cat} style={{borderBottom:'1px solid var(--border)'}}>
        <td style={{fontWeight:400,fontSize:12.5,paddingLeft:10,paddingRight:4,paddingTop:6,paddingBottom:6,color:'var(--text-primary)'}}>{cat}</td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:300,padding:'6px 5px',color:'var(--text-secondary)',minWidth:58}}>{budget>0?fmtRound(budget):'—'}</td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:300,padding:'6px 5px',minWidth:58}}>
          {actual!==0?<span style={{color:actualColor,fontWeight:400}}>{fmtRound(actual)}</span>:'—'}
        </td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:300,padding:'6px 8px',minWidth:58,color:budget>0?(variance>0?'var(--green)':variance<0?'var(--red)':'var(--text-muted)'):'var(--text-muted)'}}>
          {budget>0?((variance>0?'+':'')+fmtRound(variance)):'—'}
        </td>
      </tr>
    );

    return(
      <tr key={cat} style={{borderBottom:'1px solid var(--border)'}}>
        <td style={{fontWeight:400,fontSize:13,minWidth:120,paddingLeft:12,color:'var(--text-primary)'}}>{cat}</td>
        {/* Actual — with progress bar on desktop */}
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:300,padding:'6px 4px'}}>
          {actual!==0&&<span style={{color:actualColor,fontWeight:400}}>{fmtRound(actual)}</span>}
          {actual!==0&&budget>0&&!isMob&&(
            <div className="mobile-budget-bar" style={{width:60,display:'inline-block',verticalAlign:'middle',marginLeft:6}}>
              <div style={{height:'100%',width:`${pct*100}%`,background:barColor,borderRadius:3,transition:'width 0.3s'}}/>
            </div>
          )}
        </td>
        {/* Budget — shows input in edit mode */}
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:300,minWidth:80,padding:'6px 8px',position:'relative'}}>
          {isEditing?(
            <div style={{position:'relative'}}>
              <input type="number" step="1" min="0" value={editVal}
                onChange={e=>{const v=e.target.value;setEdits(prev=>({...prev,[cat]:{...prev[cat],[String(month)]:v}}));}}
                style={{width:'100%',border:'1px solid var(--border)',borderRadius:6,padding:'4px 24px 4px 6px',fontSize:12,textAlign:'right',fontFamily:'DM Sans',fontWeight:300,background:'var(--elevated)',color:'var(--text-primary)',outline:'none'}}
                placeholder={suggestion?Math.round(suggestion).toString():'0'}/>
              {suggestion&&!editVal&&<span style={{position:'absolute',right:6,top:'50%',transform:'translateY(-50%)',fontSize:10,color:'var(--text-muted)',pointerEvents:'none'}}>{Math.round(suggestion)}</span>}
            </div>
          ):(
            <span style={{color:budget>0?'var(--text-secondary)':'var(--text-muted)',fontWeight:300}}>{budget>0?fmt(budget):'—'}</span>
          )}
        </td>
        {/* Variance — desktop only */}
        {!isEditing&&<td className="hide-mobile" style={{textAlign:'right',fontFamily:'DM Sans',fontSize:11,fontWeight:300,padding:'6px 8px',color:variance!==0?varColor:'var(--text-muted)'}}>
          {variance!==0?(variance>0?'+':'')+fmtRound(variance):'—'}
        </td>}
        {isEditing&&<td/>}
      </tr>
    );
  };

  /* ── Month View: section separator ─────────────────────────────────────── */
  const renderSectionHeader=(label)=>(
    <tr style={{background:'var(--elevated)',borderTop:'2px solid var(--border)'}}>
      <td colSpan={4} style={{fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',paddingLeft:12,paddingTop:8,paddingBottom:4}}>{label}</td>
    </tr>
  );

  const renderSectionTotal=(label,totalBudget,totalActual)=>{
    const diff=totalBudget-totalActual;
    if(isMob) return(
      <tr style={{borderTop:'1px solid var(--border)',background:'var(--elevated)',fontWeight:400}}>
        <td style={{paddingLeft:10,fontSize:12.5,fontWeight:500,color:'var(--text-primary)'}}>{label}</td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:300,padding:'6px 5px',color:'var(--text-secondary)'}}>{totalBudget>0?fmtRound(totalBudget):'—'}</td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:400,padding:'6px 5px',color:'var(--text-primary)'}}>{fmtRound(totalActual)}</td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:11,fontWeight:400,padding:'6px 8px',color:diff>0?'var(--green)':diff<0?'var(--red)':'var(--text-muted)'}}>{diff!==0?(diff>0?'+':'')+fmtRound(diff):'—'}</td>
      </tr>
    );
    return(
      <tr style={{borderTop:'1px solid var(--border)',background:'var(--elevated)',fontWeight:400}}>
        <td style={{paddingLeft:12,fontSize:13,fontWeight:500,color:'var(--text-primary)'}}>{label}</td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:400,padding:'6px 4px',color:'var(--text-primary)'}}>{fmtRound(totalActual)}</td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:300,padding:'6px 8px',color:'var(--text-secondary)'}}>{totalBudget>0?fmt(totalBudget):'—'}</td>
        <td className="hide-mobile" style={{textAlign:'right',fontFamily:'DM Sans',fontSize:11,fontWeight:400,padding:'6px 8px',color:diff>0?'var(--green)':diff<0?'var(--red)':'var(--text-muted)'}}>{diff!==0?(diff>0?'+':'')+fmtRound(diff):'—'}</td>
      </tr>
    );
  };

  /* ── NET row ───────────────────────────────────────────────────────────── */
  const renderNetRow=(budgetNet,actualNet)=>{
    if(isMob) return(
      <tr style={{borderTop:'3px solid var(--gold)',background:'var(--gold-soft)'}}>
        <td style={{fontWeight:500,fontSize:13,paddingLeft:10,paddingTop:8,paddingBottom:8,color:'var(--text-primary)'}}>NET</td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:400,color:'var(--text-secondary)',padding:'6px 5px'}}>{budgetNet>=0?'+':''}{fmtRound(budgetNet)}</td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:13,fontWeight:400,color:actualNet>=0?'var(--green)':'var(--red)',padding:'6px 5px'}}>{actualNet>=0?'+':''}{fmtRound(actualNet)}</td>
        <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:400,padding:'6px 8px',color:(budgetNet-actualNet)>=0?'var(--green)':'var(--red)'}}>{((budgetNet-actualNet)>0?'+':'')+fmtRound(budgetNet-actualNet)}</td>
      </tr>
    );
    return(
    <tr style={{borderTop:'3px solid var(--gold)',background:'var(--gold-soft)'}}>
      <td style={{fontWeight:500,fontSize:14,paddingLeft:12,paddingTop:8,paddingBottom:8,color:'var(--text-primary)'}}>NET</td>
      <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:13,fontWeight:400,color:actualNet>=0?'var(--green)':'var(--red)',padding:'6px 4px'}}>{actualNet>=0?'+':''}{fmtRound(actualNet)}</td>
      <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:400,color:'var(--text-secondary)',padding:'6px 8px'}}>{budgetNet>=0?'+':''}{fmt(budgetNet)}</td>
      <td className="hide-mobile"/>
    </tr>
  );
  };

  /* ═══════════════════════════════════════════════════════════════════════
     VIEW A — MONTH VIEW
  ═══════════════════════════════════════════════════════════════════════ */
  const renderMonthView=()=>{
    const prevMonth=()=>{if(month>1)setMonth(month-1);else{setYear(year-1);setMonth(12);}};
    const nextMonth=()=>{if(month<12)setMonth(month+1);else{setYear(year+1);setMonth(1);}};
    return(
    <div>
      {/* Month selector + action buttons */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap',justifyContent:'space-between'}}>
        {/* Desktop: 12-button pill row */}
        <div className="hide-mobile" style={{display:'flex',gap:4}}>
          {MO.map((label,i)=>(
            <button key={i}
              onClick={()=>{setMonth(i+1);if(editing){loadSuggestions(year,i+1);const e={};[...allIncomeCats,...allExpenseCats].forEach(cat=>{e[cat]={[String(i+1)]:targets[cat]?.[String(i+1)]?.amount?.toString()||''};});setEdits(e);}}}
              style={{padding:'5px 8px',border:'none',borderBottom:month===i+1?'2px solid var(--gold)':'2px solid transparent',cursor:'pointer',fontSize:11,fontWeight:month===i+1?500:300,fontFamily:'DM Sans, sans-serif',minWidth:32,
                background:'transparent',color:month===i+1?'var(--gold)':'var(--text-muted)',
                transition:'all 0.15s'}}>{label}</button>
          ))}
        </div>
        {/* Mobile: compact prev/next navigator */}
        <div style={{display:'none'}} className="mobile-month-nav">
          <button className="btn btn-sm btn-ghost" onClick={prevMonth} style={{padding:'5px 12px',fontSize:18,lineHeight:1}}>‹</button>
          <span style={{fontWeight:500,fontSize:14,color:'var(--text)',minWidth:100,textAlign:'center'}}>{MO[month-1]} {year}</span>
          <button className="btn btn-sm btn-ghost" onClick={nextMonth} style={{padding:'5px 12px',fontSize:18,lineHeight:1}}>›</button>
        </div>
        <div style={{display:'flex',gap:8}}>
          {!editing&&<button className="btn btn-sm btn-secondary hide-mobile" onClick={copyFromPrior} disabled={saving}>Copy from {year-1}</button>}
          {!editing&&<button className="btn btn-sm btn-primary hide-mobile" onClick={startEdit}>Edit {MO[month-1]}</button>}
          {editing&&<button className="btn btn-sm btn-ghost" onClick={()=>{setEditing(false);setSuggestions({});}}>Cancel</button>}
          {editing&&<button className="btn btn-sm btn-success" onClick={saveEdits} disabled={saving}>{saving?'Saving…':'Save'}</button>}
        </div>
      </div>

      {editing&&<div style={{fontSize:12,color:'var(--text-muted)',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
        <span style={{width:8,height:8,borderRadius:'50%',background:'var(--text-muted)',display:'inline-block'}}/>
        Hint values are 3-month trailing averages. Leave blank or enter 0 to clear a target.
      </div>}

      {/* P&L Table */}
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:0,overflow:'hidden'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr style={{background:'var(--elevated)',borderBottom:'2px solid var(--border)'}}>
              <th style={{textAlign:'left',padding:'10px 12px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)'}}>Category</th>
              {isMob
                ?<><th style={{textAlign:'right',padding:'10px 5px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',minWidth:58}}>Budget</th>
                    <th style={{textAlign:'right',padding:'10px 5px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',minWidth:58}}>Actual</th>
                    <th style={{textAlign:'right',padding:'10px 8px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',minWidth:58}}>Left</th></>
                :<><th style={{textAlign:'right',padding:'10px 8px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)'}}>Actual</th>
                    <th style={{textAlign:'right',padding:'10px 8px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',minWidth:80}}>{MO[month-1]} Budget</th>
                    <th className="hide-mobile" style={{textAlign:'right',padding:'10px 8px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',minWidth:80}}>Variance</th></>
              }
            </tr>
          </thead>
          <tbody>
            {/* INCOME */}
            {renderSectionHeader('Income')}
            {allIncomeCats.map(cat=>renderPLRow(cat,true,editing))}
            {renderSectionTotal('Total Income',monthIncomeBudget,monthIncomeActual)}

            {/* EXPENSES */}
            {renderSectionHeader('Expenses')}
            {allExpenseCats.map(cat=>renderPLRow(cat,false,editing))}
            {renderSectionTotal('Total Expenses',monthExpenseBudget,monthExpenseActual)}

            {/* NET */}
            {renderNetRow(monthNetBudget,monthNetActual)}
          </tbody>
        </table>
      </div>
    </div>
  );};

  /* ═══════════════════════════════════════════════════════════════════════
     VIEW B — ANNUAL VIEW  (read-only 12-column merged table)
  ═══════════════════════════════════════════════════════════════════════ */
  const renderAnnualSection=(sectionLabel,catList)=>{
    return(<>
      {/* Section header row */}
      <tr style={{background:'var(--elevated)'}}>
        <td colSpan={14} style={{fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',paddingLeft:10,paddingTop:8,paddingBottom:4,borderTop:'2px solid var(--border)'}}>{sectionLabel}</td>
      </tr>
      {catList.map(cat=>{
        const annualBudget=(()=>{let s=0;for(let m=1;m<=12;m++)s+=getBudget(cat,m);return s;})();
        if(annualBudget===0) return null;
        return(
          <tr key={cat} style={{borderBottom:'1px solid var(--border)'}}>
            <td style={{fontWeight:400,fontSize:12,paddingLeft:10,minWidth:140,position:'sticky',left:0,background:'var(--surface)',zIndex:1,color:'var(--text-primary)'}}>{cat}</td>
            {MO.map((mo,i)=>{
              const m=i+1;
              const b=getBudget(cat,m);
              const isCur=m===curMonth&&year===curYear;
              const cellBg=isCur?'var(--gold-soft)':'transparent';
              const isIE=inlineEdit&&inlineEdit.cat===cat&&inlineEdit.m===m;
              return(
                <td key={i} style={{textAlign:'right',padding:'4px 8px',minWidth:76,background:cellBg,cursor:isIE?'default':'pointer',userSelect:'none'}}
                  onClick={isIE?undefined:()=>startInlineEdit(cat,m)}>
                  {isIE?(
                    <input type="number" step="1" min="0" autoFocus value={inlineEditVal}
                      onChange={e=>setInlineEditVal(e.target.value)}
                      onBlur={()=>commitInlineEdit(cat,m,inlineEditVal)}
                      onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();commitInlineEdit(cat,m,inlineEditVal);}if(e.key==='Escape'){e.preventDefault();cancelInlineEdit();}}}
                      onClick={e=>e.stopPropagation()}
                      style={{width:68,border:'1px solid var(--gold)',borderRadius:6,padding:'2px 4px',fontSize:11,textAlign:'right',fontFamily:'DM Sans',fontWeight:300,background:'var(--elevated)',color:'var(--text-primary)',outline:'none',boxShadow:'0 0 0 2px var(--gold-soft)'}}/>
                  ):b>0?(
                    <span style={{fontFamily:'DM Sans',fontSize:11,fontWeight:300,color:'var(--text-primary)'}}>{fmt(b)}</span>
                  ):(
                    <span style={{color:'var(--text-muted)',fontSize:9,opacity:0.4}}>+</span>
                  )}
                </td>
              );
            })}
            <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:11,fontWeight:400,padding:'4px 10px',minWidth:90,borderLeft:'2px solid var(--border)',color:'var(--text-primary)'}}>{annualBudget>0?fmt(annualBudget):'—'}</td>
          </tr>
        );
      })}
      {/* Section totals */}
      {(()=>{
        const totBudget=(()=>{let s=0;catList.forEach(c=>{for(let m=1;m<=12;m++)s+=getBudget(c,m);});return s;})();
        return(
          <tr style={{borderTop:'1px solid var(--border)',background:'var(--elevated)',fontWeight:400}}>
            <td style={{paddingLeft:10,fontSize:12,fontWeight:500,color:'var(--text-primary)',position:'sticky',left:0,background:'var(--elevated)',zIndex:1}}>Total {sectionLabel}</td>
            {MO.map((mo,i)=>{
              const m=i+1;
              const tb=catList.reduce((s,c)=>s+getBudget(c,m),0);
              const isCur=m===curMonth&&year===curYear;
              return(
                <td key={i} style={{textAlign:'right',padding:'4px 8px',background:isCur?'var(--gold-soft)':'transparent'}}>
                  <span style={{fontFamily:'DM Sans',fontSize:11,fontWeight:400,color:'var(--text-secondary)'}}>{tb>0?fmt(tb):'—'}</span>
                </td>
              );
            })}
            <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:11,fontWeight:400,padding:'4px 10px',borderLeft:'2px solid var(--border)',color:'var(--text-primary)'}}>{totBudget>0?fmt(totBudget):'—'}</td>
          </tr>
        );
      })()}
    </>);
  };

  const renderAnnualView=()=>{
    const netBudget=annualIncomeBudget-annualExpenseBudget;
    return(
      <div>
      <div style={{display:'flex',gap:8,marginBottom:10,justifyContent:'flex-end',alignItems:'center'}}>
        <span style={{fontSize:11,color:'var(--text-muted)',flex:1,fontWeight:300}}>Click any cell to edit inline · Enter to save · Esc to cancel</span>
        <button className="btn btn-sm btn-secondary" onClick={()=>setPasteModal(true)}>📋 Paste from Excel</button>
        <button className="btn btn-sm btn-ghost" onClick={startYearEdit}>✏ Edit Year</button>
      </div>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:0,overflow:'hidden'}}>
        <div style={{overflowX:'auto'}}>
          <table style={{borderCollapse:'collapse',minWidth:1200}}>
            <thead>
              <tr style={{background:'var(--elevated)',borderBottom:'2px solid var(--border)'}}>
                <th style={{textAlign:'left',padding:'8px 10px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',minWidth:140,position:'sticky',left:0,background:'var(--elevated)',zIndex:3}}>Category</th>
                {MO.map((mo,i)=>{
                  const isCur=(i+1)===curMonth&&year===curYear;
                  return(
                    <th key={i} style={{textAlign:'right',padding:'6px 8px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1px',color:isCur?'var(--gold)':'var(--text-muted)',minWidth:76,background:isCur?'var(--gold-soft)':'transparent'}}>
                      {mo}
                    </th>
                  );
                })}
                <th style={{textAlign:'right',padding:'8px 10px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',minWidth:90,borderLeft:'2px solid var(--border)'}}>Total</th>
              </tr>
            </thead>
            <tbody>
              {renderAnnualSection('Income',allIncomeCats)}
              {renderAnnualSection('Expenses',allExpenseCats)}
              {/* Annual NET row */}
              {(()=>{
                return(
                  <tr style={{borderTop:'3px solid var(--gold)',background:'var(--gold-soft)',fontWeight:400}}>
                    <td style={{paddingLeft:10,fontSize:13,fontWeight:500,paddingTop:8,paddingBottom:8,position:'sticky',left:0,background:'var(--gold-soft)',zIndex:1,color:'var(--text-primary)'}}>NET</td>
                    {MO.map((mo,i)=>{
                      const m=i+1;
                      const ib=allIncomeCats.reduce((s,c)=>s+getBudget(c,m),0);
                      const eb=allExpenseCats.reduce((s,c)=>s+getBudget(c,m),0);
                      const nb=ib-eb;
                      const isCur=m===curMonth&&year===curYear;
                      return(
                        <td key={i} style={{textAlign:'right',padding:'4px 8px',background:isCur?'var(--gold-soft)':'transparent'}}>
                          {nb!==0?<span style={{fontFamily:'DM Sans',fontSize:11,fontWeight:400,color:nb>=0?'var(--green)':'var(--red)'}}>{nb>=0?fmt(nb):`-${fmt(Math.abs(nb))}`}</span>:<span style={{color:'var(--text-muted)',fontSize:10}}>—</span>}
                        </td>
                      );
                    })}
                    <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:12,fontWeight:500,color:netBudget>=0?'var(--green)':'var(--red)',padding:'4px 10px',borderLeft:'2px solid var(--border)'}}>{netBudget>=0?fmt(netBudget):`-${fmt(Math.abs(netBudget))}`}</td>
                  </tr>
                );
              })()}
            </tbody>
          </table>
        </div>
        <div style={{padding:'8px 12px',fontSize:11,fontWeight:300,color:'var(--text-muted)',borderTop:'1px solid var(--border)'}}>
          Budget planning view — actuals &amp; progress tracking are on the Dashboard. Click any cell to edit inline.
        </div>
      </div>
      </div>
    );
  };

  /* ═══════════════════════════════════════════════════════════════════════
     VIEW C — EDIT YEAR  (spreadsheet grid, all 12 months × all categories)
  ═══════════════════════════════════════════════════════════════════════ */
  const renderEditYearView=()=>{
    const setCell=(cat,m,val)=>setYearEdits(prev=>({...prev,[cat]:{...prev[cat],[String(m)]:val}}));
    const renderSection=(label,catList,isIncome)=>(
      <>
        <tr style={{background:'var(--elevated)'}}>
          <td colSpan={13} style={{fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',paddingLeft:10,paddingTop:8,paddingBottom:4,borderTop:'2px solid var(--border)'}}>{label}</td>
        </tr>
        {catList.map(cat=>(
          <tr key={cat} style={{borderBottom:'1px solid var(--border)'}}>
            <td style={{fontWeight:400,fontSize:12,paddingLeft:10,minWidth:150,position:'sticky',left:0,background:'var(--surface)',zIndex:1,whiteSpace:'nowrap',color:'var(--text-primary)'}}>{cat}</td>
            {MO.map((mo,i)=>{
              const m=i+1;
              const isCur=m===curMonth&&year===curYear;
              const val=yearEdits[cat]?.[String(m)]??'';
              const actual=getActual(cat,m);
              return(
                <td key={m} style={{padding:'3px 3px',background:isCur?'var(--gold-soft)':'transparent',minWidth:82}}>
                  <input type="number" step="1" min="0" value={val}
                    onChange={e=>setCell(cat,m,e.target.value)}
                    style={{width:'100%',border:'1px solid var(--border)',borderRadius:6,padding:'4px 5px',fontSize:11,textAlign:'right',fontFamily:'DM Sans',fontWeight:300,
                      background:isCur?'var(--gold-soft)':'var(--elevated)',color:'var(--text-primary)',
                      outline:isCur?'1px solid var(--gold)':undefined}}
                    placeholder={actual>0?String(Math.round(actual)):''}/>
                  {actual>0&&<div style={{fontSize:9,color:isIncome?'var(--green)':'var(--text-muted)',textAlign:'right',padding:'1px 3px 0',opacity:0.8,fontWeight:300}}>
                    act {fmt(actual)}</div>}
                </td>
              );
            })}
          </tr>
        ))}
      </>
    );
    return(
      <div>
        <div style={{display:'flex',gap:8,marginBottom:10,justifyContent:'flex-end',alignItems:'center'}}>
          <span style={{fontSize:11,color:'var(--text-muted)',fontWeight:300}}>Editing all months for {year} · Current month (highlighted) shown first</span>
          <button className="btn btn-sm btn-ghost" onClick={()=>{setView('annual');setYearEdits({});}}>Cancel</button>
          <button className="btn btn-sm btn-success" onClick={saveYearEdits} disabled={saving}>{saving?'Saving…':'Save Year'}</button>
        </div>
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:0,overflow:'hidden'}}>
          <div style={{overflowX:'auto'}}>
            <table style={{borderCollapse:'collapse',minWidth:1100}}>
              <thead>
                <tr style={{background:'var(--elevated)',borderBottom:'2px solid var(--border)'}}>
                  <th style={{textAlign:'left',padding:'8px 10px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',minWidth:150,position:'sticky',left:0,background:'var(--elevated)',zIndex:3}}>Category</th>
                  {MO.map((mo,i)=>{
                    const isCur=(i+1)===curMonth&&year===curYear;
                    return(
                      <th key={i} style={{textAlign:'center',padding:'6px 4px',fontWeight:isCur?500:400,fontSize:10,textTransform:'uppercase',letterSpacing:'1px',
                        color:isCur?'var(--gold)':'var(--text-muted)',minWidth:82,
                        background:isCur?'var(--gold-soft)':'transparent',
                        borderBottom:isCur?'2px solid var(--gold)':undefined}}>
                        {mo}{isCur?' ★':''}
                      </th>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {renderSection('Income',allIncomeCats,true)}
                {renderSection('Expenses',allExpenseCats,false)}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  };

  /* ── KPI strip (shared across both views) ───────────────────────────────── */
  const renderKPIs=()=>{
    const kpiStyle={background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:18};
    if(view==='month'){
      const expPct=monthExpenseBudget>0?Math.round(monthExpenseActual/monthExpenseBudget*100):0;
      const expColor=expPct>=100?'var(--red)':expPct>=80?'var(--amber)':'var(--green)';
      return(
        <div className="metric-grid grid-4" style={{marginBottom:16}}>
          <div style={kpiStyle}><div className="metric-label">Income — {MO[month-1]}</div><div className="metric-value" style={{color:'var(--green)'}}>{fmt(monthIncomeBudget)}</div><div className="metric-sub">Actual: {fmt(monthIncomeActual)}</div></div>
          <div style={kpiStyle}><div className="metric-label">Expenses — {MO[month-1]}</div><div className="metric-value">{fmt(monthExpenseBudget)}</div><div className="metric-sub">Actual: {fmt(monthExpenseActual)}</div></div>
          <div style={kpiStyle}><div className="metric-label">Budget Used</div><div className="metric-value" style={{color:expColor}}>{expPct}%</div><div className="metric-sub" style={{color:expColor}}>{fmt(monthExpenseActual)} of {fmt(monthExpenseBudget)}</div></div>
          <div style={kpiStyle}><div className="metric-label">Net — {MO[month-1]}</div><div className="metric-value" style={{color:monthNetBudget>=0?'var(--green)':'var(--red)'}}>{monthNetBudget>=0?'+':''}{fmt(monthNetBudget)}</div><div className="metric-sub">Actual: {monthNetActual>=0?'+':''}{fmt(monthNetActual)}</div></div>
        </div>
      );
    }else{
      const annExpPct=annualExpenseBudget>0?Math.round(annualExpenseActual/annualExpenseBudget*100):0;
      const annExpColor=annExpPct>=100?'var(--red)':annExpPct>=80?'var(--amber)':'var(--green)';
      return(
        <div className="metric-grid grid-4" style={{marginBottom:16}}>
          <div style={kpiStyle}><div className="metric-label">Annual Income</div><div className="metric-value" style={{color:'var(--green)'}}>{fmt(annualIncomeBudget)}</div><div className="metric-sub">Actual: {fmt(annualIncomeActual)}</div></div>
          <div style={kpiStyle}><div className="metric-label">Annual Expenses</div><div className="metric-value">{fmt(annualExpenseBudget)}</div><div className="metric-sub">Actual: {fmt(annualExpenseActual)}</div></div>
          <div style={kpiStyle}><div className="metric-label">Budget Used</div><div className="metric-value" style={{color:annExpColor}}>{annExpPct}%</div><div className="metric-sub" style={{color:annExpColor}}>{fmt(annualExpenseActual)} of {fmt(annualExpenseBudget)}</div></div>
          <div style={kpiStyle}><div className="metric-label">Annual Net</div><div className="metric-value" style={{color:(annualIncomeBudget-annualExpenseBudget)>=0?'var(--green)':'var(--red)'}}>{(annualIncomeBudget-annualExpenseBudget)>=0?'+':''}{fmt(annualIncomeBudget-annualExpenseBudget)}</div></div>
        </div>
      );
    }
  };

  /* ── Main render ────────────────────────────────────────────────────────── */
  return(
    <div>
      {/* Top bar: year selector + view toggle */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:16}}>
          {[curYear-1,curYear,curYear+1].map(y=>(
            <button key={y} onClick={()=>{setYear(y);setEditing(false);setSuggestions({});}}
              style={{padding:'5px 0',border:'none',borderBottom:year===y?'2px solid var(--gold)':'2px solid transparent',cursor:'pointer',fontSize:12,fontWeight:year===y?500:300,fontFamily:'DM Sans, sans-serif',
                background:'transparent',color:year===y?'var(--gold)':'var(--text-muted)',
                transition:'all 0.15s',letterSpacing:'0.2px'}}>{y}</button>
          ))}
        </div>
        <div style={{width:1,height:20,background:'var(--border)'}}/>
        <span style={{fontSize:12,fontWeight:500,color:'var(--gold)',letterSpacing:'0.2px'}}>Annual View</span>
      </div>

      {error&&<div style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{error}</div>}

      {renderKPIs()}

      {loading
        ?<div className="loading"><div className="spinner"/><span>Loading…</span></div>
        :(allIncomeCats.length===0&&allExpenseCats.length===0&&Object.keys(targets).length===0)
          ?<div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:40,textAlign:'center'}}><div style={{color:'var(--text-muted)',fontSize:13,fontWeight:300}}>No budget data for {year}</div></div>
          :view==='edit-year'?renderEditYearView():renderAnnualView()
      }

      {/* ── Paste from Excel modal ─────────────────────────────────────── */}
      {pasteModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:9000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
          <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:24,maxWidth:860,width:'100%',maxHeight:'82vh',overflow:'auto',boxShadow:'var(--shadow-md)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <h3 style={{margin:0,fontSize:16,fontWeight:400,color:'var(--text-primary)',fontFamily:'DM Sans, sans-serif'}}>📋 Paste Budget from Excel</h3>
              <button className="btn btn-sm btn-ghost" onClick={closePasteModal}>✕</button>
            </div>
            <p style={{fontSize:12,color:'var(--text-muted)',margin:'0 0 12px',lineHeight:1.5}}>
              Copy from Excel/Sheets and paste below. Expected format: <strong>Category</strong> in column A, then one column per month (Jan–Dec). A header row is automatically detected and skipped. Category names must match exactly.
            </p>
            <textarea
              style={{width:'100%',height:110,border:'1px solid var(--border)',borderRadius:8,padding:10,fontSize:12,fontWeight:300,fontFamily:'DM Sans, sans-serif',resize:'vertical',boxSizing:'border-box',background:'var(--elevated)',color:'var(--text-primary)',outline:'none'}}
              placeholder={"Category\tJan\tFeb\tMar\tApr\tMay\tJun\tJul\tAug\tSep\tOct\tNov\tDec\nGroceries\t1200\t1200\t1300\t1200\t1200\t1200\t1200\t1200\t1200\t1200\t1200\t1400\nRent\t2500\t2500\t2500\t2500\t2500\t2500\t2500\t2500\t2500\t2500\t2500\t2500"}
              value={pasteText}
              onChange={e=>{setPasteText(e.target.value);parsePasteText(e.target.value);}}
              autoFocus/>

            {parseErrors.length>0&&(
              <div style={{marginTop:8,padding:'8px 10px',background:'rgba(248,113,113,0.06)',border:'1px solid var(--red)',borderRadius:6,fontSize:12,color:'var(--red)'}}>
                {parseErrors.map((er,i)=><div key={i}>⚠ {er}</div>)}
              </div>
            )}

            {parsedRows&&parsedRows.length>0&&(
              <div style={{marginTop:14}}>
                <div style={{fontSize:12,fontWeight:500,marginBottom:8,color:'var(--text-primary)'}}>
                  Preview — {parsedRows.length} {parsedRows.length===1?'category':'categories'}, {parsedRows.reduce((s,r)=>s+r.values.filter(v=>v!=null).length,0)} targets to save:
                </div>
                <div style={{overflowX:'auto',borderRadius:8,border:'1px solid var(--border)'}}>
                  <table style={{borderCollapse:'collapse',fontSize:11,width:'100%'}}>
                    <thead>
                      <tr style={{background:'var(--elevated)'}}>
                        <th style={{textAlign:'left',padding:'5px 10px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',position:'sticky',left:0,background:'var(--elevated)',zIndex:1}}>Category</th>
                        {MO.map(mo=><th key={mo} style={{textAlign:'right',padding:'5px 7px',fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1px',fontFamily:'DM Sans',color:'var(--text-muted)',minWidth:60}}>{mo}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {parsedRows.map(({cat,values})=>(
                        <tr key={cat} style={{borderTop:'1px solid var(--border)'}}>
                          <td style={{padding:'4px 10px',fontWeight:400,color:'var(--text-primary)',position:'sticky',left:0,background:'var(--surface)',zIndex:1}}>{cat}</td>
                          {values.map((v,i)=>(
                            <td key={i} style={{textAlign:'right',padding:'4px 7px',fontFamily:'DM Sans',fontWeight:300,color:v!=null?'var(--text-primary)':'var(--text-muted)',background:v!=null?undefined:'var(--elevated)'}}>
                              {v!=null?fmt(v):'—'}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:14}}>
                  <button className="btn btn-sm btn-ghost" onClick={closePasteModal}>Cancel</button>
                  <button className="btn btn-sm btn-success" onClick={confirmPaste} disabled={pasteSaving}>
                    {pasteSaving?'Saving…':`Save ${parsedRows.reduce((s,r)=>s+r.values.filter(v=>v!=null).length,0)} targets`}
                  </button>
                </div>
              </div>
            )}

            {(!parsedRows||parsedRows.length===0)&&pasteText.trim()&&(
              <div style={{marginTop:10,fontSize:12,color:'var(--text-muted)'}}>No valid rows found. Check that category names match exactly (e.g. "Groceries", "Dining Out").</div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function NetWorthPage({toast,refreshKey}){
  /* ── shared "as of" date ─────────────────────────────────────────────── */
  const todayStr=localDateStr(new Date());
  const[asOf,setAsOf]=useState(todayStr);
  const[subTab,setSubTab]=useState('networth');   // 'networth' | 'balances'

  /* ── Net Worth tab state ─────────────────────────────────────────────── */
  const[nwData,setNwData]=useState(null);
  const[tlData,setTlData]=useState([]);
  const[nwLoading,setNwLoading]=useState(true);
  const[expanded,setExpanded]=useState({});
  /* inline edit for starting balance */
  const[editingAcct,setEditingAcct]=useState(null); // account_id
  const[editBal,setEditBal]=useState('');
  const[editDate,setEditDate]=useState('');
  const[editSaving,setEditSaving]=useState(false);

  /* ── Balances tab state ──────────────────────────────────────────────── */
  const[accounts,setAccounts]=useState([]);
  const[selectedId,setSelectedId]=useState(null);
  const[selectedAccount,setSelectedAccount]=useState(null);
  const[timeline,setTimeline]=useState(null);
  const[balLoading,setBalLoading]=useState(true);
  const[tlLoading,setTlLoading]=useState(false);
  const[error,setError]=useState('');
  /* filters */
  const[sideFilter,setSideFilter]=useState('');
  const[typeFilter,setTypeFilter]=useState(null); // null=all, Set=specific
  const[nameFilter,setNameFilter]=useState('');
  /* statement / reconcile view */
  const[stmtView,setStmtView]=useState(false);
  const[reconcileData,setReconcileData]=useState(null);
  const[reconcileLoading,setReconcileLoading]=useState(false);

  /* ── Net Worth: load data ────────────────────────────────────────────── */
  const loadNW=useCallback(async()=>{
    setNwLoading(true);setError('');
    try{
      const[nw,tl]=await Promise.all([
        apiFetch(`/net-worth?as_of=${asOf}`),
        apiFetch('/net-worth/timeline?months=12'),
      ]);
      setNwData(nw);setTlData(tl.timeline||[]);
    }catch(e){setError('Failed to load net worth');toast('Failed to load','error');}
    finally{setNwLoading(false);}
  },[asOf]);
  useEffect(()=>{loadNW();},[loadNW,refreshKey]);

  /* ── Balances: load accounts list ────────────────────────────────────── */
  const loadAccounts=useCallback(async()=>{
    setBalLoading(true);
    try{setAccounts(await apiFetch('/accounts'));}
    catch(e){setError('Failed to load accounts');}
    finally{setBalLoading(false);}
  },[]);
  useEffect(()=>{loadAccounts();},[loadAccounts,refreshKey]);

  /* ── Balances: load per-account timeline ─────────────────────────────── */
  const loadTimeline=useCallback(async(id)=>{
    setTlLoading(true);setError('');
    try{setTimeline(await apiFetch(`/accounts/${id}/balance-timeline?end=${asOf}`));}
    catch(e){setError('Failed to load balance timeline');toast('Failed to load','error');}
    finally{setTlLoading(false);}
  },[asOf]);
  useEffect(()=>{
    if(selectedId){setSelectedAccount(accounts.find(a=>a.id===selectedId)||null);loadTimeline(selectedId);}
    else{setTimeline(null);setSelectedAccount(null);}
  },[selectedId,asOf]);

  /* Fetch statement/reconcile data when account or date changes (only when stmtView is open) */
  useEffect(()=>{
    if(!selectedId||!stmtView){setReconcileData(null);return;}
    setReconcileLoading(true);
    apiFetch(`/accounts/${selectedId}/reconcile?end=${asOf}`)
      .then(d=>setReconcileData(d))
      .catch(()=>toast('Failed to load statement','error'))
      .finally(()=>setReconcileLoading(false));
  },[selectedId,stmtView,asOf]);

  /* ── Helpers ─────────────────────────────────────────────────────────── */
  const fmtBal=(v)=>v===0?'$0':(v<0?'-':'')+fmt(Math.abs(v));
  const toggleBucket=(b)=>setExpanded(prev=>({...prev,[b]:!prev[b]}));

  /* ── Starting balance inline edit ────────────────────────────────────── */
  const startEditAcct=(acct)=>{setEditingAcct(acct.account_id);setEditBal(String(Math.abs(acct.balance)));setEditDate(acct.start_date||'2025-12-31');};
  const cancelEditAcct=()=>{setEditingAcct(null);setEditBal('');setEditDate('');};
  const saveEditAcct=async(acct)=>{
    setEditSaving(true);
    try{
      // For liabilities the stored balance should be negative; user enters positive
      const isAsset=nwData?.buckets?.[Object.keys(nwData.buckets).find(k=>nwData.buckets[k].accounts.some(a=>a.account_id===acct.account_id))]?.is_asset??true;
      const amt=parseFloat(editBal)||0;
      const storedAmt=isAsset?amt:-amt;
      await apiFetch(`/accounts/${acct.account_id}`,{method:'PATCH',body:JSON.stringify({starting_balance:storedAmt,start_date:editDate})});
      toast('Starting balance saved');cancelEditAcct();loadNW();
    }catch(e){toast('Failed to save','error');}
    finally{setEditSaving(false);}
  };

  /* ══════════════════════════════════════════════════════════════════════
     NET WORTH TAB
  ══════════════════════════════════════════════════════════════════════ */
  const NW_ASSET_ORDER=['Cash & Savings','Investments','Real Estate','Other Assets'];
  const NW_LIAB_ORDER=['Mortgage','Credit Cards','Personal Loans','Business Loans','Other Liabilities'];

  const renderNWTab=()=>{
    if(nwLoading)return<div className="loading"><div className="spinner"/><span>Loading…</span></div>;
    const buckets=nwData?.buckets||{};
    const assetBuckets=NW_ASSET_ORDER.map(name=>[name,buckets[name]]).filter(([,v])=>v);
    // also include any unknown asset buckets
    Object.entries(buckets).forEach(([k,v])=>{if(v.is_asset&&!NW_ASSET_ORDER.includes(k))assetBuckets.push([k,v]);});
    const liabBuckets=NW_LIAB_ORDER.map(name=>[name,buckets[name]]).filter(([,v])=>v);
    Object.entries(buckets).forEach(([k,v])=>{if(!v.is_asset&&!NW_LIAB_ORDER.includes(k))liabBuckets.push([k,v]);});

    /* SVG timeline chart */
    const chartW=800;const chartH=160;const pad=36;
    const vals=tlData.map(d=>d.net_worth);
    const minV=vals.length?Math.min(...vals):0;const maxV=vals.length?Math.max(...vals):0;
    const rng=maxV-minV||1;
    const tlPts=tlData.map((d,i)=>{
      const x=pad+(i/(tlData.length-1||1))*(chartW-2*pad);
      const y=pad+(1-(d.net_worth-minV)/rng)*(chartH-2*pad);
      return`${x},${y}`;
    }).join(' ');

    const BucketPanel=({bucketList,isAsset})=>(
      <div>
        {bucketList.length===0&&<div className="empty" style={{padding:24}}><span>None</span></div>}
        {bucketList.map(([bucketName,bData])=>{
          const bucketTotal=bData.accounts.reduce((s,a)=>s+Math.abs(a.balance),0);
          const isExp=expanded[bucketName]!==false;
          return(
            <div key={bucketName} style={{borderBottom:'1px solid var(--border)'}}>
              {/* Bucket header row */}
              <div onClick={()=>toggleBucket(bucketName)}
                style={{padding:'10px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer',background:'var(--elevated)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:10,color:'var(--text-muted)',transform:isExp?'rotate(90deg)':'none',display:'inline-block',transition:'transform 0.15s'}}>▶</span>
                  <span style={{fontSize:13,fontWeight:400,color:'var(--text-primary)'}}>{bucketName}</span>
                  <span style={{fontSize:11,color:'var(--text-muted)',fontWeight:300}}>({bData.accounts.length})</span>
                </div>
                <span style={{fontFamily:'DM Sans, sans-serif',fontSize:13,fontWeight:500,color:isAsset?'var(--green)':'var(--red)'}}>{fmtBal(bucketTotal)}</span>
              </div>
              {/* Account rows */}
              {isExp&&bData.accounts.map(a=>{
                const isEditing=editingAcct===a.account_id;
                const dispBal=Math.abs(a.balance);
                return(
                  <div key={a.account_id} style={{padding:'8px 16px 8px 40px',borderTop:'1px solid var(--border)',background:'var(--surface)'}}>
                    {isEditing?(
                      /* ── Inline edit form ── */
                      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                        <div style={{flex:1,minWidth:120}}>
                          <div style={{fontSize:12,fontWeight:400,marginBottom:2,color:'var(--text-primary)'}}>{a.account_name}{a.mask?` ···${a.mask}`:''}</div>
                          <div style={{fontSize:11,color:'var(--text-muted)'}}>{fmtAcctType(a.account_type)}</div>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <span style={{fontSize:11,color:'var(--text-muted)'}}>Balance $</span>
                          <input type="number" step="0.01" min="0" value={editBal} onChange={e=>setEditBal(e.target.value)}
                            style={{width:110,border:'1px solid var(--border)',borderRadius:6,padding:'3px 6px',fontSize:12,fontFamily:'DM Sans',fontWeight:300,textAlign:'right',background:'var(--elevated)',color:'var(--text-primary)',outline:'none'}}/>
                          <span style={{fontSize:11,color:'var(--text-muted)'}}>as of</span>
                          <input type="date" value={editDate} onChange={e=>setEditDate(e.target.value)}
                            style={{border:'1px solid var(--border)',borderRadius:6,padding:'3px 6px',fontSize:12,fontWeight:300,background:'var(--elevated)',color:'var(--text-primary)',outline:'none'}}/>
                          <button className="btn btn-sm btn-success" onClick={()=>saveEditAcct(a)} disabled={editSaving}>{editSaving?'…':'Save'}</button>
                          <button className="btn btn-sm btn-ghost" onClick={cancelEditAcct}>✕</button>
                        </div>
                      </div>
                    ):(
                      /* ── Read-only row ── */
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                        <div>
                          <span style={{fontSize:13,fontWeight:400,color:'var(--text-primary)'}}>{a.account_name}{a.mask?<span style={{fontSize:11,color:'var(--text-muted)',marginLeft:4,fontWeight:300}}>···{a.mask}</span>:null}</span>
                          <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>
                            {fmtAcctType(a.account_type)}{a.is_manual?' · Manual':''}
                            {a.start_date?<span style={{marginLeft:8}}>Anchor: {fmtBal(a.starting_balance)} as of {a.start_date}</span>:
                              <span style={{marginLeft:8,color:'var(--amber)'}}>⚠ No starting balance set</span>}
                          </div>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:10}}>
                          <span style={{fontFamily:'DM Sans, sans-serif',fontSize:13,fontWeight:500,color:isAsset?'var(--green)':'var(--red)'}}>{fmtBal(dispBal)}</span>
                          <button className="btn btn-sm btn-ghost" style={{fontSize:11,padding:'2px 8px'}} onClick={()=>startEditAcct(a)}>Edit anchor</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    );

    return(<>
      {/* KPI strip */}
      {(()=>{
        const currNW=nwData?.net_worth||0;
        const prevMo=tlData.length>=2?tlData[tlData.length-2]?.net_worth:null;
        const start12=tlData.length>=1?tlData[0]?.net_worth:null;
        const moChg=prevMo!=null?currNW-prevMo:null;
        const yr12Chg=start12!=null?currNW-start12:null;
        const moChgPct=moChg!=null&&Math.abs(prevMo)>1?Math.round(moChg/Math.abs(prevMo)*100):null;
        const yr12ChgPct=yr12Chg!=null&&Math.abs(start12)>1?Math.round(yr12Chg/Math.abs(start12)*100):null;
        const NWTrendBadge=({chg,pct})=>{
          if(chg==null)return<span style={{fontSize:11,color:'var(--text-muted)'}}>—</span>;
          const pos=chg>=0;
          return<span style={{background:pos?'rgba(52,211,153,0.12)':'rgba(248,113,113,0.12)',color:pos?'var(--green)':'var(--red)',borderRadius:12,padding:'2px 8px',fontSize:11,fontWeight:500}}>{chg>0?'+':''}{fmt(chg)}{pct!=null?` (${pct>0?'+':''}${pct}%)`:''}</span>;
        };
        return(
          <div className="metric-grid grid-4" style={{marginBottom:16}}>
            {[
              {label:'Net Worth',value:()=><span style={{color:currNW>=0?'var(--green)':'var(--red)'}}>{currNW<0?'-':''}{fmt(Math.abs(currNW))}</span>,sub:()=><><NWTrendBadge chg={moChg} pct={moChgPct}/><span style={{fontSize:11,color:'var(--text-muted)'}}>vs last month</span></>},
              {label:'Total Assets',value:()=><span style={{color:'var(--green)'}}>{fmt(nwData?.total_assets||0)}</span>,sub:()=><span style={{fontSize:11,color:'var(--text-muted)'}}>as of {asOf}</span>},
              {label:'Total Liabilities',value:()=><span style={{color:'var(--red)'}}>{fmt(Math.abs(nwData?.total_liabilities||0))}</span>,sub:()=><span style={{fontSize:11,color:'var(--text-muted)'}}>as of {asOf}</span>},
              {label:'12-Month Change',value:()=><span style={{color:yr12Chg!=null?(yr12Chg>=0?'var(--green)':'var(--red)'):'var(--text-primary)'}}>{yr12Chg!=null?(yr12Chg>0?'+':yr12Chg<0?'-':'')+fmt(Math.abs(yr12Chg)):'—'}</span>,sub:()=>yr12ChgPct!=null&&<span style={{fontSize:11,color:'var(--text-muted)'}}>{yr12ChgPct>0?'+':''}{yr12ChgPct}% · since {tlData[0]?.date}</span>},
            ].map(k=>(
              <div key={k.label} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:18}}>
                <div className="metric-label">{k.label}</div><div className="metric-value">{k.value()}</div><div className="metric-sub">{k.sub()}</div>
              </div>
            ))}
          </div>
        );
      })()}

      {/* Timeline chart — Catmull-Rom spline matching Dashboard style */}
      {tlData.length>1&&(()=>{
        const W=800,H=180,padC={t:14,r:20,b:28,l:52};
        const cW=W-padC.l-padC.r,cH=H-padC.t-padC.b;
        const yMax=maxV*1.05;const yMin=minV-(maxV-minV)*0.05;const yRng=yMax-yMin||1;
        const pts=tlData.map((d,i)=>[
          padC.l+(i/(tlData.length-1))*cW,
          padC.t+cH-((d.net_worth-yMin)/yRng)*cH
        ]);
        const smoothPath=(points)=>{
          if(points.length<2)return'';
          let d=`M${points[0][0]},${points[0][1]}`;
          for(let i=0;i<points.length-1;i++){
            const p0=points[Math.max(i-1,0)],p1=points[i],p2=points[i+1],p3=points[Math.min(i+2,points.length-1)];
            const t=0.3;
            d+=` C${p1[0]+(p2[0]-p0[0])*t},${p1[1]+(p2[1]-p0[1])*t} ${p2[0]-(p3[0]-p1[0])*t},${p2[1]-(p3[1]-p1[1])*t} ${p2[0]},${p2[1]}`;
          }
          return d;
        };
        const pathD=smoothPath(pts);
        const areaD=pathD+` L${pts[pts.length-1][0]},${padC.t+cH} L${pts[0][0]},${padC.t+cH} Z`;
        const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return(
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:20,marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:500,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'1.5px',marginBottom:16}}>Net Worth Over Time</div>
          <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',maxHeight:200}}>
            <defs><linearGradient id="nwAreaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--gold)" stopOpacity="0.25"/><stop offset="100%" stopColor="var(--gold)" stopOpacity="0"/></linearGradient></defs>
            {[0,0.25,0.5,0.75,1].map((p,i)=>{
              const y=padC.t+(1-p)*cH;const val=yMin+yRng*p;
              return(<g key={i}><line x1={padC.l} y1={y} x2={W-padC.r} y2={y} stroke="var(--border)" strokeWidth={1}/>
                <text x={padC.l-6} y={y+3} textAnchor="end" fontSize={9} fill="var(--text-muted)" fontFamily="DM Sans">{val>=10000||val<=-10000?`${(val/1000).toFixed(0)}k`:val>=1000?`${(val/1000).toFixed(1)}k`:`${Math.round(val)}`}</text></g>);
            })}
            {tlData.map((d,i)=>{
              if(tlData.length>6&&i%2!==0&&i!==tlData.length-1)return null;
              const dt=new Date(d.date+'T12:00:00');
              return<text key={i} x={pts[i][0]} y={H-4} textAnchor="middle" fontSize={9} fill="var(--text-muted)" fontFamily="DM Sans">{MO[dt.getMonth()]}</text>;
            })}
            <path d={areaD} fill="url(#nwAreaGrad)"/>
            <path d={pathD} fill="none" stroke="var(--gold)" strokeWidth={2} strokeLinecap="round"/>
            {pts.map((p,i)=>(
              <g key={i}>
                <circle cx={p[0]} cy={p[1]} r={3} fill="var(--gold)" style={{cursor:'pointer'}}/>
                <title>{tlData[i].date}: {fmt(tlData[i].net_worth)}</title>
              </g>
            ))}
          </svg>
        </div>);
      })()}

      {/* Assets | Liabilities two-column */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,overflow:'hidden'}}>
          <div style={{padding:'14px 20px',borderBottom:'2px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)'}}>Assets</span>
            <span style={{fontFamily:'DM Sans, sans-serif',fontSize:14,fontWeight:500,color:'var(--green)'}}>{fmt(nwData?.total_assets||0)}</span>
          </div>
          <BucketPanel bucketList={assetBuckets} isAsset={true}/>
        </div>
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,overflow:'hidden'}}>
          <div style={{padding:'14px 20px',borderBottom:'2px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontWeight:500,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)'}}>Liabilities</span>
            <span style={{fontFamily:'DM Sans, sans-serif',fontSize:14,fontWeight:500,color:'var(--red)'}}>{fmt(Math.abs(nwData?.total_liabilities||0))}</span>
          </div>
          <BucketPanel bucketList={liabBuckets} isAsset={false}/>
        </div>
      </div>
    </>);
  };

  /* ══════════════════════════════════════════════════════════════════════
     BALANCES TAB
  ══════════════════════════════════════════════════════════════════════ */
  const renderBalancesTab=()=>{
    const tlItems=timeline?.timeline||[];
    const startBal=timeline?.starting_balance||0;
    const asOfBal=tlItems.length?tlItems[tlItems.length-1].balance:startBal;
    const change=asOfBal-startBal;

    const chartW=800;const chartH=180;const pad=36;
    const minBal=tlItems.length?Math.min(...tlItems.map(d=>d.balance)):0;
    const maxBal=tlItems.length?Math.max(...tlItems.map(d=>d.balance)):0;
    const rng=maxBal-minBal||1;
    const balPts=tlItems.map((d,i)=>{
      const x=pad+(i/(tlItems.length-1||1))*(chartW-2*pad);
      const y=pad+(1-(d.balance-minBal)/rng)*(chartH-2*pad);
      return`${x},${y}`;
    }).join(' ');

    const accountTypes=[...new Set(accounts.map(a=>a.account_type))].sort();
    const filteredAccounts=accounts.filter(a=>{
      if(sideFilter==='asset'&&!a.is_asset)return false;
      if(sideFilter==='liability'&&!a.is_liability)return false;
      if(typeFilter!==null&&!typeFilter.has(a.account_type))return false;
      if(nameFilter&&a.id!==parseInt(nameFilter))return false;
      return true;
    });

    return(<>
      {/* Filters */}
      <div style={{display:'flex',gap:8,marginBottom:16,alignItems:'center',flexWrap:'wrap'}}>
        <select className="filter-select" value={sideFilter} onChange={e=>setSideFilter(e.target.value)}>
          <option value="">Asset / Liability</option>
          <option value="asset">Assets only</option>
          <option value="liability">Liabilities only</option>
        </select>
        <MultiSelectFilter label="All types" options={accountTypes.map(t=>({value:t,label:fmtAcctType(t)}))}
          selected={typeFilter} onChange={setTypeFilter}/>
        <select className="filter-select" value={selectedId||''} onChange={e=>{setSelectedId(parseInt(e.target.value)||null);setTimeline(null);}}>
          <option value="">— Select account —</option>
          {filteredAccounts.map(a=><option key={a.id} value={a.id}>{a.account_name}{a.mask?` ···${a.mask}`:''}{a.is_manual?' (Manual)':''}</option>)}
        </select>
        {(sideFilter||typeFilter!==null)&&<button className="btn btn-sm btn-ghost" onClick={()=>{setSideFilter('');setTypeFilter(null);}}>Clear filters</button>}
      </div>

      {!selectedId
        ?<div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:40,textAlign:'center'}}><div style={{color:'var(--text-muted)',fontSize:13,fontWeight:300}}>Select an account to view its balance as of {asOf}</div></div>
        :tlLoading
          ?<div className="loading"><div className="spinner"/><span>Loading…</span></div>
          :<>
            {/* KPI strip */}
            <div className="metric-grid grid-3" style={{marginBottom:16}}>
              {[
                {label:'Starting Balance',val:fmtBal(startBal),color:undefined,sub:timeline?.start_date?`as of ${timeline.start_date}`:''},
                {label:`Balance as of ${asOf}`,val:fmtBal(asOfBal),color:asOfBal>=0?'var(--green)':'var(--red)',sub:''},
                {label:'Change',val:(change>=0?'+':'')+fmtBal(change),color:change>=0?'var(--green)':'var(--red)',sub:''},
              ].map(k=>(
                <div key={k.label} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:18}}>
                  <div className="metric-label">{k.label}</div><div className="metric-value" style={{color:k.color}}>{k.val}</div>{k.sub&&<div className="metric-sub">{k.sub}</div>}
                </div>
              ))}
            </div>

            {/* Balance chart */}
            {tlItems.length>1&&<div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:16,marginBottom:16}}>
              <div style={{fontSize:10,fontWeight:500,color:'var(--text-muted)',marginBottom:8,textTransform:'uppercase',letterSpacing:'1.5px'}}>Balance Over Time</div>
              <svg viewBox={`0 0 ${chartW} ${chartH}`} style={{width:'100%',height:180}}>
                <polyline fill="none" stroke="var(--gold)" strokeWidth="2" points={balPts}/>
                <polyline fill="url(#balgrad)" stroke="none" points={`${pad},${chartH-pad} ${balPts} ${pad+(tlItems.length-1)/(tlItems.length-1||1)*(chartW-2*pad)},${chartH-pad}`}/>
                <defs><linearGradient id="balgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--gold)" stopOpacity="0.15"/><stop offset="100%" stopColor="var(--gold)" stopOpacity="0"/></linearGradient></defs>
                <text x={pad} y={chartH-pad+14} fontSize="10" fill="var(--text-muted)">{tlItems[0]?.date}</text>
                <text x={chartW-pad} y={chartH-pad+14} fontSize="10" fill="var(--text-muted)" textAnchor="end">{tlItems[tlItems.length-1]?.date}</text>
                <text x={pad-4} y={pad+4} fontSize="10" fill="var(--text-muted)" textAnchor="end">{fmtBal(maxBal)}</text>
                <text x={pad-4} y={chartH-pad+4} fontSize="10" fill="var(--text-muted)" textAnchor="end">{fmtBal(minBal)}</text>
              </svg>
            </div>}

            {/* Daily / Statement toggle card */}
            <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,overflow:'hidden'}}>
              <div style={{padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid var(--border)'}}>
                <span style={{fontSize:10,fontWeight:500,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)'}}>{stmtView?'Statement View':'Daily Balances'}</span>
                <div style={{display:'flex',alignItems:'center',gap:14}}>
                  {stmtView&&reconcileData&&<span style={{fontSize:11,color:'var(--text-muted)',fontWeight:300}}>
                    {reconcileData.transaction_count} txns
                    {reconcileData.excluded_count>0&&<span style={{color:'var(--amber)',marginLeft:6}}>· {reconcileData.excluded_count} excluded</span>}
                  </span>}
                  {!stmtView&&<span style={{fontSize:11,color:'var(--text-muted)',fontWeight:300}}>{tlItems.length} days</span>}
                  <div style={{display:'flex',gap:16}}>
                    <button onClick={()=>setStmtView(false)}
                      style={{padding:'4px 0',border:'none',borderBottom:!stmtView?'2px solid var(--gold)':'2px solid transparent',cursor:'pointer',fontSize:11,fontWeight:!stmtView?500:400,
                        background:'transparent',color:!stmtView?'var(--gold)':'var(--text-muted)',transition:'all 0.15s'}}>Daily</button>
                    <button onClick={()=>setStmtView(true)}
                      style={{padding:'4px 0',border:'none',borderBottom:stmtView?'2px solid var(--gold)':'2px solid transparent',cursor:'pointer',fontSize:11,fontWeight:stmtView?500:400,
                        background:'transparent',color:stmtView?'var(--gold)':'var(--text-muted)',transition:'all 0.15s'}}>Statement</button>
                  </div>
                </div>
              </div>

              {stmtView
                /* ── Statement view: individual transactions + running balance ── */
                ? reconcileLoading
                  ? <div className="loading" style={{padding:24}}><div className="spinner"/><span>Loading…</span></div>
                  : !reconcileData||reconcileData.transactions.length===0
                    ? <div className="empty"><span>No transactions since the anchor date</span></div>
                    : <div className="table-wrap" style={{maxHeight:440,overflowY:'auto'}}>
                        <table>
                          <thead>
                            <tr>
                              <th>Date</th>
                              <th>Description</th>
                              <th style={{textAlign:'right'}}>Amount</th>
                              <th style={{textAlign:'right'}}>Balance</th>
                            </tr>
                          </thead>
                          <tbody>
                            {/* Anchor row (always first) */}
                            <tr style={{background:'var(--elevated)'}}>
                              <td style={{color:'var(--text-muted)',fontSize:12}}>{reconcileData.anchor_date||'—'}</td>
                              <td style={{fontSize:12,color:'var(--text-muted)',fontStyle:'italic'}}>⚓ Anchor — starting balance</td>
                              <td/>
                              <td style={{textAlign:'right',fontFamily:'DM Sans',fontWeight:500}}>{fmtBal(reconcileData.anchor_balance)}</td>
                            </tr>
                            {/* Transactions oldest→newest */}
                            {reconcileData.transactions.map(t=>(
                              <tr key={t.id} style={{opacity:t.is_excluded?0.4:1,background:t.is_excluded?'var(--elevated)':undefined}}>
                                <td style={{color:'var(--text-secondary)',fontSize:13}}>{t.date}</td>
                                <td>
                                  <div style={{fontSize:13,textDecoration:t.is_excluded?'line-through':'none'}}>{t.description}</div>
                                  <div style={{fontSize:11,color:'var(--text-muted)',marginTop:1}}>
                                    {t.action}{t.category&&t.action!=='Transfer'?` · ${t.category}`:''}
                                    {t.is_excluded?<span style={{color:'var(--amber)',marginLeft:4}}>excluded</span>:''}
                                    {t.needs_review?<span style={{color:'var(--amber)',marginLeft:4}}>· needs review</span>:''}
                                  </div>
                                </td>
                                <td style={{textAlign:'right'}}>
                                  <span className={t.amount>0?'amount-pos':'amount-neg'} style={{textDecoration:t.is_excluded?'line-through':'none'}}>
                                    {t.amount>0?'+':''}{fmt(Math.abs(t.amount))}
                                  </span>
                                </td>
                                <td style={{textAlign:'right',fontFamily:'DM Sans',fontSize:13,fontWeight:500,color:t.is_excluded?'var(--text-muted)':t.running_balance>=0?'var(--text-primary)':'var(--red)'}}>
                                  {t.is_excluded?'—':fmtBal(t.running_balance)}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>

                /* ── Daily summary view (existing) ── */
                : tlItems.length===0
                  ? <div className="empty"><span>No transaction data in this range</span></div>
                  : <div className="table-wrap" style={{maxHeight:380,overflowY:'auto'}}>
                      <table>
                        <thead><tr><th>Date</th><th>Daily Change</th><th>Balance</th></tr></thead>
                        <tbody>{[...tlItems].reverse().map(d=>(
                          <tr key={d.date}>
                            <td style={{color:'var(--text-secondary)',fontSize:13}}>{d.date}</td>
                            <td><span className={d.change>0?'amount-pos':d.change<0?'amount-neg':'amount-neutral'}>{d.change>0?'+':d.change<0?'-':''}{d.change!==0?fmt(Math.abs(d.change)):'—'}</span></td>
                            <td><span style={{fontFamily:'DM Sans',fontSize:13,fontWeight:500,color:d.balance>=0?'var(--text-primary)':'var(--red)'}}>{fmtBal(d.balance)}</span></td>
                          </tr>
                        ))}</tbody>
                      </table>
                    </div>
              }
            </div>
          </>
      }
    </>);
  };

  /* ── Main render ─────────────────────────────────────────────────────── */
  return(
    <div>
      {/* Top bar: As Of date + sub-tabs */}
      <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:16,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:11,color:'var(--text-muted)',fontWeight:400}}>As of</span>
          <input type="date" value={asOf} onChange={e=>{setAsOf(e.target.value);setTimeline(null);}}
            className="date-input" style={{padding:'4px 8px',fontSize:13}}/>
          <button className="btn btn-sm btn-ghost" onClick={()=>{setAsOf(todayStr);setTimeline(null);}}>Today</button>
        </div>
        <div style={{display:'flex',gap:20}}>
          <button onClick={()=>setSubTab('networth')}
            style={{padding:'5px 0',border:'none',borderBottom:subTab==='networth'?'2px solid var(--gold)':'2px solid transparent',cursor:'pointer',fontSize:12,fontWeight:subTab==='networth'?500:400,
              background:'transparent',color:subTab==='networth'?'var(--gold)':'var(--text-muted)',transition:'all 0.15s'}}>Net Worth</button>
          <button onClick={()=>setSubTab('balances')}
            style={{padding:'5px 0',border:'none',borderBottom:subTab==='balances'?'2px solid var(--gold)':'2px solid transparent',cursor:'pointer',fontSize:12,fontWeight:subTab==='balances'?500:400,
              background:'transparent',color:subTab==='balances'?'var(--gold)':'var(--text-muted)',transition:'all 0.15s'}}>Account Balances</button>
        </div>
      </div>

      {error&&<div style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{error}</div>}

      {subTab==='networth'?renderNWTab():renderBalancesTab()}
    </div>
  );
}
